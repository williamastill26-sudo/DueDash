<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DueDash</title>
  <link rel="icon" href="logo.png" />
  <style>
    :root{
      --bg:#f5f1ea;
      --bg-2:#efe9df;
      --card:rgba(255,255,255,.76);
      --card-strong:#f8f6f2;
      --line:#e2dbce;
      --text:#243127;
      --muted:#697466;
      --green:#5d7d61;
      --green-2:#42634a;
      --green-soft:#eaf1e9;
      --amber:#c59a52;
      --amber-soft:#f8f0df;
      --red:#b7604b;
      --red-soft:#f6e4e1;
      --shadow:0 18px 48px rgba(30,34,28,.08);
      --header:Georgia,"Times New Roman",serif;
      --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html{color-scheme:light}
    body{
      margin:0;
      min-height:100vh;
      font-family:var(--body);
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(122,147,122,.18), transparent 62%),
        radial-gradient(900px 500px at 100% 0%, rgba(186,156,117,.12), transparent 60%),
        linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%);
      line-height:1.5;
    }

    h1,h2,h3,h4{
      margin:0 0 8px;
      font-family:var(--header);
      letter-spacing:-.03em;
      color:var(--text);
      font-weight:600;
    }
    h2{font-size:32px}
    h3{font-size:22px}
    p{margin:0}
    a{color:inherit;text-decoration:none}

    button,input,select{
      font:inherit;
      color:var(--text);
    }

    button{
      border:1px solid transparent;
      background:linear-gradient(135deg,var(--green),var(--green-2));
      color:#fff;
      border-radius:12px;
      padding:10px 15px;
      font-weight:600;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow:0 8px 18px rgba(71,95,79,.18);
    }
    button:hover{transform:translateY(-1px);filter:brightness(1.02)}
    button:active{transform:translateY(0)}
    button.alt{
      background:#fff;
      border-color:var(--line);
      color:var(--text);
      box-shadow:none;
    }
    button.alt:hover{background:#f4f0ea}
    button.red{
      background:linear-gradient(135deg,var(--red),#9d4d42);
      box-shadow:0 8px 18px rgba(150,90,83,.18);
    }
    button.green{
      background:linear-gradient(135deg,#6d8f6d,#4e6b52);
      box-shadow:0 8px 18px rgba(69,104,83,.18);
    }
    button.link{
      background:none;
      border:none;
      box-shadow:none;
      color:var(--green-2);
      text-decoration:underline;
      text-underline-offset:3px;
      padding-left:0;
      padding-right:0;
    }
    button.link:hover{background:none;transform:none}
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    input,select{
      width:100%;
      background:rgba(255,255,255,.8);
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px 12px;
      outline:none;
      transition:border-color .12s ease, box-shadow .12s ease;
    }
    input::placeholder{color:#8b9489}
    input:focus,select:focus{
      border-color:var(--green);
      box-shadow:0 0 0 4px rgba(93,125,97,.12);
    }
    input[type=radio], input[type=checkbox]{
      width:auto;
      accent-color:var(--green);
    }

    .hidden{display:none!important}
    .sub{font-size:13px;color:var(--muted)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .two{display:flex;gap:14px;flex-wrap:wrap}
    .two > *{flex:1;min-width:260px}
    .pair{display:flex;gap:8px;align-items:flex-start}
    .pair input{flex:1}
    .tick{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text);margin-bottom:10px;white-space:nowrap}
    .opt.right input{border-color:#6fa06d;box-shadow:0 0 0 3px rgba(109,143,109,.12)}
    .opt.right .tick{color:var(--green-2);font-weight:700}
    .choice{
      display:block;width:100%;
      text-align:left;
      margin-bottom:8px;
      background:#fff;
      border-color:var(--line);
      color:var(--text);
      box-shadow:none;
    }
    .choice.green{background:#eaf4eb;border-color:rgba(93,125,97,.4)}
    .choice.red{background:#f6e4e1;border-color:rgba(182,96,75,.3)}
    .choice.alt{background:#fff}

    #auth{
      width:min(100% - 32px,420px);
      margin:10vh auto;
      padding:30px 24px 24px;
      background:rgba(255,255,255,.75);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .brand-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      margin:0 auto 18px;
    }

    .brand-svg{
      width:min(100%, 760px);
      height:auto;
      display:block;
      filter:drop-shadow(0 14px 20px rgba(32,48,38,.06));
    }

    #auth h2{text-align:center}
    .err{
      min-height:18px;
      margin:8px 0 12px;
      color:var(--red);
      font-size:13px;
    }

    #shell{
      display:flex;
      min-height:100vh;
    }
    nav{
      width:240px;
      background:rgba(255,255,255,.66);
      border-right:1px solid var(--line);
      padding:18px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      backdrop-filter:blur(12px);
    }

    nav .brand-svg{
      width:100%;
      max-width:180px;
      margin:0 auto 12px;
    }

    nav button{
      background:none;
      box-shadow:none;
      color:var(--text);
      border-radius:10px;
      text-align:left;
      padding:10px 12px;
      font-weight:500;
      display:flex;
      align-items:center;
      gap:10px;
    }
    nav button:hover{background:#f3efe9}
    nav button.on{
      background:linear-gradient(135deg,var(--green),var(--green-2));
      color:#fff;
      box-shadow:0 8px 22px rgba(65,98,75,.16);
    }
    .badge{
      margin-left:auto;
      background:var(--red);
      color:#fff;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      padding:1px 7px;
      min-width:20px;
      text-align:center;
      line-height:1.8;
    }
    .chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:auto;
      padding-top:10px;
      border-top:1px solid var(--line);
    }
    .chip{
      background:#f3efe9;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:600;
    }

    main{
      flex:1;
      min-width:0;
      max-width:1100px;
      padding:28px clamp(16px,4vw,42px);
    }

    .anim > *{animation:fade .24s ease both}
    @keyframes fade{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      margin-bottom:10px;
      box-shadow:0 2px 10px rgba(35,39,31,.02);
    }
    .card.row:hover{border-color:rgba(93,125,97,.36)}
    .stat{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px 14px;
      text-align:center;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:12px;
      margin:16px 0;
    }
    .stat b{
      display:block;
      font-size:28px;
      margin-bottom:3px;
      font-weight:700;
      letter-spacing:-.04em;
    }
    .stat span{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .pfp{
      width:72px;height:72px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:38px;background:rgba(93,125,97,.12);
      border:2px solid rgba(93,125,97,.8);
      flex:none;
    }
    .pfp.sm{
      width:42px;height:42px;
      font-size:22px;
      border-width:1px;
    }

    .big{
      min-height:220px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:28px;
      border-radius:18px;
      background:linear-gradient(145deg,#f6efe7,#f0f3ed);
      border:1px solid var(--line);
      gap:8px;
      cursor:pointer;
    }

    .empty{
      background:rgba(255,255,255,.46);
      border:1px dashed var(--line);
      border-radius:14px;
      text-align:center;
      padding:28px 18px;
      color:var(--muted);
    }

    .done .nm{text-decoration:line-through;opacity:.7}
    .overdue{color:var(--red)}

    .bar{
      width:100%;
      height:9px;
      border-radius:999px;
      background:#ece7df;
      overflow:hidden;
      margin:8px 0 6px;
    }
    .bar i{
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--green),#9dbf98);
      border-radius:999px;
    }

    .awards{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:12px;
    }
    .ach{
      background:rgba(255,255,255,.7);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      opacity:.72;
    }
    .ach.got{
      opacity:1;
      border-color:#d7c080;
      background:linear-gradient(180deg,#faf5eb,#f5efe6);
    }
    .ach .ic{font-size:30px;margin-bottom:8px}
    .ach.got .bar i{background:linear-gradient(90deg,#d9b25e,#b8892a)}

    .scene{
      position:relative;
      min-height:440px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:18px;
      padding:120px 16px 16px;
      flex-wrap:wrap;
      background:#dfe6d8;
      margin-bottom:12px;
    }
    .deco{
      position:absolute;
      top:12px;
      font-size:44px;
      opacity:.55;
      pointer-events:none;
    }
    .who{
      position:relative;
      text-align:center;
      width:120px;
    }
    .who svg{
      width:110px;height:auto;display:block;margin:0 auto;
      filter:drop-shadow(0 12px 18px rgba(0,0,0,.08));
    }
    .who .wn{
      display:inline-block;
      margin-top:7px;
      padding:2px 9px;
      border-radius:999px;
      background:rgba(26,31,26,.55);
      color:#fff;
      font-size:12px;
      font-weight:700;
    }
    .who .st{
      margin-top:4px;
      font-size:12px;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    .who .wp{
      position:absolute;
      right:0;bottom:48px;
      font-size:26px;
    }
    .bub{
      position:absolute;
      bottom:100%;
      left:50%;
      transform:translateX(-50%);
      margin-bottom:6px;
      background:#fff;
      color:#243127;
      border-radius:12px;
      padding:6px 10px;
      font-size:12.5px;
      font-weight:600;
      max-width:170px;
      width:max-content;
      text-align:center;
      box-shadow:0 10px 24px rgba(0,0,0,.12);
    }

    #chatlog{
      height:200px;
      overflow-y:auto;
      background:rgba(0,0,0,.03);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 12px;
    }
    .msg{
      margin:4px 0;
      font-size:14px;
      overflow-wrap:anywhere;
    }
    .msg b{color:var(--green-2)}
    .msg.me b{color:#5b8f5b}

    .chatrow{
      display:flex;
      gap:8px;
      margin-top:10px;
    }
    .chatrow input{margin:0}
    .chatrow button{
      white-space:nowrap;
      min-width:82px;
    }

    .lane{display:flex;align-items:center;gap:8px;margin:8px 0}
    .ln{
      width:120px;
      font-size:13px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .track{
      position:relative;
      flex:1;
      height:30px;
      background:rgba(122,147,122,.08);
      border:1px solid var(--line);
      border-radius:999px;
      overflow:hidden;
    }
    .track i{
      position:absolute;left:0;top:0;bottom:0;
      background:linear-gradient(90deg,rgba(93,125,97,.32),rgba(179,202,177,.48));
      transition:width .35s ease;
    }
    .rider{
      position:absolute;
      top:50%;
      transform:translate(-50%,-50%);
      font-size:20px;
      transition:left .35s ease;
    }
    .flag{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      font-size:15px;
    }
    .sc{
      width:52px;text-align:right;font-size:13px;font-weight:600;
    }
    .cd{
      font-weight:800;
      font-size:54px;
      text-align:center;
      padding:14px;
      letter-spacing:-.06em;
      color:var(--green-2);
    }

    .cal{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:8px;
      margin-top:16px;
    }
    .cal-w{
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      padding:5px 0 8px;
    }
    .cal-d{
      background:rgba(255,255,255,.72);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px;
      min-height:125px;
      font-size:12px;
    }
    .cal-d.today{
      border-color:var(--green);
      background:rgba(234,241,233,.9);
    }
    .cal-h{
      display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin-bottom:6px;
    }
    .cal-h span{
      font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
    }
    .cal-h b{font-size:13px}
    .cal-s{
      background:rgba(93,125,97,.12);
      border-radius:7px;
      padding:6px 6px;
      margin-top:5px;
    }
    .cal-s.done{opacity:.6}
    .cal-s.done .nm{text-decoration:line-through}
    .cal-t{font-size:10.5px;color:var(--muted)}
    .cal-s button{
      margin-top:5px;
      width:100%;
      padding:5px 8px;
      font-size:11px;
      border-radius:7px;
    }
    .cal-x{
      background:rgba(197,154,82,.12);
      border:1px solid rgba(197,154,82,.65);
      border-radius:7px;
      padding:5px 6px;
      margin-top:4px;
      font-weight:600;
    }
    .cal-r{
      color:var(--muted);font-size:11px;margin-top:8px;
    }

    #music{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:50;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
    }
    #mbtn{
      width:52px;height:52px;
      border-radius:50%;
      padding:0;
      font-size:22px;
      box-shadow:var(--shadow);
    }
    #mbtn.playing{
      animation:pulse 2s infinite;
    }
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(93,125,97,.38)}
      50%{box-shadow:0 0 0 12px rgba(93,125,97,0)}
    }
    #mpanel{
      width:250px;
      background:rgba(255,255,255,.95);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow:var(--shadow);
    }
    #mpanel button{
      width:100%;
      text-align:left;
      margin-bottom:6px;
    }
    #mpanel input[type=range]{padding:0;margin:8px 0 0}

    #toast{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translate(-50%,20px);
      background:linear-gradient(135deg,#d6ad6f,#c89a4b);
      color:#fff;
      box-shadow:0 12px 26px rgba(40,35,27,.14);
      border-radius:12px;
      padding:12px 18px;
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
      z-index:60;
      font-weight:700;
      max-width:90vw;
      text-align:center;
    }
    #toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media (max-width:760px){
      #shell{flex-direction:column}
      nav{
        position:static;
        width:100%;
        height:auto;
        border-right:none;
        border-bottom:1px solid var(--line);
        padding:12px;
        flex-direction:row;
        flex-wrap:wrap;
        align-items:center;
      }
      nav .brand-svg{max-width:110px; margin:0 8px 0 0}
      nav button{padding:8px 10px;font-size:13px}
      .chips{margin:8px 0 0;width:100%;padding-top:0;border-top:none}
      .cal{grid-template-columns:1fr}
      .cal-w,.cal-e{display:none}
      .cal-d{min-height:0}
    }
  </style>
</head>
<body>

    <div class="brand-wrap">

    </div>

    <h2 id="at">Log in</h2>
    <input id="em" type="email" placeholder="Email" autocomplete="email" />
    <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" />
    <div class="err" id="er"></div>
    <button id="ab" style="width:100%">Log in</button>
    <button id="sw" class="link" style="width:100%;margin-top:8px">New here? Create an account</button>
  </div>

  <div id="shell" class="hidden">
    <nav id="nav"></nav>
    <main id="main"></main>
    <div id="music">
      <div id="mpanel" class="hidden"></div>
      <button id="mbtn" data-act="mtoggle">🎵</button>
    </div>
  </div>

  <div id="toast"></div>

    const plus = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
    const shuffle = arr => { const x = [...arr]; for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };
    const ix = (arr, i) => arr[Math.abs(Math.trunc(+i || 0)) % arr.length];

    const NAME_RE = /^[A-Za-z0-9_]{3,20}$/;

    const errMsg = e => ({

    const genName = () => "Student" + Math.floor(1000 + Math.random()*9000);

    const music = {
      ctx: null,
      master: null,
      current: null,
      volume: 0.42,
      stops: []
    };

    const stopMusic = () => {
      music.stops.forEach(fn => { try { fn(); } catch (e) {} });
      music.stops = [];
      if (music.master) {
        try { music.master.disconnect(); } catch (e) {}
        music.master = null;
      }
      music.current = null;
    };

    const noiseSource = (ctx, brown) => {
      const len = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (brown) {
          last = (last + 0.02 * w) / 1.02;
          data[i] = last * 3.5;
        } else {
          data[i] = w * 0.5;
        }
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      src.start();
      return src;
    };

    const addRain = (ctx, out, amount) => {
      const src = noiseSource(ctx, false);
      const hp = ctx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 900;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 7000;
      const g = ctx.createGain();
      g.gain.value = amount;
      src.connect(hp);
      hp.connect(lp);
      lp.connect(g);
      g.connect(out);
      music.stops.push(() => src.stop());
    };

    const addOcean = (ctx, out) => {
      const src = noiseSource(ctx, true);
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 500;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.09;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.35;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);
      src.connect(lp);
      lp.connect(g);
      g.connect(out);
      lfo.start();
      music.stops.push(() => { src.stop(); lfo.stop(); });
    };

    const dreamNotes = [220, 261.63, 329.63, 392, 329.63, 261.63, 293.66, 349.23];
    const addDreamPad = (ctx, out) => {
      const master = ctx.createGain();
      master.gain.value = 0.1;
      master.connect(out);

      const delay = ctx.createDelay();
      delay.delayTime.value = 0.45;
      const fb = ctx.createGain();
      fb.gain.value = 0.22;
      delay.connect(fb);
      fb.connect(delay);

      let i = 0;
      const play = () => {
        const t = ctx.currentTime;
        const freq = dreamNotes[i % dreamNotes.length];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = "sine";
        osc.frequency.value = freq;
        filter.type = "lowpass";
        filter.frequency.value = 1200;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.08, t + 0.8);
        gain.gain.linearRampToValueAtTime(0.0001, t + 4.5);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        gain.connect(delay);
        osc.start(t);
        osc.stop(t + 4.8);
        i++;
      };
      play();
      const interval = setInterval(play, 2600);
      music.stops.push(() => clearInterval(interval));
    };

    const addQuietPiano = (ctx, out) => {
      const delay = ctx.createDelay();
      delay.delayTime.value = 0.32;
      const feedback = ctx.createGain();
      feedback.gain.value = 0.18;
      const wet = ctx.createGain();
      wet.gain.value = 0.2;
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(wet);
      wet.connect(out);

      const notes = [261.63, 329.63, 392, 329.63, 293.66, 349.23, 440, 349.23];
      let step = 0;
      const play = () => {
        const t = ctx.currentTime;
        const freq = notes[step++ % notes.length];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = "sine";
        osc.frequency.value = freq;
        filter.type = "lowpass";
        filter.frequency.value = 1500;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.055, t + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 2.8);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(out);
        gain.connect(delay);
        osc.start(t);
        osc.stop(t + 2.9);
      };
      play();
      const interval = setInterval(play, 2400);
      music.stops.push(() => clearInterval(interval));
    };

    const addPad = (ctx, out, chords, gap) => {
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 1100;
      const delay = ctx.createDelay();
      delay.delayTime.value = 0.45;
      const fb = ctx.createGain();
      fb.gain.value = 0.35;
      delay.connect(fb);
      fb.connect(delay);
      const bus = ctx.createGain();
      bus.gain.value = 0.55;
      bus.connect(lp);
      lp.connect(out);
      lp.connect(delay);
      delay.connect(out);

      let i = 0;
      const play = () => {
        const t = ctx.currentTime;
        const notes = chords[i++ % chords.length];
        notes.forEach(freq => {
          const osc = ctx.createOscillator();
          osc.type = "triangle";
          osc.frequency.value = freq;
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(.12, t + gap * .35);
          gain.gain.linearRampToValueAtTime(0, t + gap * 1.25);
          osc.connect(gain);
          gain.connect(bus);
          osc.start(t);
          osc.stop(t + gap * 1.3);
        });
      };
      play();
      const interval = setInterval(play, gap * 1000);
      music.stops.push(() => clearInterval(interval));
    };

    const addForest = (ctx, out) => {
      const left = ctx.createOscillator();
      left.type = "sine";
      left.frequency.value = 196;
      const right = ctx.createOscillator();
      right.type = "triangle";
      right.frequency.value = 293.66;
      const gain = ctx.createGain();
      gain.gain.value = 0.035;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 1800;
      left.connect(filter);
      right.connect(filter);
      filter.connect(gain);
      gain.connect(out);
      left.start();
      right.start();
      const interval = setInterval(() => {
        const f = left.frequency.value;
        left.frequency.setTargetAtTime(f * (Math.random() * 0.12 + 0.94), ctx.currentTime, 1.2);
      }, 1800);
      music.stops.push(() => { left.stop(); right.stop(); clearInterval(interval); });
    };

    const addChime = (ctx, out) => {
      const notes = [392, 523.25, 659.25];
      let i = 0;
      const play = () => {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = notes[i++ % notes.length];
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.06, t + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 2.8);
        osc.connect(gain);
        gain.connect(out);
        osc.start(t);
        osc.stop(t + 3);
      };
      play();
      const interval = setInterval(play, 4500);
      music.stops.push(() => clearInterval(interval));
    };

    const addNight = (ctx, out) => {
      const osc = ctx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = 110;
      const gain = ctx.createGain();
      gain.gain.value = 0.03;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.18;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 18;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      osc.connect(gain);
      gain.connect(out);
      osc.start();
      music.stops.push(() => osc.stop());
    };

    const CH1 = [[220,261.63,329.63,392],[174.61,220,261.63,329.63],[261.63,329.63,392,493.88],[196,246.94,293.66,329.63]];
    const CH2 = [[146.83,174.61,220,261.63],[196,246.94,293.66,329.63],[130.81,164.81,196,246.94,293.66],[220,261.63,329.63,392]];
    const musicPlay = key => {
      stopMusic();
      const ctx = music.ctx || (music.ctx = new (window.AudioContext || window.webkitAudioContext)());
      ctx.resume();
      const out = ctx.createGain();
      out.gain.value = music.volume;
      out.connect(ctx.destination);
      music.master = out;
      if (key === "dream") addDreamPad(ctx, out);
      if (key === "pad") addPad(ctx, out, CH1, 6);
      if (key === "piano") addQuietPiano(ctx, out);
      if (key === "lofi") { addPad(ctx, out, CH2, 4); addRain(ctx, out, .12); }
      if (key === "rain") addRain(ctx, out, .45);
      if (key === "ocean") addOcean(ctx, out);
      if (key === "forest") addForest(ctx, out);
      if (key === "chime") addChime(ctx, out);
      if (key === "night") addNight(ctx, out);
      music.current = key;
    };

    const tracks = [
      ["dream","🌿 Dreamy ambient"],
      ["pad","🌙 Calm pad"],
      ["piano","🎹 Quiet piano"],
      ["lofi","☕ Lo-fi chill"],

      ["ocean","🌊 Ocean waves"],

    const save = async patch => {

      await updateDoc(doc(db, "users", state.user.uid), patch);

    async function syncProfile() {
      if (!state.user) return;
      const p = state.profile || {};
      await setDoc(doc(db, "leaderboard", state.user.uid), {
        username: p.username || "Student",
        points: p.points || 0,
        streak: liveStreak(p)
      });
      await setDoc(doc(db, "profiles", state.user.uid), {
        username: p.username || "Student",
        emoji: p.emoji || "😀",
        points: p.points || 0,

        racesWon: p.racesWon || 0,
        pet: p.pet || { name:"Buddy", species:"🐱" }
      });
    }

    const earn = async (n, extra = {}) => {
      if (!state.profile) return;
      const today = day();
      let streak = state.profile.streak || 0;
      if (state.profile.lastDay !== today) streak = state.profile.lastDay === day(1) ? streak + 1 : 1;
      const currentGoal = (state.profile.goalDay === today ? (state.profile.goalPts || 0) : 0) + n;
      let bonus = 0;
      let goalDone = state.profile.goalDone || "";
      if (goalDone !== today && currentGoal >= GOAL) {
        bonus = 5;
        goalDone = today;
        setTimeout(() => toast("🎯 Daily goal complete! +5 bonus points"), 300);
      }
      await save({
        points: (state.profile.points || 0) + n + bonus,
        streak,
        bestStreak: Math.max(state.profile.bestStreak || 0, streak),
        lastDay: today,
        goalDay: today,
        goalPts: currentGoal,
        goalDone,
        ...extra
      });
    };

    async function ensureUsername() {
      const old = state.profile.username;
      let name = old;
      for (let t = 0; t < 12; t++) {
        if (NAME_RE.test(name)) {
          const ref = doc(db, "usernames", name.toLowerCase());
          const snap = await getDoc(ref);
          if (snap.exists()) {
            if (snap.data().uid === state.user.uid) {
              if (name !== old) await save({ username: name });
              return;
            }
          } else {
            try {
              await setDoc(ref, { uid: state.user.uid, username: name });
              if (name !== old) {
                await save({ username: name });
                toast("Your username is now " + name + " because the old one was taken or not allowed.");
              }
              return;
            } catch (e) {}
          }
        }
        name = genName();
      }
    }

          backdrop: 0,

        if (!snap.exists()) await setDoc(ref, state.profile);
        await ensureUsername();

        $("auth").classList.add("hidden");
        $("shell").classList.remove("hidden");

    $("sw").onclick = () => {

    const renderNav = () => {
      if (!state.profile) return;
      const f = (state.view === "study" && state.study) ? state.study.from : (state.view === "qtake" && state.quizTake) ? state.quizTake.from : "";
      const nav = [
        ["planner","📅","Planner"],
        ["rev","🗓️","Revision"],
        ["decks","📚","My Decks"],
        ["quizzes","📝","My Quizzes"],
        ["explore","🔍","Explore"],
        ["rooms","🏠","Study Rooms"],
        ["friends","👥","Friends"],
        ["notifs","🔔","Notifications"],
        ["pet","🐾","My Pet"],
        ["leaders","🏆","Leaderboard"],
        ["account","👤","Account"]
      ];

      const on = key => {
        if (state.view === key) return "on";
        if (key === "decks" && (state.view === "edit" || f === "decks")) return "on";
        if (key === "quizzes" && (state.view === "qedit" || f === "quizzes")) return "on";
        if (key === "explore" && f === "explore") return "on";
        if (key === "rooms" && state.view === "room") return "on";
        if (key === "friends" && state.view === "profile") return "on";
        return "";

      $("nav").innerHTML = `
        <div class="brand-wrap" style="margin-bottom:8px; width:100%">
          ${logoSvg("nav")}
        </div>
        ${nav.map(([k, icon, label]) => `
          <button data-go="${k === "rooms" && state.room ? "room" : k}" class="${on(k)}">
            <span>${icon}</span>
            ${label}
            ${k === "notifs" && state.notify && state.notify.length ? `<span class="badge">${state.notify.length}</span>` : ""}
          </button>
