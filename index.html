        <div class="chips">
          <span class="chip">${esc(state.profile.emoji || "😀")}</span>
          <span class="chip">⭐ ${state.profile.points || 0}</span>
          <span class="chip">🔥 ${liveStreak(state.profile)}</span>
          <span class="chip">${petEmoji(state.profile)} Lv ${levelOf(state.profile)}</span>
        </div>
        <button class="alt" data-act="out">Log out</button>
      `;
    };

    const newDeck = () => ({
      title: "",
      cards: [{ front: "", back: "" }],
      isPublic: false
    });

    const newQuiz = () => ({
      title: "",
      questions: [{ type: "mc", q: "", opts: ["","","",""], ans: 0 }],
      isPublic: false
    });

    const createDeckDraft = deck => ({
      id: deck?.id || null,
      title: deck?.title || "",
      cards: deck?.cards ? deck.cards.map(c => ({ ...c })) : [{ front: "", back: "" }],
      isPublic: !!deck?.isPublic,
      wasPublic: !!deck?.isPublic
    });

    const createQuizDraft = quiz => ({
      id: quiz?.id || null,
      title: quiz?.title || "",
      questions: quiz?.questions ? JSON.parse(JSON.stringify(quiz.questions)) : [{ type: "mc", q: "", opts: ["","","",""], ans: 0 }],
      isPublic: !!quiz?.isPublic,
      wasPublic: !!quiz?.isPublic
    });

    const vPlanner = () => {
      const rows = (state.profile.tasks || []).map((task, i) => {
        const over = task.due && !task.done && task.due < day();
        return `
          <div class="card row ${task.done ? "done" : ""}">
            <div>
              <div class="nm">${esc(task.name)}</div>
              <div class="sub ${over ? "overdue" : ""}">${task.due ? (over ? "⚠️ Overdue · " : "Due: ") + esc(task.due) : ""}</div>
            </div>
            <div>
              ${task.done ? "" : `<button data-act="done" data-i="${i}">Done +5</button> `}
              <button class="alt" data-act="deltask" data-i="${i}">Delete</button>
            </div>
          </div>
        `;
      }).join("");

      return `
        <h2>Hi, ${esc(state.profile.emoji || "😀")} ${esc(state.profile.username)} 👋</h2>
        <p class="sub">Here's what's on your plate.</p>
        <div class="stats">
          <div class="stat"><b>⭐ ${state.profile.points || 0}</b><span>points</span></div>
          <div class="stat"><b>🔥 ${liveStreak(state.profile)}</b><span>day streak</span></div>
          <div class="stat"><b>✅ ${state.profile.tasksDone || 0}</b><span>tasks done</span></div>
        </div>

        <div class="card row">
          <div style="display:flex;gap:12px;align-items:center">
            <span style="font-size:40px">${petEmoji(state.profile)}</span>
            <div>
              <b>${esc((state.profile.pet && state.profile.pet.name) || "Buddy")}</b>
              <div class="sub">Level ${levelOf(state.profile)}</div>
            </div>
          </div>
          <div style="flex:1;min-width:200px">
            <b>🎯 Daily goal</b>
            ${goalBar()}
          </div>
        </div>

        <div class="card">
          <input id="tk" placeholder="Task, like Math worksheet" maxlength="100" />
          <input id="td" type="date" />
          <button data-act="addtask">+ Add task</button>
          <div class="sub" style="margin-top:8px">🔔 Tasks due tomorrow send a reminder to your notifications.</div>
        </div>

        ${rows || '<div class="empty">No tasks yet. Add your first one above! ✨</div>'}
      `;
    };

    const goalBar = () => {
      const gp = Math.min(GOAL, state.profile.goalDay === day() ? (state.profile.goalPts || 0) : 0);
      return `
        <div class="bar"><i style="width:${(gp / GOAL) * 100}%"></i></div>
        <div class="sub">${gp} / ${GOAL} points today${gp >= GOAL ? " ✅ goal done!" : " · hit the goal for +5 bonus"}</div>
      `;
    };

    const vRev = () => {
      const t0 = plus(0);
      const examList = (state.profile.exams || []).map((e, i) => ({ ...e, i })).sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const plan = buildPlanDays();
      const slotTime = k => {
        const [h, m] = (state.profile.revStart || "16:00").split(":").map(Number);
        const studyMins = state.profile.studyMin || 45;
        const breakMins = state.profile.breakMin === undefined ? 15 : state.profile.breakMin;
        const minutes = h * 60 + m + k * (studyMins + breakMins);
        const fmt = mins => {
          let hh = Math.floor(mins / 60) % 24;
          const mm = mins % 60;
          const ampm = hh >= 12 ? "PM" : "AM";
          hh = hh % 12 || 12;
          return `${hh}:${String(mm).padStart(2, "0")} ${ampm}`;
        };
        return fmt(minutes) + " – " + fmt(minutes + studyMins);
      };

      const cell = x => {
        const d = new Date(x.d + "T00:00:00");
        const dayName = d.toLocaleDateString(undefined, { weekday:"short" });
        const shortDate = d.toLocaleDateString(undefined, { day:"numeric", month:"short" });
        const examMarkup = x.exams.map(e => `<div class="cal-x">📝 Exam: ${esc(e.subject)}</div>`).join("");
        const slotsMarkup = x.slots.map((subject, idx) => {
          const key = x.d + "|" + idx + "|" + subject;
          const done = !!(state.profile.revDone && state.profile.revDone[key]);
          return `
            <div class="cal-s ${done ? "done" : ""}">
              <div class="cal-t">🕒 ${slotTime(idx)}</div>
              <div class="nm">📖 ${esc(subject)}</div>
              ${done ? "<div>✅ Done</div>" : x.d === t0 ? `<button data-act="rdone" data-k="${esc(key)}">Done +10</button>` : ""}
            </div>
          `;
        }).join("");
        const rest = (!x.slots.length && !x.exams.length) ? "<div class='cal-r'>Rest day 🌿</div>" : "";
        return `
          <div class="cal-d ${x.d === t0 ? "today" : ""}">
            <div class="cal-h"><span>${dayName}</span><b>${shortDate}</b></div>
            ${examMarkup}${slotsMarkup}${rest}
          </div>
        `;
      };

      let grid = "";
      if (plan.length) {
        const lead = (new Date(plan[0].d + "T00:00:00").getDay() + 6) % 7;
        grid = `
          <h3>Your study calendar</h3>
          <div class="cal">
            ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(n => `<div class="cal-w">${n}</div>`).join("")}
            ${"<div class='cal-e'></div>".repeat(lead)}
            ${plan.map(cell).join("")}
          </div>
        `;
      }

      const sm = state.profile.studyMin || 45;
      const bm = state.profile.breakMin === undefined ? 15 : state.profile.breakMin;

      return `
        <h2>Revision Planner</h2>
        <p class="sub">Add your exams and DueDash builds your study calendar, with more sessions for the exams coming up soonest.</p>

        <div class="card">
          <h3 style="margin-top:0">Your exams</h3>
          ${examList.length ? examList.map(e => `
            <div class="row" style="margin-bottom:8px">
              <span>📝 <b>${esc(e.subject)}</b> · ${esc(e.date)}</span>
              <button class="alt" data-act="xdel" data-i="${e.i}">Remove</button>
            </div>
          `).join("") : '<p class="sub">No exams yet.</p>'}

          <input id="xs" placeholder="Subject, like Maths" maxlength="30" />
          <input id="xd" type="date" min="${t0}" />
          <button data-act="xadd">+ Add exam</button>

          <h3>⏱️ Your study schedule</h3>
          <div class="sub" style="margin-top:6px">Study sessions per day:
            <select id="rp">${[1,2,3,4,5,6].map(v => `<option value="${v}" ${state.profile.revPer === v ? "selected" : ""}>${v}</option>`).join("")}</select>
          </div>
          <div class="sub" style="margin-top:10px">Study length:
            <select id="rsm">${[15,20,25,30,45,50,60,75,90,120].map(v => `<option value="${v}" ${sm === v ? "selected" : ""}>${v} min</option>`).join("")}</select>
            · Break length:
            <select id="rbm">${[0,5,10,15,20,30].map(v => `<option value="${v}" ${bm === v ? "selected" : ""}>${v === 0 ? "No break" : v + " min"}</option>`).join("")}</select>
          </div>
          <div class="sub" style="margin-top:10px">First session starts at:
            <input id="rstart" type="time" value="${esc(state.profile.revStart || "16:00")}" style="width:auto;margin:0 0 0 6px;padding:7px 10px" />
          </div>
          <div class="sub" style="margin-top:8px">🔔 You get a reminder the day before each exam.</div>
        </div>

        ${plan.length ? grid : '<div class="empty">Add an exam date to see your study calendar 📅</div>'}
      `;
    };

    const buildPlanDays = () => {
      const t0 = plus(0);
      const exams = (state.profile.exams || []).filter(e => e.date >= t0);
      if (!exams.length) return [];
      const lastDate = exams.reduce((m, e) => e.date > m ? e.date : m, "");
      const used = {};
      exams.forEach(e => used[e.subject + e.date] = 0);
      const out = [];
      for (let offset = 0; offset <= 120; offset++) {
        const d = plus(offset);
        if (d > lastDate) break;
        const active = exams.filter(e => e.date > d);
        const slots = [];
        if (active.length) {
          for (let s = 0; s < (state.profile.revPer || 2); s++) {
            let best = null, bestScore = -1;
            active.forEach(e => {
              const left = Math.max(1, Math.round((new Date(e.date + "T00:00:00") - new Date(d + "T00:00:00")) / 864e5));
              const score = (1 / left) / (used[e.subject + e.date] + 1);
              if (score > bestScore) { bestScore = score; best = e; }
            });
            if (!best) break;
            used[best.subject + best.date]++;
            slots.push(best.subject);
          }
        }
        out.push({ d, slots, exams: exams.filter(e => e.date === d) });
      }
      return out;
    };

    const vDecks = () => `
      <h2>My Decks</h2>
      <p class="sub">Flashcards you made.</p>
      <button data-act="newdeck">+ New deck</button>
      <br /><br />
      ${state.decks.length ? state.decks.map(d => `
        <div class="card row">
          <div>
            <b>${esc(d.title)}</b>
            <div class="sub">${d.cards.length} cards · ${d.isPublic ? "Public" : "Private"}</div>
          </div>
          <div>
            <button data-act="study" data-id="${d.id}">Study</button>
            <button class="alt" data-act="editdeck" data-id="${d.id}">Edit</button>
            <button class="red" data-act="deldeck" data-id="${d.id}">Delete</button>
          </div>
        </div>
      `).join("") : '<div class="empty">No decks yet. Make your first one!</div>'}
    `;

    const vEditDeck = () => {
      if (!state.currentDeckDraft) return "";
      return `
        <h2>${state.currentDeckDraft.id ? "Edit" : "New"} deck</h2>
        <input id="dt" placeholder="Deck title" maxlength="60" value="${esc(state.currentDeckDraft.title)}" />
        ${state.currentDeckDraft.cards.map((card, i) => `
          <div class="card">
            <input data-f="front" data-i="${i}" placeholder="Front (question)" maxlength="200" value="${esc(card.front)}" />
            <input data-f="back" data-i="${i}" placeholder="Back (answer)" maxlength="200" value="${esc(card.back)}" />
            <button class="alt" data-act="delcard" data-i="${i}">Remove card</button>
          </div>
        `).join("")}
        <button class="alt" data-act="addcard">+ Add card</button>
        <br /><br />
        <label><input type="checkbox" id="dp" ${state.currentDeckDraft.isPublic ? "checked" : ""} /> Make public so other people can find it</label>
        <p class="sub">Only share kind, safe stuff. Never put personal info in a public deck.</p>
        <button data-act="savedeck">Save deck</button>
        <button class="alt" data-go="decks">Cancel</button>
      `;
    };

    const vStudy = () => {
      if (!state.study) return "";
      const c = state.study.cards[state.study.i];
      if (!c) return `
        <h2>🎉 Deck complete!</h2>
        <p>You got ${state.study.got} of ${state.study.cards.length}. Bonus +10 points!</p>
        <button data-go="${state.study.from}">Back</button>
      `;
      return `
        <h2>${esc(state.study.title)}</h2>
        <p class="sub">Card ${state.study.i + 1} of ${state.study.cards.length}</p>
        <div class="card big" data-act="flip">${esc(state.study.flip ? c.back : c.front)}<div class="sub">${state.study.flip ? "Answer" : "Tap to flip"}</div></div>
        ${state.study.flip ? `<button data-act="got">Got it +1</button> <button class="alt" data-act="again">Again</button>` : ""}
      `;
    };

    const vQuizzes = () => `
      <h2>My Quizzes</h2>
      <p class="sub">Multiple choice, true or false, and match.</p>
      <button data-act="newquiz">+ New quiz</button>
      <br /><br />
      ${state.quizes.length ? state.quizes.map(d => `
        <div class="card row">
          <div>
            <b>${esc(d.title)}</b>
            <div class="sub">${d.questions.length} questions · ${d.isPublic ? "Public" : "Private"}</div>
          </div>
          <div>
            <button data-act="qtake" data-id="${d.id}">Take</button>
            <button class="alt" data-act="qedit" data-id="${d.id}">Edit</button>
            <button class="red" data-act="qdel" data-id="${d.id}">Delete</button>
          </div>
        </div>
      `).join("") : '<div class="empty">No quizzes yet. Make your first one!</div>'}
    `;

    const qBody = (question, qi) => {
      if (question.type === "tf") {
        return `
          <label class="tick"><input type="radio" name="tf${qi}" data-qf="tf" data-qi="${qi}" data-v="1" ${question.ans ? "checked" : ""} /> True</label>
          <label class="tick"><input type="radio" name="tf${qi}" data-qf="tf" data-qi="${qi}" data-v="0" ${question.ans ? "" : "checked"} /> False</label>
          <div class="sub">Pick whether the statement above is true or false.</div>
        `;
      }

      if (question.type === "match") {
        return `
          ${question.pairs.map((p, pi) => `
            <div class="pair">
              <input data-qf="l" data-qi="${qi}" data-pi="${pi}" placeholder="Item ${pi + 1}" maxlength="80" value="${esc(p.l)}" />
              <input data-qf="r" data-qi="${qi}" data-pi="${pi}" placeholder="Its match" maxlength="80" value="${esc(p.r)}" />
            </div>
          `).join("")}
          <div class="sub">Fill in at least 2 pairs. They get shuffled when someone takes the quiz.</div>
        `;
      }

      return `
        ${question.opts.map((o, oi) => `
          <div class="opt ${question.ans === oi ? "right" : ""}">
            <label class="tick">
              <input type="radio" name="ans${qi}" data-qf="ans" data-qi="${qi}" data-oi="${oi}" ${question.ans === oi ? "checked" : ""} />
              ${question.ans === oi ? "✓ Correct" : "Mark correct"}
            </label>
            <input data-qf="opt" data-qi="${qi}" data-oi="${oi}" placeholder="Answer ${"ABCD"[oi]}" maxlength="120" value="${esc(o)}" />
          </div>
        `).join("")}
        <div class="sub">Click “Mark correct” next to the right answer. The answers get shuffled when someone takes the quiz.</div>
      `;
    };

    const vQEdit = () => {
      if (!state.currentQuizDraft) return "";
      return `
        <h2>${state.currentQuizDraft.id ? "Edit" : "New"} quiz</h2>
        <input id="qt" placeholder="Quiz title" maxlength="60" value="${esc(state.currentQuizDraft.title)}" />
        ${state.currentQuizDraft.questions.map((question, qi) => `
          <div class="card">
            <div class="row" style="margin-bottom:10px">
              <b>Question ${qi + 1}</b>
              <select data-qf="type" data-qi="${qi}">
                <option value="mc" ${question.type === "mc" ? "selected" : ""}>Multiple choice</option>
                <option value="tf" ${question.type === "tf" ? "selected" : ""}>True / False</option>
                <option value="match" ${question.type === "match" ? "selected" : ""}>Match</option>
              </select>
            </div>
            <input data-qf="q" data-qi="${qi}" placeholder="${question.type === "match" ? "Instructions (like: Match each country to its capital)" : question.type === "tf" ? "Statement (like: The sun is a star)" : "Question"}" maxlength="200" value="${esc(question.q || "")}" />
            ${qBody(question, qi)}
            ${state.currentQuizDraft.questions.length > 1 ? `<br /><button class="alt" data-act="qdelq" data-i="${qi}">Remove question</button>` : ""}
          </div>
        `).join("")}
        <button class="alt" data-act="qaddq">+ Add question</button>
        <br /><br />
        <label><input type="checkbox" id="qp" ${state.currentQuizDraft.isPublic ? "checked" : ""} /> Make public so other people can find it</label>
        <p class="sub">Only share kind, safe stuff. Never put personal info in a public quiz.</p>
        <button data-act="qsave">Save quiz</button>
        <button class="alt" data-go="quizzes">Cancel</button>
      `;
    };

    const vQTake = () => {
      if (!state.quizTake) return "";
      const question = state.quizTake.questions[state.quizTake.i];
      if (!question) {
        const pts = state.quizTake.correct * 2 + (state.quizTake.correct === state.quizTake.questions.length ? 10 : 0);
        return `
          <h2>🎉 Quiz complete!</h2>
          <p>You got ${state.quizTake.correct} of ${state.quizTake.questions.length} right. +${pts} points!</p>
          <button data-go="${state.quizTake.from}">Back</button>
        `;
      }

      const type = question.type || "mc";
      const head = `
        <h2>${esc(state.quizTake.title)}</h2>
        <p class="sub">Question ${state.quizTake.i + 1} of ${state.quizTake.questions.length} · ${type === "tf" ? "True or false" : type === "match" ? "Match" : "Multiple choice"}</p>
        <div class="card"><b>${esc(question.q)}</b></div>
      `;

      let body = "", done = false, correct = false;

      if (type === "tf") {
        done = state.quizTake.sel !== null;
        correct = state.quizTake.sel === question.ans;
        body = [[true, "True"], [false, "False"]].map(([val, label]) => {
          const answerValue = val ? 1 : 0;
          return `<button class="choice ${done ? (answerValue === Number(question.ans) ? "green" : answerValue === Number(state.quizTake.sel) ? "red" : "alt") : "alt"}" data-act="pickTF" data-i="${answerValue}" ${done ? "disabled" : ""}>${label}</button>`;
        }).join("");
      } else if (type === "match") {
        done = state.quizTake.chk;
        correct = done && question.pairs.every((p, k) => state.quizTake.m[k] === p.r);
        body = matchRows(question) + (done ? "" : `<button data-act="mcheck">Check answers</button>`);
      } else {
        done = state.quizTake.sel !== null;
        correct = state.quizTake.sel === question.ans;
        body = state.quizTake.order.map((optIndex, pos) =>
          `<button class="choice ${done ? (optIndex === question.ans ? "green" : optIndex === state.quizTake.sel ? "red" : "alt") : "alt"}" data-act="pick" data-i="${optIndex}" ${done ? "disabled" : ""}>${"ABCD"[pos]}. ${esc(question.opts[optIndex])}</button>`
        ).join("");
      }

      const msg = done ? `<p>${correct ? "✅ Correct!" : "❌ Not quite."}</p>` : "";
      const next = done ? `<button data-act="qnext">${state.quizTake.i + 1 >= state.quizTake.questions.length ? "Finish" : "Next"}</button>` : "";

      return head + body + msg + next;
    };

    const matchRows = x => {
      if (!state.quizTake || !state.quizTake.order) return "";
      return x.pairs.map((pair, k) => {
        const options = state.quizTake.order.map(j => x.pairs[j].r).map(r => `<option value="${esc(r)}" ${state.quizTake.m[k] === r ? "selected" : ""}>${esc(r)}</option>`).join("");
        const mark = state.quizTake.chk ? (state.quizTake.m[k] === pair.r ? " ✅" : " ❌ " + esc(pair.r)) : "";
        return `
          <div class="card row">
            <b>${esc(pair.l)}</b>
            <span>
              <select data-mi="${k}" ${state.quizTake.chk ? "disabled" : ""}>
                <option value="">Choose...</option>
                ${options}
              </select>
              ${mark}
            </span>
          </div>
        `;
      }).join("");
    };

    const vExplore = () => `
      <h2>Explore</h2>
      <p class="sub">Decks and quizzes other people made public.</p>
      <br />
      <input id="sq" placeholder="🔍 Search by title..." value="${esc(state.search || "")}" />
      <div id="results">${exploreList()}</div>
    `;

    const exploreList = () => {
      const s = (state.search || "").trim().toLowerCase();
      const deckResults = state.pubDecks.filter(d => String(d.title).toLowerCase().includes(s));
      const quizResults = state.pubQuizes.filter(d => String(d.title).toLowerCase().includes(s));

      return `
        <h3>📚 Flashcard decks</h3>
        ${deckResults.length ? deckResults.map(d => `
          <div class="card row">
            <div>
              <b>${esc(d.title)}</b>
              <div class="sub">by ${esc(d.ownerName)} · ${d.cards.length} cards</div>
            </div>
            <div>
              <button data-act="study" data-id="${d.id}">Study</button>
              <button class="alt" data-act="copydeck" data-id="${d.id}">Save copy</button>
            </div>
          </div>
        `).join("") : `<div class="empty">${s ? "No decks match your search." : "No public decks yet. Be the first to share one!"}</div>`}

        <h3>📝 Quizzes</h3>
        ${quizResults.length ? quizResults.map(d => `
          <div class="card row">
            <div>
              <b>${esc(d.title)}</b>
              <div class="sub">by ${esc(d.ownerName)} · ${d.questions.length} questions</div>
            </div>
            <div>
              <button data-act="qtake" data-id="${d.id}">Take</button>
              <button class="alt" data-act="copyquiz" data-id="${d.id}">Save copy</button>
            </div>
          </div>
        `).join("") : `<div class="empty">${s ? "No quizzes match your search." : "No public quizzes yet. Be the first to share one!"}</div>`}
      `;
    };

    const vFriends = () => {
      let res = "";
      if (state.searchResult) {
        if (state.searchResult.msg) res = `<div class="sub" style="margin-top:6px">${esc(state.searchResult.msg)}</div>`;
        else {
          const alreadyFriend = state.friends.some(f => f.uid === state.searchResult.uid);
          res = `
            <div class="row" style="margin-top:6px">
              <b>👤 ${esc(state.searchResult.username)}</b>
              ${alreadyFriend ? "<span>✅ Already friends</span>" : `<button data-act="freq" data-id="${esc(state.searchResult.uid)}">+ Send friend request</button>`}
            </div>
          `;
        }
      }

      const rows = state.friends.map(f => `
        <div class="card row">
          <div style="display:flex;gap:12px;align-items:center">
            <div class="pfp sm">${esc(f.emoji || "😀")}</div>
            <div>
              <b>${esc(f.username || "(unknown)")}</b>
              <div class="sub">⭐ ${f.points || 0} · 🔥 ${liveStreak(f)} · Pet Lv ${levelOf(f)}</div>
            </div>
          </div>
          <div>
            <button data-act="fview" data-id="${esc(f.uid)}">View profile</button>
            <button class="alt" data-act="fremove" data-id="${esc(f.uid)}">Remove</button>
          </div>
        </div>
      `).join("");

      return `
        <h2>Friends</h2>
        <p class="sub">Search a username to send a friend request. Friends can see each other's profiles.</p>

        <div class="card">
          <div class="pair">
            <input id="fs" placeholder="Search a username" maxlength="20" value="${esc(state.searchUser)}" />
            <button data-act="fsearch" style="white-space:nowrap">🔍 Search</button>
          </div>
          ${res}
        </div>

        <h3>Your friends · ${state.friends.length}</h3>
        ${rows || '<div class="empty">No friends yet. Search a username above to add one! 👥</div>'}
      `;
    };

    const vProfile = () => {
      const p = state.profileView || state.profile;
      if (!p) return `<h2>Profile</h2><div class="empty">Couldn't load this profile.</div><br /><button data-go="friends">Back</button>`;
      const L = levelOf(p);
      const pet = L < 2 ? "🥚" : (p.pet && p.pet.species) || "🐱";
      const S = (icon, val, label) => `<div class="stat"><b>${icon} ${val}</b><span>${label}</span></div>`;
      return `
        <button class="alt" data-go="friends">← Back to friends</button><br /><br />
        <div class="card row">
          <div style="display:flex;gap:16px;align-items:center">
            <div class="pfp">${esc(p.emoji || "😀")}</div>
            <div>
              <h2 style="margin:0">${esc(p.username || "Student")}</h2>
              <div class="sub">Your friend 👥</div>
            </div>
          </div>
          <button class="alt" data-act="fremove" data-id="${esc(p.uid)}">Remove friend</button>
        </div>

        <div class="stats">
          ${S("⭐", p.points || 0, "points")}
          ${S("🔥", liveStreak(p), "day streak")}
          ${S("🏁", bestStreak(p), "best streak")}
          ${S(pet, L, "pet level")}
          ${S("📚", p.cardsStudied || 0, "cards studied")}
          ${S("✅", p.tasksDone || 0, "tasks done")}
          ${S("📝", p.quizzesTaken || 0, "quizzes finished")}
          ${S("🏗️", p.decksMade || 0, "decks made")}
          ${S("🎯", p.focusDone || 0, "focus sessions")}
          ${S("🗓️", p.revisionDone || 0, "revision sessions")}
          ${S("🏠", p.roomsJoined || 0, "rooms joined")}
        </div>
      `;
    };

    const vNotifs = () => `
      <h2>🔔 Notifications</h2>
      <p class="sub">Friend requests, room invites and reminders.</p>
      <br />
      ${state.notify.length ? state.notify.map(n => {
        const when = new Date(n.at || 0).toLocaleString(undefined, { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" });
        const id = esc(n.id);
        const btns = n.type === "friend"
          ? `<button class="green" data-act="nacc" data-id="${id}">Accept</button> <button class="alt" data-act="ndec" data-id="${id}">Decline</button>`
          : n.type === "invite"
          ? `<button class="green" data-act="njoin" data-id="${id}">Join room</button> <button class="alt" data-act="ndec" data-id="${id}">Decline</button>`
          : `<button class="alt" data-act="ndec" data-id="${id}">Dismiss</button>`;
        return `
          <div class="card row">
            <div>
              <div>${n.type === "friend" ? "👥" : n.type === "invite" ? "🏠" : "🔔"} ${esc(n.text || "")}</div>
              <div class="sub">${esc(when)}</div>
            </div>
            <div>${btns}</div>
          </div>
        `;
      }).join("") : '<div class="empty">All caught up! Friend requests, invites and reminders will show up here 🔔</div>'}
    `;

    const vPet = () => {
      const L = levelOf(state.profile);
      const lo = 10 * (L - 1) ** 2;
      const hi = 10 * L ** 2;
      const pct = Math.max(0, Math.min(100, Math.round((state.profile.points - lo) / (hi - lo) * 100)));
      const mood = state.profile.lastDay === day() ? "😊 Happy, you studied today!" : state.profile.lastDay === day(1) ? "🙂 Okay. Study today to keep it happy." : "😴 Sleepy. Study to wake it up!";
      const stage = L < 2 ? "Egg" : L < 5 ? "Baby" : L < 10 ? "Teen" : "Legend";
      return `
        <h2>My Pet</h2>
        <p class="sub">Your pet grows every time you earn points.</p>
        <div class="card" style="text-align:center">
          <div style="font-size:${Math.min(130, 56 + L * 7)}px;line-height:1.1">${L >= 5 ? "<div style='font-size:.4em'>🎓</div>" : ""}${petEmoji(state.profile)}</div>
          <h3>${esc((state.profile.pet && state.profile.pet.name) || "Buddy")} · Level ${L} ${stage}</h3>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="sub">${Math.max(0, hi - (state.profile.points || 0))} points to level ${L + 1}</div>
          <p>${L < 2 ? "🥚 Your egg hatches at level 2. Earn 10 points!" : mood}</p>
        </div>
        <div class="card"><b>🎯 Daily goal</b>${goalBar()}</div>
        <div class="card">
          <b>Choose your pet</b>
          <div class="btns" style="margin-top:10px">
            ${PETS.map((pet, i) => `<button class="alt ${state.profile.pet.species === pet ? "on" : ""}" style="font-size:22px" data-act="petsp" data-i="${i}">${pet}</button>`).join("")}
          </div>
          <br />
          <b>Name</b>
          <input id="pn" maxlength="16" value="${esc((state.profile.pet && state.profile.pet.name) || "Buddy")}" />
          <button data-act="petname">Save name</button>
        </div>
      `;
    };

    const vLeaders = () => {
      const medal = i => ["🥇","🥈","🥉"][i] || "#" + (i + 1);
      const row = (p, i, val) => `
        <div class="card row ${p.id === state.user.uid ? "me" : ""}">
          <div><b>${medal(i)} ${esc(p.username || "Student")}</b>${p.id === state.user.uid ? " (you)" : ""}</div>
          <div><b>${val}</b></div>
        </div>
      `;
      return `
        <h2>Leaderboards</h2>
        <p class="sub">Top 20 players.</p>
        <div class="two">
          <div>
            <h3>⭐ Points</h3>
            ${state.leaderboard.length ? state.leaderboard.map((p, i) => row(p, i, "⭐ " + (p.points || 0))).join("") : '<div class="empty">No one on the board yet.</div>'}
          </div>
          <div>
            <h3>🔥 Streaks</h3>
            ${state.streaks.length ? state.streaks.map((p, i) => row(p, i, "🔥 " + (p.streak || 0) + " day" + ((p.streak || 0) === 1 ? "" : "s"))).join("") : '<div class="empty">No streaks yet. Earn points to start yours!</div>'}
          </div>
        </div>
      `;
    };

    const vAccount = () => {
      const got = (state.profile.points || 0) > 0 ? 1 : 0;
      return `
        <h2>Account</h2>

        <div class="card">
          <div style="display:flex;gap:16px;align-items:center">
            <div class="pfp">${esc(state.profile.emoji || "😀")}</div>
            <div>
              <b>Profile picture</b>
              <div class="sub">Pick an emoji. Friends and study rooms will see it.</div>
            </div>
          </div>
          <div class="btns" style="margin-top:12px">
            ${EMOJIS.map((emoji, i) => `<button class="alt ${((state.profile.emoji || "😀") === emoji) ? "on" : ""}" style="font-size:22px" data-act="emoji" data-i="${i}">${emoji}</button>`).join("")}
          </div>
        </div>

        <div class="card">
          <div class="sub">Username. 3 to 20 letters, numbers or underscores. Only one person can have each username, so friends can find you.</div>
          <input id="un" maxlength="20" value="${esc(state.profile.username)}" />
          <button data-act="name">Save username</button>
        </div>

        <div class="stats">
          <div class="stat"><b>⭐ ${state.profile.points || 0}</b><span>points</span></div>
          <div class="stat"><b>🔥 ${liveStreak(state.profile)}</b><span>day streak</span></div>
          <div class="stat"><b>🏁 ${bestStreak(state.profile)}</b><span>best streak</span></div>
          <div class="stat"><b>${petEmoji(state.profile)} ${levelOf(state.profile)}</b><span>pet level</span></div>
          <div class="stat"><b>📚 ${state.profile.cardsStudied || 0}</b><span>cards studied</span></div>
          <div class="stat"><b>✅ ${state.profile.tasksDone || 0}</b><span>tasks done</span></div>
          <div class="stat"><b>📝 ${state.profile.quizzesTaken || 0}</b><span>quizzes finished</span></div>
        </div>
      `;
    };

    const vRooms = () => `
      <h2>Study Rooms</h2>
      <p class="sub">Study alongside friends. Rooms are private: only people with your code (or an invite) can join.</p>

      <div class="two">
        <div class="card">
          <h3 style="margin-top:0">Create a room</h3>
          <input id="rn" placeholder="Room name, like Maths group" maxlength="30" />
          <button data-act="rcreate">+ Create room</button>
        </div>

        <div class="card">
          <h3 style="margin-top:0">Join a room</h3>
          <input id="rc" placeholder="6-letter room code" maxlength="6" style="text-transform:uppercase" />
          <button data-act="rjoin">Join</button>
        </div>
      </div>

      <p class="sub">🔒 Chat is only visible to people inside the room. Never share private details.</p>
    `;

    const renderMain = () => {
      const main = $("main");
      if (!main) return;
      main.classList.toggle("anim", state.view !== state.lastView);
      state.lastView = state.view;

      const map = {
        planner: vPlanner,
        rev: vRev,
        decks: vDecks,
        edit: vEditDeck,
        study: vStudy,
        quizzes: vQuizzes,
        qedit: vQEdit,
        qtake: vQTake,
        explore: vExplore,
        friends: vFriends,
        profile: vProfile,
        notifs: vNotifs,
        pet: vPet,
        leaders: vLeaders,
        account: vAccount,
        rooms: vRooms
      };

      main.innerHTML = (map[state.view] || vPlanner)();
    };

    const fetchData = async () => {
      if (!state.user) return;
      try {
        const deckSnap = await getDocs(query(collection(db, "decks"), where("ownerId", "==", state.user.uid)));
        state.decks = deckSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        const pubDeckSnap = await getDocs(query(collection(db, "decks"), where("isPublic", "==", true), limit(100)));
        state.pubDecks = pubDeckSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        const quizSnap = await getDocs(query(collection(db, "quizzes"), where("ownerId", "==", state.user.uid)));
        state.quizes = quizSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        const pubQuizSnap = await getDocs(query(collection(db, "quizzes"), where("isPublic", "==", true), limit(100)));
        state.pubQuizes = pubQuizSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        const boardSnap = await getDocs(query(collection(db, "leaderboard"), orderBy("points", "desc"), limit(20)));
        state.leaderboard = boardSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        const streakSnap = await getDocs(query(collection(db, "leaderboard"), orderBy("streak", "desc"), limit(20)));
        state.streaks = streakSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {
        console.warn("fetchData", e);
      }
    };

    async function go(view) {
      state.view = view;
      try {
        if (view === "decks") await fetchData();
        if (view === "quizzes") await fetchData();
        if (view === "explore") {
          state.search = "";
          await fetchData();
        }
        if (view === "leaders") await fetchData();
        if (view === "friends") {
          state.searchUser = "";
          state.searchResult = null;
          const snap = await getDocs(query(collection(db, "friendships"), where("users", "array-contains", state.user.uid)));
          const ids = snap.docs.map(d => (d.data().users || []).find(uid => uid !== state.user.uid)).filter(Boolean);
          state.friends = [];
          for (const id of ids) {
            try {
              const profileSnap = await getDoc(doc(db, "profiles", id));
              state.friends.push(profileSnap.exists() ? { uid: id, ...profileSnap.data() } : { uid: id, username: "(unknown)" });
            } catch (e) {}
          }
          state.friends.sort((a, b) => String(a.username).localeCompare(String(b.username)));
        }
      } catch (e) {
        alert("Database error: " + (e.code || e.message));
      }
      renderNav();
      renderMain();
    }

    const newQ = type => {
      if (type === "tf") return { type: "tf", q: "", ans: true };
      if (type === "match") return { type: "match", q: "Match each item with its partner.", pairs: [{ l:"", r:"" }, { l:"", r:"" }, { l:"", r:"" }, { l:"", r:"" }] };
      return { type: "mc", q: "", opts: ["","","",""], ans: 0 };
    };

    const cleanQuestion = x => {
      const type = x.type || "mc";
      const text = (x.q || "").trim();
      if (type === "tf") return text ? { type: "tf", q: text, ans: !!x.ans } : null;
      if (type === "match") {
        const pairs = (x.pairs || []).filter(p => (p.l || "").trim() && (p.r || "").trim()).map(p => ({ l: p.l.trim(), r: p.r.trim() }));
        return pairs.length >= 2 ? { type: "match", q: text || "Match each item with its partner.", pairs } : null;
      }
      return text && (x.opts || []).every(opt => String(opt).trim()) ? { type: "mc", q: text, opts: (x.opts || []).map(o => String(o).trim()), ans: Number(x.ans || 0) } : null;
    };

    const prepQuiz = () => {
      const qn = state.quizTake.questions[state.quizTake.i];
      state.quizTake.sel = null;
      state.quizTake.chk = false;
      state.quizTake.m = [];
      state.quizTake.order = [];
      if (qn && qn.type === "match") {
        state.quizTake.order = shuffle(qn.pairs.map((_, idx) => idx));
      } else if (qn && (qn.type || "mc") === "mc") {
        state.quizTake.order = shuffle(qn.opts.map((_, idx) => idx));
      }
    };

    const finishQuiz = async () => {
      const len = state.quizTake.questions.length;
      const pts = state.quizTake.correct * 2 + (state.quizTake.correct === len ? 10 : 0);
      const perfect = state.quizTake.correct === len && len >= 3;
      await earn(pts, {
        quizzesTaken: (state.profile.quizzesTaken || 0) + 1,
        perfectQuizzes: (state.profile.perfectQuizzes || 0) + (perfect ? 1 : 0)
      });
    };

    async function doDeckAction(type, id) {
      const d = state.decks.find(x => x.id === id) || state.pubDecks.find(x => x.id === id);
      if (!d) return;
      if (type === "study") {
        state.study = { title: d.title, cards: [...d.cards], i: 0, flip: false, got: 0, from: state.view };
        state.view = "study";
      }
      if (type === "copydeck") {
        await addDoc(collection(db, "decks"), {
          ownerId: state.user.uid,
          ownerName: state.profile.username,
          title: d.title + " (copy)",
          cards: d.cards,
          isPublic: false,
          updated: Date.now()
        });
        await save({ decksMade: (state.profile.decksMade || 0) + 1 });
        alert("Saved to My Decks!");
      }
      if (type === "editdeck") {
        state.currentDeckDraft = createDeckDraft(d);
        state.view = "edit";
      }
    }

    async function doQuizAction(type, id) {
      const q = state.quizes.find(x => x.id === id) || state.pubQuizes.find(x => x.id === id);
      if (!q) return;
      if (type === "qtake") {
        state.quizTake = { title: q.title, questions: q.questions, i: 0, correct: 0, from: state.view, sel: null, chk: false, m: [], order: [] };
        prepQuiz();
        state.view = "qtake";
      }
      if (type === "copyquiz") {
        await addDoc(collection(db, "quizzes"), {
          ownerId: state.user.uid,
          ownerName: state.profile.username,
          title: q.title + " (copy)",
          questions: q.questions,
          isPublic: false,
          updated: Date.now()
        });
        await save({ quizzesMade: (state.profile.quizzesMade || 0) + 1 });
        alert("Saved to My Quizzes!");
      }
      if (type === "qedit") {
        state.currentQuizDraft = createQuizDraft(q);
        state.view = "qedit";
      }
    }

    const pickTF = value => {
      if (!state.quizTake || state.quizTake.sel !== null) return;
      state.quizTake.sel = Number(value);
      if (Number(state.quizTake.sel) === Number(state.quizTake.questions[state.quizTake.i].ans ? 1 : 0)) state.quizTake.correct++;
      renderMain();
    };

    const pickMC = value => {
      if (!state.quizTake || state.quizTake.sel !== null) return;
      state.quizTake.sel = Number(value);
      if (Number(value) === Number(state.quizTake.questions[state.quizTake.i].ans)) state.quizTake.correct++;
      renderMain();
    };

    const qnext = async () => {
      if (!state.quizTake) return;
      state.quizTake.i++;
      prepQuiz();
      if (state.quizTake.i >= state.quizTake.questions.length) {
        await finishQuiz();
      }
      renderMain();
    };

    const qcheck = () => {
      if (!state.quizTake || state.quizTake.questions[state.quizTake.i].type !== "match") return;
      const question = state.quizTake.questions[state.quizTake.i];
      if (question.pairs.some((_, k) => !state.quizTake.m[k])) {
        alert("Choose a match for every item first.");
        return;
      }
      state.quizTake.chk = true;
      if (question.pairs.every((pair, k) => state.quizTake.m[k] === pair.r)) state.quizTake.correct++;
      renderMain();
    };

    document.addEventListener("click", async e => {
      const btn = e.target.closest("[data-go]");
      if (btn) return go(btn.dataset.go);

      const actionBtn = e.target.closest("[data-act]");
      if (!actionBtn || !state.profile) return;

      const act = actionBtn.dataset.act;
      const idx = Number(actionBtn.dataset.i || 0);
      const id = actionBtn.dataset.id;
      const key = actionBtn.dataset.k;

      try {
        if (act === "out") {
          stopMusic();
          await signOut(auth);
          return;
        }

        if (act === "mtoggle") {
          $("mpanel").classList.toggle("hidden");
          return;
        }
        if (act === "mplay") {
          musicPlay(actionBtn.dataset.k);
          renderMusic();
          return;
        }
        if (act === "mstop") {
          stopMusic();
          renderMusic();
          return;
        }

        if (act === "addtask") {
          const name = $("tk").value.trim();
          if (!name) return;
          await save({
            tasks: [...(state.profile.tasks || []), { name, due: $("td").value, done: false }]
          });
          renderMain();
        }

        if (act === "done") {
          const tasks = (state.profile.tasks || []).map((t, i) => i === idx ? { ...t, done: true } : t);
          await earn(5, { tasks, tasksDone: (state.profile.tasksDone || 0) + 1 });
          renderMain();
        }

        if (act === "deltask") {
          await save({ tasks: (state.profile.tasks || []).filter((_, i) => i !== idx) });
          renderMain();
        }

        if (act === "xadd") {
          const subject = $("xs").value.trim();
          const date = $("xd").value;
          if (!subject || !date) { alert("Add a subject and an exam date."); return; }
          if ((state.profile.exams || []).length >= 10) { alert("10 exams is the maximum."); return; }
          await save({ exams: [...(state.profile.exams || []), { subject, date }] });
          renderMain();
        }

        if (act === "xdel") {
          await save({ exams: (state.profile.exams || []).filter((_, i) => i !== idx) });
          renderMain();
        }

        if (act === "rdone") {
          const k = key;
          const keep = Object.fromEntries(Object.entries(state.profile.revDone || {}).filter(([keyName]) => keyName.slice(0, 10) >= plus(0)));
          if (state.profile.revDone && state.profile.revDone[k]) return;
          await earn(10, {
            revDone: { ...keep, [k]: true },
            revisionDone: (state.profile.revisionDone || 0) + 1
          });
          renderMain();
        }

        if (act === "newdeck") {
          state.currentDeckDraft = createDeckDraft({ title: "", cards: [{ front:"", back:"" }] });
          state.view = "edit";
          renderMain();
        }
        if (act === "editdeck") {
          const d = state.decks.find(x => x.id === id);
          if (d) {
            state.currentDeckDraft = createDeckDraft(d);
            state.view = "edit";
            renderMain();
          }
        }
        if (act === "addcard") {
          if (!state.currentDeckDraft) return;
          if (state.currentDeckDraft.cards.length < 100) state.currentDeckDraft.cards.push({ front:"", back:"" });
          renderMain();
        }
        if (act === "delcard") {
          if (!state.currentDeckDraft) return;
          state.currentDeckDraft.cards.splice(idx, 1);
          renderMain();
        }
        if (act === "savedeck") {
          if (!state.currentDeckDraft) return;
          const cards = state.currentDeckDraft.cards.filter(c => c.front.trim() && c.back.trim());
          if (!state.currentDeckDraft.title.trim() || !cards.length) {
            alert("Add a title and at least one full card.");
            return;
          }
          const payload = {
            ownerId: state.user.uid,
            ownerName: state.profile.username,
            title: state.currentDeckDraft.title.trim(),
            cards,
            isPublic: !!document.getElementById("dp")?.checked,
            updated: Date.now()
          };
          if (state.currentDeckDraft.id) {
            await updateDoc(doc(db, "decks", state.currentDeckDraft.id), payload);
          } else {
            await addDoc(collection(db, "decks"), payload);
            await save({ decksMade: (state.profile.decksMade || 0) + 1 });
          }
          await fetchData();
          state.view = "decks";
          renderNav();
          renderMain();
        }
        if (act === "deldeck" && confirm("Delete this deck?")) {
          await deleteDoc(doc(db, "decks", id));
          await fetchData();
          state.view = "decks";
          renderNav();
          renderMain();
        }
        if (act === "study") {
          const deck = state.decks.find(x => x.id === id) || state.pubDecks.find(x => x.id === id);
          if (!deck) return;
          state.study = { title: deck.title, cards: [...deck.cards], i: 0, flip: false, got: 0, from: state.view };
          state.view = "study";
          renderMain();
        }
        if (act === "flip") {
          if (state.study) {
            state.study.flip = !state.study.flip;
            renderMain();
          }
        }
        if (act === "got" || act === "again") {
          if (!state.study) return;
          const n = act === "got" ? 1 : 0;
          state.study.got += n;
          state.study.i++;
          state.study.flip = false;
          const done = state.study.i >= state.study.cards.length;
          const perfect = done && state.study.got === state.study.cards.length && state.study.cards.length >= 5;
          await earn(n + (done ? 10 : 0), {
            cardsStudied: (state.profile.cardsStudied || 0) + 1,
            perfectDecks: (state.profile.perfectDecks || 0) + (perfect ? 1 : 0)
          });
          renderMain();
        }

        if (act === "newquiz") {
          state.currentQuizDraft = createQuizDraft({ title:"", questions:[newQ("mc")] });
          state.view = "qedit";
          renderMain();
        }
        if (act === "qedit") {
          const q = state.quizes.find(x => x.id === id);
          if (!q) return;
          state.currentQuizDraft = createQuizDraft(q);
          state.view = "qedit";
          renderMain();
        }
        if (act === "qaddq") {
          if (!state.currentQuizDraft) return;
          if (state.currentQuizDraft.questions.length < 50) state.currentQuizDraft.questions.push(newQ("mc"));
          renderMain();
        }
        if (act === "qdelq") {
          if (!state.currentQuizDraft) return;
          state.currentQuizDraft.questions.splice(idx, 1);
          renderMain();
        }
        if (act === "qsave") {
          if (!state.currentQuizDraft) return;
          const questions = state.currentQuizDraft.questions.map(cleanQuestion).filter(Boolean);
          if (!state.currentQuizDraft.title.trim() || !questions.length) {
            alert("Add a title and at least one complete question.");
            return;
          }
          const payload = {
            ownerId: state.user.uid,
            ownerName: state.profile.username,
            title: state.currentQuizDraft.title.trim(),
            questions,
            isPublic: !!document.getElementById("qp")?.checked,
            updated: Date.now()
          };
          if (state.currentQuizDraft.id) {
            await updateDoc(doc(db, "quizzes", state.currentQuizDraft.id), payload);
          } else {
            await addDoc(collection(db, "quizzes"), payload);
            await save({ quizzesMade: (state.profile.quizzesMade || 0) + 1 });
          }
          await fetchData();
          state.view = "quizzes";
          renderNav();
          renderMain();
        }
        if (act === "qdel" && confirm("Delete this quiz?")) {
          await deleteDoc(doc(db, "quizzes", id));
          await fetchData();
          state.view = "quizzes";
          renderNav();
          renderMain();
        }
        if (act === "qtake") {
          const q = state.quizes.find(x => x.id === id) || state.pubQuizes.find(x => x.id === id);
          if (!q) return;
          state.quizTake = { title: q.title, questions: q.questions, i: 0, correct: 0, from: state.view, sel: null, chk: false, m: [], order: [] };
          prepQuiz();
          state.view = "qtake";
          renderMain();
        }
        if (act === "pick") {
          pickMC(actionBtn.dataset.i);
        }
        if (act === "pickTF") {
          pickTF(actionBtn.dataset.i);
        }
        if (act === "mcheck") {
          qcheck();
        }
        if (act === "qnext") {
          await qnext();
        }

        if (act === "copydeck") {
          const deck = state.pubDecks.find(x => x.id === id);
          if (!deck) return;
          await addDoc(collection(db, "decks"), {
            ownerId: state.user.uid,
            ownerName: state.profile.username,
            title: deck.title + " (copy)",
            cards: deck.cards,
            isPublic: false,
            updated: Date.now()
          });
          await save({ decksMade: (state.profile.decksMade || 0) + 1 });
          alert("Saved to My Decks!");
        }

        if (act === "copyquiz") {
          const quiz = state.pubQuizes.find(x => x.id === id);
          if (!quiz) return;
          await addDoc(collection(db, "quizzes"), {
            ownerId: state.user.uid,
            ownerName: state.profile.username,
            title: quiz.title + " (copy)",
            questions: quiz.questions,
            isPublic: false,
            updated: Date.now()
          });
          await save({ quizzesMade: (state.profile.quizzesMade || 0) + 1 });
          alert("Saved to My Quizzes!");
        }

        if (act === "fsearch") {
          state.searchUser = $("fs").value.trim();
          if (!NAME_RE.test(state.searchUser)) {
            state.searchResult = { msg: "Usernames are 3 to 20 letters, numbers or underscores." };
          } else if (state.searchUser.toLowerCase() === state.profile.username.toLowerCase()) {
            state.searchResult = { msg: "That's you! 😄" };
          } else {
            const ref = doc(db, "usernames", state.searchUser.toLowerCase());
            const snap = await getDoc(ref);
            state.searchResult = snap.exists()
              ? { uid: snap.data().uid, username: snap.data().username }
              : { msg: 'No one is called "' + state.searchUser + '". Check the spelling.' };
          }
          renderMain();
        }

        if (act === "freq") {
          if (state.friends.some(f => f.uid === id)) return;
          try {
            await setDoc(doc(db, "notifications", "fr_" + state.user.uid + "_" + id), {
              to: id,
              from: state.user.uid,
              fromName: state.profile.username,
              type: "friend",
              text: state.profile.username + " sent you a friend request",
              at: Date.now()
            });
            state.searchResult = { msg: "✅ Friend request sent!" };
          } catch (e) {
            state.searchResult = { msg: "Couldn't send the request. You might have already sent one." };
          }
          renderMain();
        }

        if (act === "fview") {
          state.profileView = state.friends.find(f => f.uid === id) || null;
          state.view = "profile";
          renderMain();
        }

        if (act === "fremove" && confirm("Remove this friend?")) {
          await deleteDoc(doc(db, "friendships", [state.user.uid, id].sort().join("_")));
          go("friends");
        }

        if (act === "nacc") {
          const n = state.notify.find(x => x.id === id);
          if (!n) return;
          const pair = [state.user.uid, n.from].sort().join("_");
          try {
            await setDoc(doc(db, "friendships", pair), { users: [state.user.uid, n.from].sort(), at: Date.now() });
          } catch (e) {
            await deleteDoc(doc(db, "notifications", id));
            alert("You may already be friends with this person.");
            return;
          }
          await deleteDoc(doc(db, "notifications", id));
          try { await addDoc(collection(db, "notifications"), { to: n.from, from: state.user.uid, fromName: state.profile.username, type: "info", text: state.profile.username + " accepted your friend request 🎉", at: Date.now() }); } catch (e) {}
          go("friends");
        }

        if (act === "ndec") {
          await deleteDoc(doc(db, "notifications", id));
          state.notify = state.notify.filter(n => n.id !== id);
          renderMain();
        }

        if (act === "njoin") {
          const n = state.notify.find(x => x.id === id);
          if (!n) return;
          const snap = await getDoc(doc(db, "rooms", n.roomCode));
          await deleteDoc(doc(db, "notifications", id));
          if (!snap.exists()) { alert("That room doesn't exist any more."); return; }
          // join logic can be simplified if needed
          toast("Room invite accepted.");
        }

        if (act === "emoji") {
          await save({ emoji: EMOJIS[idx] });
          renderMain();
        }

        if (act === "petsp") {
          await save({ pet: { ...(state.profile.pet || {}), species: PETS[idx] } });
          renderMain();
        }

        if (act === "petname") {
          const name = $("pn").value.trim().slice(0, 16);
          if (!name) return;
          await save({ pet: { ...(state.profile.pet || {}), name } });
          toast("🐾 Pet renamed!");
          renderMain();
        }

        if (act === "name") {
          const n = $("un").value.trim();
          if (!NAME_RE.test(n)) { alert("Usernames need 3 to 20 letters, numbers or underscores, with no spaces."); return; }
          if (n === state.profile.username) return;
          const oldKey = state.profile.username.toLowerCase();
          const newKey = n.toLowerCase();
          const batch = writeBatch(db);
          batch.set(doc(db, "usernames", newKey), { uid: state.user.uid, username: n });
          if (oldKey !== newKey) batch.delete(doc(db, "usernames", oldKey));
          await batch.commit();
          await save({ username: n });
          toast("✅ Username saved!");
          renderMain();
        }

        if (act === "rcreate") {
          const roomName = $("rn").value.trim();
          if (!roomName) { alert("Give your room a name."); return; }
          const code = Array.from({length:6}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
          await setDoc(doc(db, "rooms", code), { name: roomName, ownerId: state.user.uid, createdAt: Date.now() });
          state.room = { code, name: roomName };
          state.view = "rooms";
          renderMain();
        }

        if (act === "rjoin") {
          const code = $("rc").value.trim().toUpperCase();
          if (!/^[A-Z0-9]{6}$/.test(code)) { alert("Room codes have 6 letters or numbers."); return; }
          const snap = await getDoc(doc(db, "rooms", code));
          if (!snap.exists()) { alert("Room not found. Check the code and try again."); return; }
          state.room = { code, name: snap.data().name };
          state.view = "rooms";
          renderMain();
        }

      } catch (err) {
        alert("Something went wrong: " + (err.code || err.message));
      }
    });

    document.addEventListener("input", e => {
      const target = e.target;
      if (target.id === "vol") {
        music.volume = Number(target.value);
        if (music.master) music.master.gain.value = music.volume;
        return;
      }

      if (target.id === "sq") {
        state.search = target.value;
        renderMain();
        return;
      }

      if (target.id === "fs") {
        state.searchUser = target.value;
      }

      if (state.quizTake && state.quizTake.questions[state.quizTake.i]?.type === "match") {
        const mi = Number(target.dataset.mi);
        if (!Number.isNaN(mi) && target.value !== "") {
          state.quizTake.m[mi] = target.value;
        }
      }
    });

    document.addEventListener("change", e => {
      const target = e.target;
      if (target.dataset.qf === "type" && state.currentQuizDraft) {
        const qi = Number(target.dataset.qi);
        const qType = target.value;
        state.currentQuizDraft.questions[qi] = {
          ...newQ(qType),
          q: state.currentQuizDraft.questions[qi]?.q || "",
          ans: state.currentQuizDraft.questions[qi]?.ans ?? true
        };
        renderMain();
      }
      if (target.dataset.qf === "tf" && state.currentQuizDraft) {
        const qi = Number(target.dataset.qi);
        state.currentQuizDraft.questions[qi].ans = target.dataset.v === "1";
      }
      if (target.dataset.qf === "ans" && state.currentQuizDraft) {
        const qi = Number(target.dataset.qi);
        const oi = Number(target.dataset.oi);
        state.currentQuizDraft.questions[qi].ans = oi;
      }
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && e.target.id === "sq") {
        e.preventDefault();
        renderMain();
      }
    });

    const loadNotifications = () => {
      if (!state.user) return;
      onSnapshot(query(collection(db, "notifications"), where("to", "==", state.user.uid)), snap => {
        state.notify = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at || 0) - (a.at || 0));
        renderNav();
        if (state.view === "notifs") renderMain();
      }, err => console.warn("notifications", err));
    };

    const startApp = async () => {
      if (!state.user) return;
      await fetchData();
      renderNav();
      renderMain();
      loadNotifications();
    };

    onAuthStateChanged(auth, async user => {
      if (user) {
        state.user = user;
        const ref = doc(db, "users", user.uid);
        const profileSnap = await getDoc(ref);
        state.profile = {
          username: genName(),
          emoji: "😀",
          points: 0,
          streak: 0,
          bestStreak: 0,
          lastDay: "",
          tasksDone: 0,
          cardsStudied: 0,
          decksMade: 0,
          published: 0,
          quizzesMade: 0,
          quizzesTaken: 0,
          perfectQuizzes: 0,
          perfectDecks: 0,
          revisionDone: 0,
          focusDone: 0,
          roomsJoined: 0,
          racesPlayed: 0,
          racesWon: 0,
          goalDay: "",
          goalPts: 0,
          goalDone: "",
          exams: [],
          revPer: 2,
          revStart: "16:00",
          studyMin: 45,
          breakMin: 15,
          revDone: {},
          remSent: {},
          pet: { name:"Buddy", species:"🐱" },
          avatar: { skin:1, hair:0, hs:1, eye:0, fit:0, acc:0, look:0, top:0 },
          backdrop: 0,
          tasks: [],
          ...(profileSnap.exists() ? profileSnap.data() : {})
        };
        if (!profileSnap.exists()) await setDoc(ref, state.profile);
        await ensureUsername();
        await syncProfile();
        $("auth").classList.add("hidden");
        $("shell").classList.remove("hidden");
        await startApp();
        renderMusic();
        musicPlay("dream");
      } else {
        state.user = null;
        renderAuth();
      }
    });
  </script>
</body>
</html>
