  <meta name="apple-mobile-web-app-title" content="DueDash" />

  <style>
    :root{
      --bg:#f5f1ea;
      --bg-2:#efe9df;
      --card:rgba(255,255,255,.76);
      --card-strong:#f8f6f2;
      --line:#e2dbce;
      --text:#243127;
      --muted:#697466;
      --green:#5d7d61;
      --green-2:#42634a;
      --green-soft:#eaf1e9;
      --amber:#c59a52;
      --amber-soft:#f8f0df;
      --red:#b7604b;
      --red-soft:#f6e4e1;
      --shadow:0 18px 48px rgba(30,34,28,.08);
      --header:ui-serif,Georgia,"Times New Roman",serif;
      --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html{color-scheme:light}
    body{
      margin:0;
      min-height:100vh;
      font-family:var(--body);
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(122,147,122,.18), transparent 62%),
        radial-gradient(900px 500px at 100% 0%, rgba(186,156,117,.12), transparent 60%),
        linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%);
      line-height:1.5;
    }

    h1,h2,h3,h4{
      margin:0 0 8px;
      font-family:var(--header);
      letter-spacing:-.03em;
      color:var(--text);
      font-weight:600;
    }
    h2{font-size:32px}
    h3{font-size:22px}
    p{margin:0}
    a{color:inherit;text-decoration:none}

    button,input,select{
      font:inherit;
      color:var(--text);
    }

    button{
      border:1px solid transparent;
      background:linear-gradient(135deg,var(--green),var(--green-2));
      color:#fff;
      border-radius:12px;
      padding:10px 15px;
      font-weight:600;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow:0 8px 18px rgba(71,95,79,.18);
    }
    button:hover{transform:translateY(-1px);filter:brightness(1.02)}
    button:active{transform:translateY(0)}
    button.alt{
      background:#fff;
      border-color:var(--line);
      color:var(--text);
      box-shadow:none;
    }
    button.alt:hover{background:#f4f0ea}
    button.red{
      background:linear-gradient(135deg,var(--red),#9d4d42);
      box-shadow:0 8px 18px rgba(150,90,83,.18);
    }
    button.green{
      background:linear-gradient(135deg,#6d8f6d,#4e6b52);
      box-shadow:0 8px 18px rgba(69,104,83,.18);
    }
    button.link{
      background:none;
      border:none;
      box-shadow:none;
      color:var(--green-2);
      text-decoration:underline;
      text-underline-offset:3px;
      padding-left:0;
      padding-right:0;
    }
    button.link:hover{background:none;transform:none}
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    input,select{
      width:100%;
      background:rgba(255,255,255,.8);
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px 12px;
      outline:none;
      transition:border-color .12s ease, box-shadow .12s ease;
    }
    input::placeholder{color:#8b9489}
    input:focus,select:focus{
      border-color:var(--green);
      box-shadow:0 0 0 4px rgba(93,125,97,.12);
    }
    input[type=radio], input[type=checkbox]{
      width:auto;
      accent-color:var(--green);
    }

    .hidden{display:none!important}
    .qimg{display:block;max-width:100%;max-height:240px;margin:10px auto 4px;border-radius:12px;object-fit:contain}
    .imgpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
    .imgpick .qimg{margin:0;max-height:90px}
    .imgpick{padding:8px;border:2px dashed var(--line);border-radius:14px;transition:background .15s,border-color .15s}
    .imgpick.drag{background:var(--green-soft);border-color:var(--green)}
    .dzhint{font-size:13px}
    .tbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
    .tbar i{display:block;height:100%;background:var(--green);transition:width .25s linear}
    .imgbtn{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600;font-size:14px}
    .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .btns button.on,button.alt.on{background:var(--green-soft);border-color:var(--green);color:var(--green-2)}
    .sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
    .sw.on{box-shadow:0 0 0 3px var(--green)}
    .prev{width:160px;flex:none}
    .prev svg{width:100%;height:auto}
    .card.me{border-color:var(--green);background:var(--green-soft)}
    .sub{font-size:13px;color:var(--muted)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .two{display:flex;gap:14px;flex-wrap:wrap}
    .two > *{flex:1;min-width:260px}
    .pair{display:flex;gap:8px;align-items:flex-start}
    .pair input{flex:1}
    .tick{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text);margin-bottom:10px;white-space:nowrap}
    .opt.right input{border-color:#6fa06d;box-shadow:0 0 0 3px rgba(109,143,109,.12)}
    .opt.right .tick{color:var(--green-2);font-weight:700}
    .choice{
      display:block;width:100%;
      text-align:left;
      margin-bottom:8px;
      background:#fff;
      border-color:var(--line);
      color:var(--text);
      box-shadow:none;
    }
    .choice.green{background:#eaf4eb;border-color:rgba(93,125,97,.4)}
    .choice.red{background:#f6e4e1;border-color:rgba(182,96,75,.3)}
    .choice.alt{background:#fff}

    #auth{
      width:min(100% - 32px,420px);
      margin:10vh auto;
      padding:30px 24px 24px;
      background:rgba(255,255,255,.75);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .brand-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      margin:0 auto 18px;
    }

    .brand-svg{
      width:min(100%, 760px);
      height:auto;
      display:block;
      filter:drop-shadow(0 14px 20px rgba(32,48,38,.06));
    }

    #auth .brand-svg{max-width:250px}
    #auth h2{text-align:center}
    .err{
      min-height:18px;
      margin:8px 0 12px;
      color:var(--red);
      font-size:13px;
    }

    #shell{
      display:flex;
      min-height:100vh;
    }
    nav{
      width:240px;
      background:rgba(255,255,255,.66);
      border-right:1px solid var(--line);
      padding:18px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      backdrop-filter:blur(12px);
    }

    nav .brand-svg{
      width:100%;
      max-width:180px;
      margin:0 auto 12px;
    }

    nav .nav-label{
      font-size:11px;
      font-weight:700;
      letter-spacing:.09em;
      text-transform:uppercase;
      color:var(--muted);
      padding:14px 12px 0;
      margin-top:4px;
      border-top:1px solid var(--line);
    }
    nav .brand-wrap + .nav-label{border-top:none;margin-top:0;padding-top:4px}
    nav button{
      background:none;
      box-shadow:none;
      color:var(--text);
      border-radius:10px;
      text-align:left;
      padding:10px 12px;
      font-weight:500;
      display:flex;
      align-items:center;
      gap:10px;
    }
    nav button:hover{background:#f3efe9}
    nav button.on{
      background:linear-gradient(135deg,var(--green),var(--green-2));
      color:#fff;
      box-shadow:0 8px 22px rgba(65,98,75,.16);
    }
    .badge{
      margin-left:auto;
      background:var(--red);
      color:#fff;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      padding:1px 7px;
      min-width:20px;
      text-align:center;
      line-height:1.8;
    }
    .chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:auto;
      padding-top:10px;
      border-top:1px solid var(--line);
    }
    .chip{
      background:#f3efe9;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:600;
    }

    main{
      flex:1;
      min-width:0;
      max-width:1100px;
      padding:28px clamp(16px,4vw,42px);
    }

    .anim > *{animation:fade .24s ease both}
    @keyframes fade{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      margin-bottom:10px;
      box-shadow:0 2px 10px rgba(35,39,31,.02);
    }
    .card.row:hover{border-color:rgba(93,125,97,.36)}
    .stat{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px 14px;
      text-align:center;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:12px;
      margin:16px 0;
    }
    .stat b{
      display:block;
      font-size:28px;
      margin-bottom:3px;
      font-weight:700;
      letter-spacing:-.04em;
    }
    .stat span{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .pfp{
      width:72px;height:72px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:38px;background:rgba(93,125,97,.12);
      border:2px solid rgba(93,125,97,.8);
      flex:none;
    }
    .pfp.sm{
      width:42px;height:42px;
      font-size:22px;
      border-width:1px;
    }

    .big{
      min-height:220px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:28px;
      border-radius:18px;
      background:linear-gradient(145deg,#f6efe7,#f0f3ed);
      border:1px solid var(--line);
      gap:8px;
      cursor:pointer;
    }

    .empty{
      background:rgba(255,255,255,.46);
      border:1px dashed var(--line);
      border-radius:14px;
      text-align:center;
      padding:28px 18px;
      color:var(--muted);
    }

    .done .nm{text-decoration:line-through;opacity:.7}
    .overdue{color:var(--red)}

    .bar{
      width:100%;
      height:9px;
      border-radius:999px;
      background:#ece7df;
      overflow:hidden;
      margin:8px 0 6px;
    }
    .bar i{
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--green),#9dbf98);
      border-radius:999px;
    }

    .awards{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:12px;
    }
    .ach{
      background:rgba(255,255,255,.7);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;

    }

      border-color:#d7c080;
      background:linear-gradient(180deg,#faf5eb,#f5efe6);

    .ach .ic{font-size:30px;margin-bottom:8px}

    .scene{
      position:relative;
      min-height:440px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:18px;
      padding:70px 16px 16px;
      flex-wrap:wrap;
      background:#dfe6d8;
      margin-bottom:12px;
    }
    .deco{
      position:absolute;
      top:12px;
      font-size:44px;
      opacity:.55;
      pointer-events:none;
    }
    .who{
      position:relative;
      text-align:center;
      width:120px;
    }
    .who .stu{width:100%;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.14))}
    .who .wn{
      display:inline-block;
      margin-top:7px;
      padding:2px 9px;
      border-radius:999px;
      background:rgba(26,31,26,.55);
      color:#fff;
      font-size:12px;
      font-weight:700;
    }
    .who .st{
      margin-top:4px;
      font-size:12px;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    .who .wp{
      position:absolute;
      right:0;bottom:48px;
      font-size:26px;
    }
    .bub{
      position:absolute;
      bottom:100%;
      left:50%;
      transform:translateX(-50%);
      margin-bottom:6px;
      background:#fff;
      color:#243127;
      border-radius:12px;
      padding:6px 10px;
      font-size:12.5px;
      font-weight:600;
      max-width:170px;
      width:max-content;
      text-align:center;
      box-shadow:0 10px 24px rgba(0,0,0,.12);
    }

    #chatlog{
      height:200px;
      overflow-y:auto;
      background:rgba(0,0,0,.03);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 12px;
    }
    .msg{
      margin:4px 0;
      font-size:14px;
      overflow-wrap:anywhere;
    }
    .msg b{color:var(--green-2)}
    .msg.me b{color:#5b8f5b}

    .chatrow{
      display:flex;
      gap:8px;
      margin-top:10px;
    }
    .chatrow input{margin:0}
    .chatrow button{
      white-space:nowrap;
      min-width:82px;
    }

    .lane{display:flex;align-items:center;gap:8px;margin:8px 0}
    .ln{
      width:120px;
      font-size:13px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .track{
      position:relative;
      flex:1;
      height:30px;
      background:rgba(122,147,122,.08);
      border:1px solid var(--line);
      border-radius:999px;
      overflow:hidden;
    }
    .track i{
      position:absolute;left:0;top:0;bottom:0;
      background:linear-gradient(90deg,rgba(93,125,97,.32),rgba(179,202,177,.48));
      transition:width .35s ease;
    }
    .rider{
      position:absolute;
      top:50%;
      transform:translate(-50%,-50%);

    }
    .flag{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);

    }
    .sc{
      width:52px;text-align:right;font-size:13px;font-weight:600;
    }
    .cd{
      font-weight:800;
      font-size:54px;
      text-align:center;
      padding:14px;
      letter-spacing:-.06em;
      color:var(--green-2);
    }

    .cal{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:8px;
      margin-top:16px;
    }
    .cal-w{
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      padding:5px 0 8px;
    }
    .cal-d{
      background:rgba(255,255,255,.72);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px;
      min-height:125px;
      font-size:12px;
    }
    .cal-d.today{
      border-color:var(--green);
      background:rgba(234,241,233,.9);
    }
    .cal-h{
      display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin-bottom:6px;
    }
    .cal-h span{
      font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
    }
    .cal-h b{font-size:13px}
    .cal-s{
      background:rgba(93,125,97,.12);
      border-radius:7px;
      padding:6px 6px;
      margin-top:5px;
    }

    .cal-s.done .nm{text-decoration:line-through}
    .cal-t{font-size:10.5px;color:var(--muted)}
    .cal-s button{

      padding:5px 8px;
      font-size:11px;
      border-radius:7px;
    }
    .cal-x{
      background:rgba(197,154,82,.12);
      border:1px solid rgba(197,154,82,.65);
      border-radius:7px;
      padding:5px 6px;
      margin-top:4px;
      font-weight:600;
    }
    .cal-r{
      color:var(--muted);font-size:11px;margin-top:8px;
    }

    #music{
      position:fixed;right:18px;bottom:18px;z-index:50;
      display:flex;flex-direction:column;align-items:flex-end;gap:10px;
    }
    #mbtn{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px;box-shadow:var(--shadow)}
    #mbtn.playing{animation:pulse 2s infinite}

      0%,100%{box-shadow:0 0 0 0 rgba(93,125,97,.38)}
      50%{box-shadow:0 0 0 12px rgba(93,125,97,0)}
    }
    #mpanel{
      width:260px;background:rgba(255,255,255,.95);border:1px solid var(--line);
      border-radius:16px;padding:14px;box-shadow:var(--shadow);
    }
    #mpanel button{width:100%;text-align:left;margin-bottom:6px}
    #mpanel input[type=range]{padding:0;margin:8px 0 0}

    #toast{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translate(-50%,20px);
      background:linear-gradient(135deg,#d6ad6f,#c89a4b);
      color:#fff;
      box-shadow:0 12px 26px rgba(40,35,27,.14);
      border-radius:12px;
      padding:12px 18px;

      pointer-events:none;

      text-align:center;

      opacity:1;
      transform:translate(-50%,0);
    }

    @media (max-width:760px){
      #shell{flex-direction:column}
      nav{
        position:static;
        width:100%;
        height:auto;
        border-right:none;

        flex-direction:row;

      nav .brand-svg{max-width:110px; margin:0 8px 0 0}

      .chips{margin:8px 0 0;width:100%;padding-top:0;border-top:none}
      .cal{grid-template-columns:1fr}
      .cal-w,.cal-e{display:none}
      .cal-d{min-height:0}
    }

    /* ===== themes ===== */
    :root{--surf:#fff;--surf2:#f3efe9;--inp:rgba(255,255,255,.8);--pnl:rgba(255,255,255,.95);--okbg:#eaf4eb;--badbg:#f6e4e1}

    button.alt:hover,nav button:hover,.chip{background:var(--surf2)}
    input,select{background:var(--inp)}
    #mpanel,#tpanel{background:var(--pnl)}
    .choice.green{background:var(--okbg)}.choice.red{background:var(--badbg)}
    nav{background:var(--navbg,rgba(255,255,255,.66))}
    .bar,.tbar{background:var(--surf2)}
    .big{background:linear-gradient(145deg,var(--surf2),var(--green-soft))}
    .cal-d,.ach{background:var(--card)}
    html[data-theme=ocean]{--bg:#e8f2f8;--bg-2:#d6e8f2;--line:#c4dae7;--text:#1b2f3b;--muted:#5a7484;--green:#3f86b0;--green-2:#2b6488;--green-soft:#e0eff8;--surf2:#e9f2f8}
    html[data-theme=sunset]{--bg:#fbefe6;--bg-2:#f6dfd0;--line:#ecd2c0;--text:#3a2622;--muted:#85655a;--green:#e07a4f;--green-2:#c25a34;--green-soft:#fbe7dc;--surf2:#f8ece3}
    html[data-theme=lavender]{--bg:#f1edf8;--bg-2:#e4ddf2;--line:#d6cce8;--text:#2a2440;--muted:#6f6890;--green:#7c63c4;--green-2:#5f47a6;--green-soft:#ebe5f7;--surf2:#efeaf8}
    html[data-theme=rose]{--bg:#fbeef2;--bg-2:#f6dce5;--line:#ecc8d6;--text:#3a2230;--muted:#8a5f72;--green:#d6638b;--green-2:#b94670;--green-soft:#fbe3ec;--surf2:#f9e9ef}
    html[data-theme=midnight]{color-scheme:dark;--bg:#151a22;--bg-2:#10141b;--line:#2b3442;--text:#e6ebf2;--muted:#93a0b3;--green:#5fa37a;--green-2:#3f7d5a;--green-soft:#1f3a2e;--card:rgba(34,42,54,.82);--surf:#222a36;--surf2:#2b3442;--inp:rgba(34,42,54,.9);--pnl:rgba(30,37,48,.97);--okbg:#1f3a2e;--badbg:#44262a;--navbg:rgba(26,32,42,.85)}

    #theme{position:fixed;right:80px;bottom:18px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
    #tbtn{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px;box-shadow:var(--shadow)}
    #tpanel{width:210px;padding:12px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    #tpanel button{width:100%;text-align:left;margin-top:6px;display:flex;align-items:center;gap:9px}
    #tpanel i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
    /* ===== animations: cards, quiz, race ===== */
    @keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
    @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(14px)}}
    @keyframes slideRow{from{opacity:0;transform:translateX(-26px)}}
    .big{transition:box-shadow .2s;perspective:900px}.big:hover{box-shadow:0 14px 34px rgba(30,34,28,.14)}
    .big.fout{animation:fout .16s ease-in forwards}@keyframes fout{to{transform:perspective(900px) rotateY(90deg);opacity:.4}}
    .big.fin{animation:fin .24s ease-out}@keyframes fin{from{transform:perspective(900px) rotateY(-90deg);opacity:.4}}
    .big.next{animation:cnext .38s cubic-bezier(.2,.8,.3,1)}@keyframes cnext{from{transform:translateX(70px) rotate(4deg);opacity:0}}
    .big.again{animation:shake .4s}
    .choice{transition:transform .12s,background .2s,border-color .2s}.choice:not(:disabled):hover{transform:translateX(4px)}
    .choice.green{animation:pop .4s}.choice.red{animation:shake .4s}
    .newq .card,.newq .choice{animation:slideUp .35s both}
    .newq .choice:nth-of-type(2){animation-delay:.06s}.newq .choice:nth-of-type(3){animation-delay:.12s}.newq .choice:nth-of-type(4){animation-delay:.18s}
    .newq .card.row{animation:slideRow .4s both;animation-delay:calc(var(--i,0)*80ms)}
    .newq .card.verdict{animation:pop .5s both .1s}
    .cd{animation:pop .5s}
    #qcard,.qpop{animation:slideUp .3s both}
    .track i,.tbar i{transition:width .35s ease}
    /* ===== pets & avatars ===== */
    .pet{position:relative;display:block;perspective:600px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .pet svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 10px rgba(60,40,30,.18))}
    .pb,.pt-head,.pt-tail,.pt-eyes,.pt-ear,.pt-wing,.pt-egg,.av-eyes,.av-hair{transform-box:fill-box}
    .pb{animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%}@keyframes breathe{50%{transform:scale(1.03,.97)}}
    .pt-head{animation:nod 4.6s ease-in-out infinite;transform-origin:50% 95%}@keyframes nod{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
    .pt-tail{animation:wag 1.5s ease-in-out infinite;transform-origin:0% 100%}@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
    .pt-eyes,.av-eyes{animation:blink 4.4s infinite;transform-origin:50% 55%}@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
    .pt-ear{animation:ear 5s ease-in-out infinite;transform-origin:50% 100%}@keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-7deg)}96%{transform:rotate(3deg)}}
    .pt-wing{animation:flap 1.8s ease-in-out infinite;transform-origin:100% 60%}@keyframes flap{50%{transform:rotate(-12deg)}}
    .pt-egg{animation:rock 2.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes rock{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-7deg)}76%{transform:rotate(7deg)}84%{transform:rotate(-4deg)}}
    .tr-jump .pj{animation:tJump .9s cubic-bezier(.3,.7,.4,1)}@keyframes tJump{0%{transform:scale(1.08,.86)}35%{transform:translateY(-36%) scale(.94,1.08)}72%{transform:translateY(0) scale(1.08,.88)}100%{transform:none}}
    .tr-spin .pj{animation:tSpin 1s ease-in-out}@keyframes tSpin{0%{transform:rotateY(0)}40%{transform:translateY(-22%) rotateY(360deg)}100%{transform:rotateY(720deg)}}
    .tr-flip .pj{animation:tFlip 1.1s ease-in-out}@keyframes tFlip{0%{transform:scale(1.06,.9)}45%{transform:translateY(-42%) rotate(-200deg)}100%{transform:rotate(-360deg)}}
    .tr-bow .pj{animation:tBow 1.3s ease-in-out;transform-origin:50% 100%}@keyframes tBow{25%,70%{transform:rotate(16deg) translateX(5%)}100%{transform:none}}
    .tr-hop .pj{animation:tHop 1.2s}@keyframes tHop{15%,55%{transform:translateY(-16%)}35%,75%{transform:translateY(0)}}
    .pet::after{content:attr(data-fx);position:absolute;left:50%;top:0;font-size:20px;opacity:0;pointer-events:none}
    .pet.fx::after{animation:fxUp 1.3s ease-out}@keyframes fxUp{0%{opacity:0;transform:translate(-50%,10px)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-48px)}}
    .av-sw{transform-box:view-box;transform-origin:50% 100%;animation:sway 4.8s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
    .av-hair{transform-origin:50% 25%;animation:hsway 3.6s ease-in-out infinite}@keyframes hsway{0%,100%{transform:rotate(2.2deg)}50%{transform:rotate(-2.2deg)}}
    .who .av-sw,.who .av-hair,.who .pb,.who .pt-tail,.who .pt-head,.who .pt-eyes,.who .av-eyes{animation-delay:var(--d,0s)}
    .who{width:236px;flex:none}
    .who .wp{position:absolute;right:4px;bottom:34px;width:66px;z-index:4;font-size:0}
    .who .bub{bottom:calc(100% - 50px);left:56%}
    .prev{width:250px}.prev .stu{filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
    .stu-up{transform-box:view-box;transform-origin:90px 186px;animation:stup 4.2s ease-in-out infinite}@keyframes stup{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.9deg)}}
    .stu-head{transform-box:view-box;transform-origin:118px 108px;animation:sthead 5.6s ease-in-out infinite}@keyframes sthead{0%,100%{transform:rotate(-1.5deg)}45%{transform:rotate(2.2deg)}}
    .stu-hair{transform-box:view-box;transform-origin:100px 50px;animation:sthair 3.4s ease-in-out infinite}@keyframes sthair{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg)}}
    .stu-arm{animation:starm 1.8s ease-in-out infinite}@keyframes starm{0%,100%{transform:translateX(0)}25%{transform:translateX(3px) translateY(1px)}50%{transform:translateX(5px)}75%{transform:translateX(2px) translateY(1px)}}
    .stu-eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
    .who .stu-up,.who .stu-head,.who .stu-hair,.who .stu-arm{animation-delay:var(--d,0s)}
        .steam{animation:steam 2.4s ease-in-out infinite}@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-7px)}}
    .bgart{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    .scene .who{z-index:2}.scene .bub{z-index:6}
    .fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}.fx i{position:absolute}
    .fx.petal i{top:-6%;width:10px;height:7px;border-radius:70% 0 70% 0;background:#ffb7cf;animation:petal 7s linear infinite}
    @keyframes petal{to{transform:translate(-90px,520px) rotate(540deg)}}
    .fx.star i{width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 3s ease-in-out infinite}
    @keyframes tw{50%{opacity:.15;transform:scale(.5)}}
    .rn{animation:rn .7s linear infinite}@keyframes rn{from{transform:translateY(-60px)}to{transform:none}}
    .glow{animation:glow 5s ease-in-out infinite}@keyframes glow{50%{opacity:.7}}
    .wv{animation:wv 3s ease-in-out infinite}@keyframes wv{50%{transform:translateX(-14px)}}
    .petstage{margin:0 auto 6px;filter:drop-shadow(0 14px 12px rgba(0,0,0,.08))}
    .petstage .pet{overflow:visible}
    .petmini{display:inline-block;width:38px;vertical-align:middle;pointer-events:none}
  </style>
</head>
<body>
  <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#44503f;background:#f1eee6;z-index:100">
    <div style="font-size:42px">📚</div>
    <div id="boottxt" style="font-weight:600">Loading DueDash…</div>
    <div id="booterr" style="font-size:13px;max-width:520px;color:#8a3b3b;white-space:pre-wrap"></div>
    <button id="bootbtn" onclick="location.reload()" style="display:none;padding:10px 18px;border-radius:12px;border:1px solid #bbb;background:#fff;font-size:15px;cursor:pointer">Reload</button>
  </div>
  <script>
    (function () {
      var errs = [];
      function show(msg) {
        var b = document.getElementById("boot");
        if (!b || window.__ddReadyFlag) return;
        b.style.display = "flex";
        document.getElementById("boottxt").textContent = msg;
        document.getElementById("booterr").textContent = errs.slice(0, 4).join("\n");
        document.getElementById("bootbtn").style.display = "inline-block";
      }
      window.addEventListener("error", function (e) {
        errs.push((e.message || "Error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
        show("Something went wrong while loading.");
      });
      window.addEventListener("unhandledrejection", function (e) {
        errs.push("Promise: " + ((e.reason && e.reason.message) || e.reason));
        show("Something went wrong while loading.");
      });
      window.__ddReady = function () {
        window.__ddReadyFlag = true;
        var b = document.getElementById("boot");
        if (b) b.style.display = "none";
      };
      setTimeout(function () {
        show(window.__ddStarted
          ? "Still loading… your internet or the database may be slow."
          : "The app didn't start. The file may not have uploaded fully, or your browser is blocking it.");
      }, 10000);

  <script>
    (function () {
      var T = [["sage","🌿 Sage","#5d7d61","#2d4738"],["ocean","🌊 Ocean","#3f86b0","#2b6488"],["sunset","🌇 Sunset","#e07a4f","#c25a34"],["lavender","🪻 Lavender","#7c63c4","#5f47a6"],["rose","🌸 Rose","#d6638b","#b94670"],["midnight","🌙 Midnight","#2b3442","#151a22"]];
      var cur = "sage", panel = document.getElementById("tpanel");
      try { cur = localStorage.getItem("dd_theme") || "sage"; } catch (e) {}
      function draw() {
        panel.innerHTML = "<b>🎨 Colour theme</b>" + T.map(function (t) {
          return '<button class="' + (t[0] === cur ? "" : "alt") + '" data-th="' + t[0] + '"><i style="background:linear-gradient(135deg,' + t[2] + ',' + t[3] + ')"></i>' + t[1] + '</button>';
        }).join("");
      }
      function set(t) {
        cur = t; document.documentElement.setAttribute("data-theme", t);
        try { localStorage.setItem("dd_theme", t); } catch (e) {}
        var m = document.querySelector('meta[name=theme-color]');
        for (var i = 0; i < T.length; i++) if (T[i][0] === t && m) m.setAttribute("content", T[i][3]);
        draw();
      }
      set(cur);
      document.addEventListener("click", function (e) {
        var b = e.target.closest && e.target.closest("[data-th]");
        if (b) return set(b.getAttribute("data-th"));
        if (e.target.closest && e.target.closest("#tbtn")) return panel.classList.toggle("hidden");
        if (!e.target.closest || !e.target.closest("#tpanel")) panel.classList.add("hidden");
      });
    })();
  </script>

    const planDays = () => {
      const t0 = plus(0);
      const ex = (P.exams || []).filter(e => e.date >= t0);
      if (!ex.length) return [];
      const last = ex.reduce((m, e) => e.date > m ? e.date : m, "");
      const out = [], used = {};
      ex.forEach(e => used[e.subject + e.date] = 0);

      for (let o = 0; o <= 120; o++) {
        const d = plus(o);
        if (d > last) break;
        const active = ex.filter(e => e.date > d);
        const slots = [];
        if (active.length) {
          for (let s = 0; s < (P.revPer || 2); s++) {
            let best = null, bs = -1;
            active.forEach(e => {
              const left = Math.max(1, Math.round((new Date(e.date + "T00:00:00") - new Date(d + "T00:00:00")) / 864e5));
              const sc = (1 / left) / (used[e.subject + e.date] + 1);
              if (sc > bs) { bs = sc; best = e; }
            });
            if (!best) break;
            used[best.subject + best.date]++;
            slots.push(best.subject);
          }
        }

        out.push({ d, slots, exams: ex.filter(e => e.date === d) });
      }

      return out;
    };

        lastSeen:Date.now()
      };
      return setDoc(ref, full).catch(() => setDoc(ref, { ...full, pet:clip((P.pet && P.pet.species) || "🐱", 8) }).catch(e => console.warn("room member save failed:", e.code || e.message)));
    };

    const mmss = (ms) => {
      const s = Math.max(0, Math.ceil(ms / 1000));
      return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    };

    const chatHTML = () => chat.length
      ? chat.map(m => `<div class="msg ${m.uid === user.uid ? "me" : ""}"><b>${esc(m.username || "Student")}:</b> ${esc(m.text || "")}</div>`).join("")
      : '<div class="sub">No messages yet. Say hi! 👋</div>';

    const paintChat = () => {
      const el = $("chatlog");
      if (!el || view !== "room") return;
      const atEnd = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      el.innerHTML = chatHTML();
      if (atEnd) el.scrollTop = el.scrollHeight;
    };

    async function sendChat() {
      const inp = $("chatin");
      if (!inp || !room) return;
      const text = inp.value.trim().slice(0, 100);
      if (!text) return;
      if (Date.now() - lastSend < 800) { toast("Slow down a little 🙂"); return; }
      lastSend = Date.now();
      inp.value = "";
      try {
        await addDoc(collection(db, "rooms", room.code, "messages"), {
          uid:user.uid,
          username:P.username,
          text,
          at:Date.now()
        });
      } catch (e) {
        toast("Message couldn't be sent");
      }
    }

    const tfAnswer = (value) => value === true || value === 1 || value === "1" || value === "true";

    const playable = (d) => (d.questions || []).filter(x => (x.type || "mc") !== "match" || (x.pairs || []).length >= 2);
    const QT = 20000, LBT = 6000;
    const speedPts = (el) => Math.round(1000 * (1 - Math.min(1, Math.max(0, el) / QT) / 2));
    const raceSched = () => {
      const S = [], D = [];
      let t = race.startAt;
      for (let k = 0; k < race.questions.length; k++) {
        let d = QT;
        if (racePlayers.length && racePlayers.every(p => p.ats && p.ats[k] >= t)) {
          d = Math.min(QT, Math.max(1500, Math.max(...racePlayers.map(p => p.ats[k])) - t + 900));
        }
        S.push(t); D.push(d); t += d + LBT;
      }
      return { S, D, end:t };
    };
    const racePhase = () => {
      const now = Date.now(), sc = raceSched(), n = race.questions.length;
      if (now < race.startAt) return { ph:"wait", left:race.startAt - now };
      for (let k = 0; k < n; k++) {
        const r = now - sc.S[k];
        if (r < sc.D[k]) return { ph:"q", k, el:r, left:sc.D[k] - r, dur:sc.D[k] };
        if (r < sc.D[k] + LBT) return { ph:"lb", k, left:sc.D[k] + LBT - r };
      }
      return { ph:"over", k:n };
    };
    const newMyRace = (rid) => ({ rid, ans:{}, ats:{}, score:0, right:0, paid:false, mk:-1, m:[], order:[] });
    const raceOver = () => !!race && (race.status === "done" || (race.status === "live" && Date.now() >= raceSched().end));
    const standings = () => [...racePlayers].sort((a, b) => (b.correct || 0) - (a.correct || 0) || ((a.finished ? a.finishedAt : 9e15) - (b.finished ? b.finishedAt : 9e15)) || (b.answered || 0) - (a.answered || 0));
    const raceRef = () => doc(db, "rooms", room.code, "races", race.id);
    let atsOk = true;
    const pushProgress = (answered, correct, fin) => {
      const ref = doc(db, "rooms", room.code, "races", race.id, "players", user.uid);
      const d = { username:P.username, emoji:P.emoji || "😀", correct, answered, finished: !!fin, finishedAt: fin ? Date.now() : 0 };
      if (!atsOk) return setDoc(ref, d);
      return setDoc(ref, { ...d, ats:(myRace && myRace.ats) || {} }).catch(() => { atsOk = false; return setDoc(ref, d); });
    };

    let lastKey = "";
    setInterval(() => {
      if (view === "room" && race && race.status === "live") {
        const ph = racePhase();
        const key = race.id + ph.ph + (ph.k ?? "") + (ph.ph === "wait" ? Math.ceil(ph.left / 1000) : "");
        if (key !== lastKey) {
          lastKey = key;
          paintRace();
          if (ph.ph === "over") { finishMyRace(); maybeWin(); }
        } else if (ph.ph === "q" || ph.ph === "lb") {
          const tl = $("tleft"); if (tl) tl.textContent = Math.ceil(ph.left / 1000) + "s";
          const tb = $("tbar"); if (tb) tb.style.width = Math.round(ph.left / (ph.ph === "q" ? ph.dur : LBT) * 100) + "%";
        }
      }
      if (view === "qtake" && qz && qz.questions[qz.i]) {
        const x = qz.questions[qz.i];
        const isM = x.type === "match";
        const done = isM ? qz.chk : qz.sel !== null;
        if (!done) {
          const el = Date.now() - qz.start;
          if (el >= QT) { qz.timedOut = true; if (isM) qz.chk = true; else qz.sel = -1; render(); }
          else {
            const tl = $("qleft"); if (tl) tl.textContent = Math.ceil((QT - el) / 1000) + "s";
            const tb = $("qbar"); if (tb) tb.style.width = Math.round((QT - el) / QT * 100) + "%";
          }
        }
      }
    }, 250);

    let paintKey = "", nqT;
    const paintRace = () => {
      const el = $("racebox");
      if (el && view === "room") {
        const ph = race && race.status === "live" ? racePhase() : null;
        const key = race ? race.id + race.status + (ph ? ph.ph + (ph.k ?? "") : "") : "none";
        if (key !== paintKey) { paintKey = key; el.classList.add("newq"); clearTimeout(nqT); nqT = setTimeout(() => el.classList.remove("newq"), 900); }
        el.innerHTML = raceHTML();
      }
    };

    const raceResults = () => {
      const t = rsq.trim().toLowerCase();
      const mine = quizzes.filter(d => playable(d).length >= 2 && String(d.title).toLowerCase().includes(t));
      const others = pubQ.filter(d => d.ownerId !== user.uid && playable(d).length >= 2 && String(d.title).toLowerCase().includes(t));
      const row = (d, by) => `
        <div class="card row">
          <div>
            <b>${esc(d.title)}</b>
            <div class="sub">${by ? "Public · by " + esc(d.ownerName || "someone") : "Your quiz"} · ${playable(d).length} questions</div>
          </div>
          <button data-act="rpost" data-id="${esc(d.id)}">🏁 Post competition</button>
        </div>
      `;
      const short = quizzes.filter(d => playable(d).length < 2 && String(d.title).toLowerCase().includes(t))
        .map(d => `<div class="card"><b>${esc(d.title)}</b><div class="sub">Your quiz · needs at least 2 questions for a competition (has ${playable(d).length})</div></div>`);
      const all = [...mine.map(d => row(d, false)), ...others.map(d => row(d, true)), ...short];
      if (!all.length) return `<div class="empty">${t ? "No quizzes match your search." : "No public quizzes yet."}</div>`;
      return all.slice(0, 20).join("") + (all.length > 20 ? '<div class="sub">Showing the first 20. Type to narrow it down.</div>' : "");
    };

    const postForm = () => {
      const any = quizzes.some(d => playable(d).length >= 2) || pubQ.some(d => d.ownerId !== user.uid && playable(d).length >= 2);
      if (!any) return '<div class="sub">No quizzes are available yet. Make one in My Quizzes or share a public one in Explore. A competition needs at least 2 questions.</div>';
      return `
        <div class="sub" style="margin:6px 0 10px">Search for one of your own quizzes or a public quiz. Answer fast: the quicker you get it right, the more points you earn (up to 1000). Wrong or late answers score nothing, and a leaderboard shows between questions.</div>
        <div class="btns"><input id="rsq" placeholder="🔍 Search quizzes by name..." value="${esc(rsq)}" autocomplete="off" style="flex:1" /><button type="button" class="alt" data-act="rrefresh">↻ Refresh</button></div>
        <div class="sub" id="rinfo">${quizErr ? "⚠️ Couldn't load " + esc(quizErr) : "Loaded " + quizzes.length + " of your quizzes and " + pubQ.length + " public quizzes."}</div>
        <div id="rres">${raceResults()}</div>
      `;
    };

    const lanes = () => {
      const total = race.questions.length;
      return [...racePlayers].sort((a, b) => (b.correct || 0) - (a.correct || 0) || (b.answered || 0) - (a.answered || 0)).map(p => {
        const pct = Math.round(((p.correct || 0) / total) * 100);
        const left = Math.min(94, Math.max(4, pct));
        return `
          <div class="lane">
            <div class="ln">${esc(p.emoji || "😀")} ${esc(p.username || "Student")}${p.id === user.uid ? " (you)" : ""}</div>
            <div class="track">
              <i style="width:${pct}%"></i>
              <span class="flag">🏁</span>
              <span class="rider" style="left:${left}%">${esc(p.emoji || "😀")}</span>
            </div>
            <div class="sc">${p.correct || 0} ✅</div>
          </div>
        `;
      }).join("");
    };

    const scoreboard = (limit) => {
      const st = standings();
      const medal = i => ["🥇","🥈","🥉"][i] || "#" + (i + 1);
      const rows = st.slice(0, limit).map((p, i) => `
        <div class="card row ${p.id === user.uid ? "me" : ""}" style="--i:${i}">
          <b>${medal(i)} ${esc(p.emoji || "😀")} ${esc(p.username)}${p.id === user.uid ? " (you)" : ""}</b>
          <span>${p.correct || 0} pts</span>
        </div>`);
      const myI = st.findIndex(p => p.id === user.uid);
      if (myI >= limit) rows.push(`<div class="sub" style="text-align:center">…</div><div class="card row me"><b>${medal(myI)} You</b><span>${st[myI].correct || 0} pts</span></div>`);
      return rows.join("");
    };

    const raceQuestion = (ph, total) => {
      const k = ph.k, x = race.questions[k], my = myRace.ans[k];
      const inQ = ph.ph === "q";
      const head = `<p class="sub">Question ${k + 1} of ${total} · Score ${myRace.score}</p>`;
      const qcard = `<div class="card"><b>${esc(x.q)}</b>${imgTag(x.img)}</div>`;
      const timer = `<div class="tbar"><i id="tbar" style="width:${Math.round(ph.left / (inQ ? ph.dur : LBT) * 100)}%"></i></div>`;

      if (!inQ) {
        const verdict = my ? (my.right ? `✅ Correct! +${my.pts} pts` : "❌ Wrong · +0 pts") : "⏰ Too slow · +0 pts";
        let ans;
        if (x.type === "match") ans = x.pairs.map(p => `${esc(p.l)} → ${esc(p.r)}`).join("<br>");
        else if (x.type === "tf") ans = tfAnswer(x.ans) ? "True" : "False";
        else ans = esc(x.opts[x.ans]);
        return head + qcard + `
          <div class="card verdict" style="text-align:center"><b>${verdict}</b><div class="sub">Answer: ${ans}</div></div>
          <h3>🏆 Leaderboard</h3>${scoreboard(5)}
          ${timer}
          <div class="sub" style="text-align:center">${k + 1 >= total ? "Final results in" : "Next question in"} <b id="tleft">${Math.ceil(ph.left / 1000)}s</b></div>`;
      }

      const clock = `${timer}<div class="sub" style="text-align:right"><b id="tleft">${Math.ceil(ph.left / 1000)}s</b> left · answer fast for more points</div>`;
      const locked = `<p class="sub" style="text-align:center">🔒 Answer locked in! Waiting for the timer…</p>`;

      if (x.type === "match") {
        if (myRace.mk !== k) { myRace.mk = k; myRace.order = shuffle(x.pairs.map((_, j) => j)); myRace.m = []; }
        const choices = myRace.order.map(j => x.pairs[j].r);
        return head + clock + qcard + x.pairs.map((p, j) => `
          <div class="card row">
            <b>${esc(p.l)}</b>
            <span>
              <select data-rmi="${j}" ${my ? "disabled" : ""}>
                <option value="">Choose...</option>
                ${choices.map(r => `<option value="${esc(r)}" ${myRace.m[j] === r ? "selected" : ""}>${esc(r)}</option>`).join("")}
              </select>
            </span>
          </div>`).join("") + (my ? locked : `<button data-act="rmcheck">Lock in answers</button>`);
      }

      const items = x.type === "tf"
        ? [["True", 1], ["False", 0]]
        : x.opts.map((o, j) => [`ABCD`[j] + ". " + o, j]);
      return head + clock + qcard + items.map(([label, index]) => `
        <button class="choice alt ${my && my.sel === index ? "on" : ""}" data-act="rpick" data-i="${index}" ${my ? "disabled" : ""}>${esc(label)}</button>
      `).join("") + (my ? locked : "");
    };

    const raceHTML = () => {
      if (!race) return postForm();

      const total = race.questions.length;
      const mine = racePlayers.find(p => p.id === user.uid);
      const host = race.hostId === user.uid;
      const hostP = racePlayers.find(p => p.id === race.hostId);
      const head = `
        <div class="row">
          <div><b>🏁 ${esc(race.title)}</b></div>
          <span class="sub">${total} questions${hostP ? " · posted by " + esc(hostP.username) : ""}</span>
        </div>
      `;

      if (raceOver()) {
        const st = standings();
        const w = st[0];
        const medal = i => ["🥇","🥈","🥉"][i] || "#" + (i + 1);

        return head + (w ? `<div class="card verdict" style="margin:10px 0;text-align:center"><div style="font-size:34px">🏆</div><b>${esc(w.emoji || "")} ${esc(w.username)} wins with ${w.correct || 0} points!</b></div>` : "") +
          st.map((p, i) => `
            <div class="card row ${p.id === user.uid ? "me" : ""}" style="--i:${i}">
              <b>${medal(i)} ${esc(p.emoji || "😀")} ${esc(p.username)}${p.id === user.uid ? " (you)" : ""}</b>
              <span>${p.correct || 0} pts</span>
            </div>
          `).join("") +
          `<h3>Play again?</h3>${postForm()}`;
      }

      if (race.status === "open") {
        const chips = racePlayers.map(p => `<span class="chip">${esc(p.emoji || "😀")} ${esc(p.username)}</span>`).join(" ");
        return head + `
          <div class="sub" style="margin:8px 0">Waiting for players to join…</div>
          <div class="btns">${chips || '<span class="sub">No one yet</span>'}</div>
          <div class="btns" style="margin-top:10px">
            ${mine ? "<span class='sub'>✅ You're in!</span>" : `<button data-act="rjoinrace">Join competition</button>`}
            ${host ? ` <button class="green" data-act="rstart">▶ Start competition (${racePlayers.length} player${racePlayers.length === 1 ? "" : "s"})</button> <button class="alt" data-act="rend">Cancel</button>` : ""}
          </div>
        `;
      }

      const ph = racePhase();
      let mid = "";
      if (ph.ph === "wait") {
        mid = `<div class="cd">${Math.max(1, Math.ceil(ph.left / 1000))}</div><div class="sub" style="text-align:center">Get ready… faster correct answers earn more points!</div>`;
      } else if (mine && myRace) {
        mid = raceQuestion(ph, total);
      } else {
        mid = `<div class="sub">The competition has started (question ${Math.min(ph.k + 1, total)} of ${total}). You can watch from here.</div><h3>🏆 Leaderboard</h3>${scoreboard(8)}`;
      }

      return head + mid + (host ? `<button class="alt" data-act="rend" style="margin-top:8px">End competition now</button>` : "");
    };

    function watchPlayers() {
      if (psub) { try { psub(); } catch (e) {} psub = null; }
      if (!race || !room) return;
      psub = onSnapshot(collection(db, "rooms", room.code, "races", race.id, "players"), snap => {
        racePlayers = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        const mine = racePlayers.find(p => p.id === user.uid);
        if (mine && myRace && myRace.rid === race.id && (mine.correct || 0) > myRace.score) myRace.score = mine.correct;
        paintRace();
        maybeWin();
      }, err => console.warn("race players", err));
    }

    function raceAnswer(i) {
      if (!race || !myRace || myRace.rid !== race.id || race.status !== "live") return;
      const ph = racePhase();
      if (ph.ph !== "q") return;
      const x = race.questions[ph.k];
      if (!x || myRace.ans[ph.k]) return;
      if (!racePlayers.some(p => p.id === user.uid)) return;

      const right = x.type === "match"
        ? x.pairs.every((p, k) => (myRace.m || [])[k] === p.r)
        : x.type === "tf"
        ? i === (tfAnswer(x.ans) ? 1 : 0)
        : i === x.ans;
      const pts = right ? speedPts(ph.el) : 0;
      myRace.ans[ph.k] = { sel:i, right, pts };
      myRace.ats[ph.k] = Date.now();
      myRace.score += pts;
      if (right) myRace.right++;
      pushProgress(Object.keys(myRace.ans).length, myRace.score, false).catch(() => {});
      paintRace();
    }

    async function finishMyRace() {
      if (!myRace || myRace.paid || !race || P.lastRaceDone === race.id) return;
      if (!Object.keys(myRace.ans).length) return;
      myRace.paid = true;
      const total = race.questions.length;
      const c = myRace.right;
      const pts = c * 2 + (c === total ? 10 : 0);
      try {
        await earn(pts, { racesPlayed:(P.racesPlayed || 0) + 1, lastRaceDone: race.id });
        toast("🏁 You finished! +" + pts + " points");
      } catch (e) {}
    }

    async function maybeWin() {
      if (winBusy || !raceOver()) return;
      const st = standings();
      if (st.length < 2 || st[0].id !== user.uid || !(st[0].correct > 0) || P.lastWonRace === race.id) return;
      winBusy = true;
      try {
        await earn(15, { racesWon:(P.racesWon || 0) + 1, lastWonRace: race.id });
        toast("🏆 You won the competition! +15 points");
      } catch (e) {}
      winBusy = false;
    }

    const finishFocus = async () => {
      rs.status = "studying";
      rs.focusEnd = 0;
      heartbeat();
      try {
        await earn(5, { focusDone:(P.focusDone || 0) + 1 });
        toast("🎯 Focus session complete! +5 points");
      } catch (e) {}
      if (view === "room") render();
    };

    async function enterRoom(code, info) {
      await leaveRoom();
      room = { code, name: info.name };
      members = [];
      chat = [];
      chatSeen = {};
      chatFirst = true;
      race = null;
      racePlayers = [];
      myRace = null;
      firstRace = true;
      rs = { status:"studying", emote:"", emoteAt:0, focusEnd:0 };

      await heartbeat();

      unsub = onSnapshot(collection(db, "rooms", code, "members"), snap => {
        members = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        paintRoom();
      }, err => alert("Room error: " + (err.code || err.message)));

      const since = Date.now() - 30000;
      unsubC = onSnapshot(query(collection(db, "rooms", code, "messages"), where("at", ">=", since), orderBy("at", "desc"), limit(50)), snap => {
        const list = snap.docs.map(d => ({ id:d.id, ...d.data() })).reverse();
        const now = Date.now();
        let fresh = false;
        list.forEach(m => {
          if (!(m.id in chatSeen)) {
            chatSeen[m.id] = chatFirst ? 0 : now;
            if (!chatFirst) fresh = true;
          }
        });
        chatFirst = false;
        chat = list;
        paintRoom();
        paintChat();
        if (fresh) setTimeout(paintRoom, 8300);
      }, err => alert("Chat error: " + (err.code || err.message)));

      rsub = onSnapshot(query(collection(db, "rooms", code, "races"), orderBy("createdAt", "desc"), limit(1)), snap => {
        const d = snap.docs[0];
        let nr = d ? { id:d.id, ...d.data() } : null;
        if (nr && Date.now() - (nr.createdAt || 0) > 7200000) nr = null;
        const changed = (nr ? nr.id : null) !== (race ? race.id : null);
        const was = race ? race.status : "";
        race = nr;
        if (changed) {
          racePlayers = [];
          myRace = nr ? newMyRace(nr.id) : null;
          watchPlayers();
          if (!firstRace && nr && nr.hostId !== user.uid && nr.status === "open") toast("🏁 A competition was posted in your room!");
        } else if (nr && was === "open" && nr.status === "live" && !firstRace) {
          toast("🏁 The competition is starting!");
        }
        firstRace = false;
        paintRace();
      }, err => console.warn("races", err));

      hb = setInterval(heartbeat, 30000);
      tickN = 0;
      rt = setInterval(() => {
        if (view !== "room") return;
        if (rs.status === "focus" && Date.now() >= rs.focusEnd) finishFocus();
        const el = $("ftimer");
        if (el && rs.status === "focus") el.textContent = mmss(rs.focusEnd - Date.now());
        if (race && race.status === "live" && Date.now() < race.startAt + 1100) paintRace();
        if (++tickN % 5 === 0) paintRoom();
      }, 1000);

      await save({ roomsJoined:(P.roomsJoined || 0) + 1 });
      try { await loadFriends(); } catch (e) {}
      try { quizzes = (await getDocs(query(collection(db, "quizzes"), where("ownerId", "==", user.uid)))).docs.map(d => ({ id:d.id, ...d.data() })); } catch (e) {}
      try { pubQ = (await getDocs(query(collection(db, "quizzes"), where("isPublic", "==", true), limit(100)))).docs.map(d => ({ id:d.id, ...d.data() })); } catch (e) {}
      view = "room";
      render();
    }

    async function leaveRoom() {
      if (!room) return;
      const code = room.code;
      try { if (unsub) unsub(); } catch (e) {}
      try { if (unsubC) unsubC(); } catch (e) {}
      try { if (rsub) rsub(); } catch (e) {}
      try { if (psub) psub(); } catch (e) {}
      unsub = null; unsubC = null; rsub = null; psub = null;
      clearInterval(hb); clearInterval(rt);
      room = null; members = []; chat = []; chatSeen = {}; race = null; racePlayers = []; myRace = null;
      try { await deleteDoc(doc(db, "rooms", code, "members", user.uid)); } catch (e) {}
    }

    let quizErr = "";
    async function refreshQuizzes() {
      quizErr = "";
      try { quizzes = (await getDocs(query(collection(db, "quizzes"), where("ownerId", "==", user.uid)))).docs.map(d => ({ id:d.id, ...d.data() })); }
      catch (e) { quizErr = "your quizzes: " + (e.code || e.message); }
      try { pubQ = (await getDocs(query(collection(db, "quizzes"), where("isPublic", "==", true), limit(100)))).docs.map(d => ({ id:d.id, ...d.data() })); }
      catch (e) { quizErr += (quizErr ? " / " : "") + "public quizzes: " + (e.code || e.message); }
    }

    async function go(v) {
      if (v === "room" && !room) v = "rooms";
      view = v;
      if (v === "room") await refreshQuizzes();
      try {
        if (v === "planner" || v === "rev") checkReminders();
        if (v === "decks") decks = (await getDocs(query(collection(db, "decks"), where("ownerId", "==", user.uid)))).docs.map(d => ({ id:d.id, ...d.data() }));
        if (v === "quizzes") quizzes = (await getDocs(query(collection(db, "quizzes"), where("ownerId", "==", user.uid)))).docs.map(d => ({ id:d.id, ...d.data() }));
        if (v === "friends") { fsq = ""; fres = null; await loadFriends(); }
        if (v === "explore") {
          q = "";
          pub = (await getDocs(query(collection(db, "decks"), where("isPublic", "==", true), limit(100)))).docs.map(d => ({ id:d.id, ...d.data() }));
          pubQ = (await getDocs(query(collection(db, "quizzes"), where("isPublic", "==", true), limit(100)))).docs.map(d => ({ id:d.id, ...d.data() }));
        }
        if (v === "leaders") {
          board = (await getDocs(query(collection(db, "leaderboard"), orderBy("points", "desc"), limit(20)))).docs.map(d => ({ id:d.id, ...d.data() }));
          streaks = (await getDocs(query(collection(db, "leaderboard"), orderBy("streak", "desc"), limit(20)))).docs.map(d => ({ id:d.id, ...d.data() }));
        }
      } catch (e) { alert("Database error: " + (e.code || e.message)); }
      render();
    }

    const petEmoji = () => lvl(P) < 2 ? "🥚" : (P.pet && P.pet.species) || "🐱";
    const goalBar = () => {
      const gp = Math.min(GOAL, P.goalDay === day() ? (P.goalPts || 0) : 0);
      return `
        <div class="bar"><i style="width:${(gp / GOAL) * 100}%"></i></div>
        <div class="sub">${gp} / ${GOAL} points today${gp >= GOAL ? " ✅ goal done!" : " · hit the goal for +5 bonus"}</div>
      `;
    };

    const paintRoom = () => {
      const el = $("scene");
      if (el && view === "room") { const h = sceneHTML(); if (el.__h !== h) { el.__h = h; el.innerHTML = h; } }
    };

    const sceneHTML = () => {
      const b = bd();
      const now = Date.now();
      const hsh = (s) => [...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0);
      const act = members.filter(m => now - (m.lastSeen || 0) < 90000).sort((a, c) => String(a.username || "").localeCompare(String(c.username || "")));
      const lastMsg = uid => {
        for (let i = chat.length - 1; i >= 0; i--) {
          if (chat[i].uid === uid) return chat[i];
        }
        return null;
      };
      const bubble = m => {
        const cm = lastMsg(m.id);
        if (cm && chatSeen[cm.id] && now - chatSeen[cm.id] < 8000) return `<div class="bub">${esc(cm.text)}</div>`;
        if (m.emote && now - (m.emoteAt || 0) < 8000) return `<div class="bub">${esc(m.emote)}</div>`;
        return "";
      };
      return b.art() + (act.length
        ? act.map(m => `
            <div class="who" style="--d:-${(hsh(m.id) % 50) / 10}s">
              ${bubble(m)}
              ${studier(m.avatar)}
              <div class="wp">${(() => { const pm = String(m.pet || "🐱").match(/^(\D+?)(\d*)$/u) || [0, "🐱", ""]; return petHTML(pm[1], +pm[2] || 3, "auto"); })()}</div>
              <div class="wn">${esc(m.emoji || "😀")} ${esc(m.username || "Student")}${m.id === user.uid ? " (you)" : ""}</div>
              <div class="st">${ST[m.status] || ST.studying}</div>
            </div>
          `).join("")
        : '<div class="sub" style="color:#fff;position:relative;z-index:2">Waiting for people to join…</div>');
    };

    const vPlanner = () => {
      const rows = P.tasks.map((t, i) => {
        const od = t.due && !t.done && t.due < day();
        const dueTxt = t.due ? (od ? "⚠️ Overdue · " : "Due: ") + esc(t.due) : "";
        return `
          <div class="card row ${t.done ? "done" : ""}">
            <div>
              <div class="nm">${esc(t.name)}</div>
              <div class="sub ${od ? "overdue" : ""}">${dueTxt}</div>
            </div>
            <div>
              ${t.done ? "" : `<button data-act="done" data-i="${i}">Done +5</button> `}
              <button class="alt" data-act="deltask" data-i="${i}">Delete</button>
            </div>
          </div>
        `;
      }).join("");

      return `
        <h2>Hi, ${esc(P.emoji || "😀")} ${esc(P.username)} 👋</h2>
        <p class="sub">Here's what's on your plate.</p>
        <div class="stats">
          <div class="stat"><b>⭐ ${P.points}</b><span>points</span></div>
          <div class="stat"><b>🔥 ${liveStreak(P)}</b><span>day streak</span></div>
          <div class="stat"><b>✅ ${P.tasksDone}</b><span>tasks done</span></div>
        </div>

        <div class="card row">
          <div style="display:flex;gap:12px;align-items:center">
            <div style="width:68px">${petHTML(P.pet.species, lvl(P), "auto")}</div>
            <div>
              <b>${esc(P.pet.name)}</b>
              <div class="sub">Level ${lvl(P)}</div>
            </div>
          </div>
          <div style="flex:1;min-width:200px">
            <b>🎯 Daily goal</b>
            ${goalBar()}
          </div>
        </div>

        <div class="card">
          <input id="tk" placeholder="Task, like Math worksheet" maxlength="100" />
          <input id="td" type="date" />
          <button data-act="addtask">+ Add task</button>
          <div class="sub" style="margin-top:8px">🔔 Tasks due tomorrow send a reminder to your notifications.</div>
        </div>

        ${rows || '<div class="empty">No tasks yet. Add your first one above! ✨</div>'}
      `;
    };

    const fmtT = (m) => { let h = Math.floor(m / 60) % 24; const mm = m % 60; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(mm).padStart(2, "0") + " " + ap; };
    const slotTime = (k) => {
      const [h, m] = (P.revStart || "16:00").split(":").map(Number);
      const sm = P.studyMin || 45, bm = P.breakMin === undefined ? 15 : P.breakMin;
      const s = h * 60 + m + k * (sm + bm);
      return fmtT(s) + " – " + fmtT(s + sm);
    };
    const SM = [15,20,25,30,45,50,60,75,90,120];
    const BM = [0,5,10,15,20,30];
    const opts = (arr, cur, fmt) => arr.map(n => `<option value="${n}" ${cur === n ? "selected" : ""}>${fmt ? fmt(n) : n}</option>`).join("");

    const vRev = () => {
      const t0 = plus(0);
      const exs = (P.exams || []).map((e, i) => ({ ...e, i })).sort((a, b) => a.date < b.date ? -1 : 1);
      const plan = planDays().slice(0, 28);

      const dt = d => new Date(d + "T00:00:00");
      const cell = (x) => {
        const D = dt(x.d);
        const isToday = x.d === t0;
        const wd = D.toLocaleDateString(undefined, { weekday:"short" });
        const dm = D.toLocaleDateString(undefined, { day:"numeric", month:"short" });
        const ex = x.exams.map(e => `<div class="cal-x">📝 Exam: ${esc(e.subject)}</div>`).join("");
        const sl = x.slots.map((s, k) => {
          const key = x.d + "|" + k + "|" + s;
          const done = P.revDone && P.revDone[key];
          return `
            <div class="cal-s ${done ? "done" : ""}">
              <div class="cal-t">🕒 ${slotTime(k)}</div>
              <div class="nm">📖 ${esc(s)}</div>
              ${done ? "<div>✅ Done</div>" : isToday ? `<button data-act="rdone" data-k="${esc(key)}">Done +10</button>` : ""}
            </div>
          `;
        }).join("");
        const rest = (!x.slots.length && !x.exams.length) ? '<div class="cal-r">Rest day 🌿</div>' : "";
        return `
          <div class="cal-d ${isToday ? "today" : ""}">
            <div class="cal-h"><span>${wd}</span><b>${dm}</b></div>
            ${ex}${sl}${rest}
          </div>
        `;
      };

      let grid = "";
      if (plan.length) {
        const lead = (dt(plan[0].d).getDay() + 6) % 7;
        grid = `
          <h3>Your study calendar</h3>
          <div class="cal">
            ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(n => `<div class="cal-w">${n}</div>`).join("")}
            ${"<div class='cal-e'></div>".repeat(lead)}
            ${plan.map(cell).join("")}
          </div>
        `;
      }

      const sm = P.studyMin || 45, bm = P.breakMin === undefined ? 15 : P.breakMin;
      return `
        <h2>Revision Planner</h2>
        <p class="sub">Add your exams and DueDash builds your study calendar, with more sessions for the exams coming up soonest.</p>

        <div class="card">
          <h3 style="margin-top:0">Your exams</h3>
          ${exs.length ? exs.map(e => `
            <div class="row" style="margin-bottom:8px">
              <span>📝 <b>${esc(e.subject)}</b> · ${esc(e.date)}</span>
              <button class="alt" data-act="xdel" data-i="${e.i}">Remove</button>
            </div>
          `).join("") : '<p class="sub">No exams yet.</p>'}

          <input id="xs" placeholder="Subject, like Maths" maxlength="30" />
          <input id="xd" type="date" min="${t0}" />
          <button data-act="xadd">+ Add exam</button>

          <h3>⏱️ Your study schedule</h3>
          <div class="sub" style="margin-top:6px">Study sessions per day:
            <select id="rp">${opts([1,2,3,4,5,6], P.revPer || 2)}</select>
          </div>
          <div class="sub" style="margin-top:10px">Study length:
            <select id="rsm">${opts(SM, sm, n => n + " min")}</select>
            · Break length:
            <select id="rbm">${opts(BM, bm, n => n === 0 ? "No break" : n + " min")}</select>
          </div>
          <div class="sub" style="margin-top:10px">First session starts at:
            <input id="rstart" type="time" value="${esc(P.revStart || "16:00")}" style="width:auto;margin:0 0 0 6px;padding:7px 10px" />
          </div>
          <div class="sub" style="margin-top:8px">🔔 You get a reminder the day before each exam.</div>
        </div>

        ${plan.length ? grid : '<div class="empty">Add an exam date to see your study calendar 📅</div>'}
      `;
    };

    const vPet = () => {
      const L = lvl(P);
      const lo = 10 * (L - 1) ** 2;
      const hi = 10 * L ** 2;
      const pct = Math.round((P.points - lo) / (hi - lo) * 100);
      const mood = P.lastDay === day() ? "😊 Happy, you studied today!" : P.lastDay === day(1) ? "🙂 Okay. Study today to keep it happy." : "😴 Sleepy. Study to wake it up!";
      const stage = L < 2 ? "Egg" : L < 5 ? "Baby" : L < 10 ? "Teen" : "Legend";
      const hat = L >= 10 ? "👑" : L >= 5 ? "🎓" : "";
      return `
        <h2>My Pet</h2>
        <p class="sub">Your pet grows every time you earn points.</p>
        <div class="card" style="text-align:center">
          <div class="petstage" style="width:${Math.min(260, 150 + L * 12)}px">${petHTML(P.pet.species, L, "auto")}</div>
          <button class="alt" data-act="trick">🎪 Do a trick!</button>
          <h3>${esc(P.pet.name)} · Level ${L} ${stage}</h3>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="sub">${Math.max(0, hi - P.points)} points to level ${L + 1}</div>
          <p>${L < 2 ? "🥚 Your egg hatches at level 2. Earn 10 points!" : mood}</p>
        </div>
        <div class="card"><b>🎯 Daily goal</b>${goalBar()}</div>
        <div class="card">
          <b>Choose your pet</b>
          <div class="btns" style="margin-top:10px">
            ${PETS.map((p, i) => `<button class="alt ${P.pet.species === p ? "on" : ""}" data-act="petsp" data-i="${i}"><span class="petmini">${petHTML(p, 3)}</span></button>`).join("")}
          </div>
          <br />
          <b>Name</b>
          <input id="pn" maxlength="16" value="${esc(P.pet.name)}" />
          <button data-act="petname">Save name</button>
        </div>
      `;
    };

    const swatch = (k, arr) => arr.map((c, i) => `<button class="sw ${((+P.avatar[k] || 0) % arr.length) === i ? "on" : ""}" style="background:${c}" data-act="av" data-k="${k}" data-i="${i}"></button>`).join("");
    const tbtn = (k, arr) => arr.map((n, i) => `<button class="alt ${((+P.avatar[k] || 0) % arr.length) === i ? "on" : ""}" data-act="av" data-k="${k}" data-i="${i}">${n}</button>`).join("");
    const bdPicker = () => `<div class="btns">${BACKDROPS.map((b, i) => `<button class="alt ${ix(BACKDROPS, P.backdrop) === b ? "on" : ""}" data-act="bd" data-i="${i}">${b.n}</button>`).join("")}</div>`;

    const vRooms = () => `
      <h2>Study Rooms</h2>
      <p class="sub">Study alongside friends. Rooms are private: only people with your code (or an invite) can join.</p>

      <div class="two">
        <div class="card">
          <h3 style="margin-top:0">Create a room</h3>
          <input id="rn" placeholder="Room name, like Maths group" maxlength="30" />
          <button data-act="rcreate">+ Create room</button>
        </div>

        <div class="card">
          <h3 style="margin-top:0">Join a room</h3>
          <input id="rc" placeholder="6-letter room code" maxlength="6" style="text-transform:uppercase" />
          <button data-act="rjoin">Join</button>
        </div>
      </div>

      <p class="sub">🔒 Chat is only visible to people inside the room. Never share private details.</p>

      <h3>Your character</h3>
      <div class="card two">
        <div class="prev">${studier(P.avatar)}</div>
        <div>
          <div class="sub">Quick looks</div>
          <div class="btns" style="margin-top:6px">${PRESETS.map((x, i) => `<button class="alt" data-act="preset" data-i="${i}">${x.n}</button>`).join("")}</div>

          <div class="sub" style="margin-top:12px">Skin</div>
          <div class="swatches" style="display:flex;gap:8px;flex-wrap:wrap">${swatch("skin", SK)}</div>

          <div class="sub">Hair colour</div>
          <div class="swatches" style="display:flex;gap:8px;flex-wrap:wrap">${swatch("hair", HR)}</div>

          <div class="sub">Hair style</div>
          <div class="btns">${tbtn("hs", HS)}</div>

          <div class="sub" style="margin-top:10px">Eyes</div>
          <div class="swatches" style="display:flex;gap:8px;flex-wrap:wrap">${swatch("eye", EY)}</div>

          <div class="sub">Outfit</div>
          <div class="swatches" style="display:flex;gap:8px;flex-wrap:wrap">${swatch("fit", FT)}</div>

          <div class="sub">Accessory</div>
          <div class="btns">${tbtn("acc", AC)}</div>

          <div class="sub" style="margin-top:10px">Face</div>
          <div class="btns">${tbtn("look", LK)}</div>

          <div class="sub" style="margin-top:10px">Top</div>
          <div class="btns">${tbtn("top", TP)}</div>
        </div>
      </div>

      <h3>Your backdrop</h3>${bdPicker()}
    `;

    const vRoom = () => `
      <div class="row">
        <div>
          <h2 style="margin:0">🏠 ${esc(room.name)}</h2>
          <div class="sub">Room code: <b>${esc(room.code)}</b> · share it with friends</div>
        </div>
        <div>
          <button class="alt" data-act="copycode">Copy code</button>
          <button class="red" data-act="leave">Leave</button>
        </div>
      </div>

      <div id="scene" class="scene" style="background:${bd().bg};margin-top:14px">${sceneHTML()}</div>

      <div class="card">
        <b>💬 Chat</b>
        <div id="chatlog" style="margin-top:8px">${chatHTML()}</div>
        <div class="chatrow">
          <input id="chatin" placeholder="Type a message..." maxlength="100" autocomplete="off" />
          <button data-act="chatsend">Send</button>
        </div>
      </div>

      <div class="card">
        <b>🏁 Competition</b>
        <div id="racebox" style="margin-top:8px">${raceHTML()}</div>
      </div>

      <div class="card">
        <b>👥 Invite a friend</b>
        ${friends.length ? `
          <div class="btns" style="margin-top:8px">
            ${friends.map(f => `<button class="alt" data-act="invite" data-id="${esc(f.uid)}">${esc(f.emoji || "😀")} ${esc(f.username)}</button>`).join("")}
          </div>
          <div class="sub">They get the invite in their 🔔 notifications and can accept or decline.</div>
        ` : '<p class="sub">Add friends in the Friends tab, then you can invite them here.</p>'}
      </div>

      <div class="card">
        <b>Status</b>
        <div class="btns" style="margin-top:8px">
          <button class="alt ${rs.status === "studying" ? "on" : ""}" data-act="rstatus" data-k="studying">📖 Studying</button>
          <button class="alt ${rs.status === "break" ? "on" : ""}" data-act="rstatus" data-k="break">☕ On break</button>
        </div>
      </div>

      <div class="card">
        <b>Say something</b>
        <div class="btns" style="margin-top:8px">${EMOTES.map((e, i) => `<button class="alt" data-act="emote" data-i="${i}">${e}</button>`).join("")}</div>
      </div>

      <div class="card">
        ${rs.status === "focus"
          ? `<b>🎯 Focus session</b> <span id="ftimer" style="font-size:22px;font-weight:700;margin:0 12px">${mmss(rs.focusEnd - Date.now())}</span><button class="alt" data-act="fstop">Stop</button>`
          : `<b>🎯 Focus timer</b><p class="sub" style="margin:4px 0 10px">25 minutes of focus earns +5 points. Your friends can see you're focusing.</p><button data-act="fstart">Start 25 min focus</button>`}
      </div>

      <div class="card">
        <b>Backdrop</b>
        ${bdPicker()}
      </div>
    `;

    const vFriends = () => {
      let res = "";
      if (fres) {
        if (fres.msg) res = `<div class="sub" style="margin-top:6px">${esc(fres.msg)}</div>`;
        else {
          const already = friends.some(f => f.uid === fres.uid);
          res = `
            <div class="row" style="margin-top:6px">
              <b>👤 ${esc(fres.username)}</b>
              ${already ? "<span>✅ Already friends</span>" : `<button data-act="freq" data-id="${esc(fres.uid)}">+ Send friend request</button>`}
            </div>
          `;
        }
      }

      const rows = friends.map(f => `
        <div class="card row">
          <div style="display:flex;gap:12px;align-items:center">
            <div class="pfp sm">${esc(f.emoji || "😀")}</div>
            <div>
              <b>${esc(f.username || "(unknown)")}</b>
              <div class="sub">⭐ ${f.points || 0} · 🔥 ${liveStreak(f)} · Pet Lv ${lvl(f)}</div>
            </div>
          </div>
          <div>
            <button data-act="fview" data-id="${esc(f.uid)}">View profile</button>
            <button class="alt" data-act="fremove" data-id="${esc(f.uid)}">Remove</button>
          </div>
        </div>
      `).join("");

      const pend = notifs.filter(n => n.type === "friend").length;

      return `
        <h2>Friends</h2>
        <p class="sub">Search a username to send a friend request. Friends can see each other's profiles.</p>

        <div class="card">
          <div class="pair">
            <input id="fs" placeholder="Search a username" maxlength="20" value="${esc(fsq)}" />
            <button data-act="fsearch" style="white-space:nowrap">🔍 Search</button>
          </div>
          ${res}
        </div>

        ${pend ? `<div class="card row"><span>👥 You have ${pend} friend request${pend === 1 ? "" : "s"} waiting.</span><button data-go="notifs">Open 🔔</button></div>` : ""}

        <h3>Your friends · ${friends.length}</h3>
        ${rows || '<div class="empty">No friends yet. Search a username above to add one! 👥</div>'}
      `;
    };

    const achTiles = (p) => AWARDS.map(a => {
      const v = a.val(p);
      const ok = v >= a.goal;
      const pct = Math.min(100, Math.round(v / a.goal * 100));
      return `
        <div class="ach ${ok ? "got" : ""}">
          <div class="ic">${ok ? a.icon : "🔒"}</div>
          <b>${a.name}</b>
          <div class="sub">${a.desc}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="sub">${Math.min(v, a.goal)} / ${a.goal}</div>
        </div>
      `;
    }).join("");

    const vProfile = () => {
      const p = prof;
      if (!p) return `<h2>Profile</h2><div class="empty">Couldn't load this profile.</div><br /><button data-go="friends">Back</button>`;
      const L = lvl(p);
      const got = AWARDS.filter(a => a.val(p) >= a.goal).length;
      const pet = L < 2 ? "🥚" : (p.pet && p.pet.species) || "🐱";
      const S = (i, n, l) => `<div class="stat"><b>${i} ${n}</b><span>${l}</span></div>`;
      return `
        <button class="alt" data-go="friends">← Back to friends</button><br /><br />
        <div class="card row">
          <div style="display:flex;gap:16px;align-items:center">
            <div class="pfp">${esc(p.emoji || "😀")}</div>
            <div>
              <h2 style="margin:0">${esc(p.username || "Student")}</h2>
              <div class="sub">Your friend 👥</div>
            </div>
          </div>
          <button class="alt" data-act="fremove" data-id="${esc(p.uid)}">Remove friend</button>
        </div>

        <div class="stats">
          ${S("⭐", p.points || 0, "points")}
          ${S("🔥", liveStreak(p), "day streak")}
          ${S("🏁", bestStreak(p), "best streak")}
          ${S(pet, L, "pet level")}
          ${S("🐾", (p.pet && p.pet.name) || "Buddy", "pet name")}
          ${S("📚", p.cardsStudied || 0, "cards studied")}
          ${S("✅", p.tasksDone || 0, "tasks done")}
          ${S("📝", p.quizzesTaken || 0, "quizzes finished")}
          ${S("🏗️", p.decksMade || 0, "decks made")}
          ${S("🎯", p.focusDone || 0, "focus sessions")}
          ${S("🗓️", p.revisionDone || 0, "revision sessions")}
          ${S("🏠", p.roomsJoined || 0, "rooms joined")}
        </div>

        <h3>🏆 Achievements · ${got} / ${AWARDS.length} unlocked</h3>
        <div class="awards">${achTiles(p)}</div>
      `;
    };

    const NI = { friend:"👥", invite:"🏠", reminder:"⏰", info:"🔔" };
    const vNotifs = () => `
      <h2>🔔 Notifications</h2>
      <p class="sub">Friend requests, room invites and reminders.</p>
      <br />
      ${notifs.length
        ? notifs.map(n => {

                <div>${btns}</div>

    const vEdit = () => `

      ${draft.cards.map((c, i) => `
        <div class="card">
          <input data-f="front" data-i="${i}" placeholder="Front (question)" maxlength="200" value="${esc(c.front)}" />
          ${imgPick("df", i, c.fImg)}
          <input data-f="back" data-i="${i}" placeholder="Back (answer)" maxlength="200" value="${esc(c.back)}" />

    const vQuizzes = () => `

      ${quizzes.length ? quizzes.map(d => `
        <div class="card row">
          <div>
            <b>${esc(d.title)}</b>
            <div class="sub">${d.questions.length} questions · ${d.isPublic ? "Public" : "Private"}</div>
          </div>
          <div>
            <button data-act="qtake" data-id="${d.id}">Take</button>

        </div>
