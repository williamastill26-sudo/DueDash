<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DueDash</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <style>
    :root{
      --bg:#f5f1ea;
      --bg-2:#efe9df;
      --card:rgba(255,255,255,.76);
      --card-strong:#f8f6f2;
      --line:#e2dbce;
      --text:#243127;
      --muted:#697466;
      --green:#5d7d61;
      --green-2:#42634a;
      --green-soft:#eaf1e9;
      --amber:#c59a52;
      --amber-soft:#f8f0df;
      --red:#b7604b;
      --red-soft:#f6e4e1;
      --shadow:0 18px 48px rgba(30,34,28,.08);
      --header:ui-serif,Georgia,"Times New Roman",serif;
      --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    *{box-sizing:border-box}
    html{color-scheme:light}
    body{
      margin:0;
      min-height:100vh;
      font-family:var(--body);
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(122,147,122,.18), transparent 62%),
        radial-gradient(900px 500px at 100% 0%, rgba(186,156,117,.12), transparent 60%),
        linear-gradient(180deg,var(--bg) 0%, var(--bg-2) 100%);
      line-height:1.5;
    }

    h1,h2,h3,h4{
      margin:0 0 8px;
      font-family:var(--header);
      letter-spacing:-.03em;
      color:var(--text);
      font-weight:600;
    }
    h2{font-size:32px}
    h3{font-size:22px}
    p{margin:0}
    a{color:inherit;text-decoration:none}

    button,input,select{
      font:inherit;
      color:var(--text);
    }

    button{
      border:1px solid transparent;
      background:linear-gradient(135deg,var(--green),var(--green-2));
      color:#fff;
      border-radius:12px;
      padding:10px 15px;
      font-weight:600;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow:0 8px 18px rgba(71,95,79,.18);
    }
    button:hover{transform:translateY(-1px);filter:brightness(1.02)}
    button:active{transform:translateY(0)}
    button.alt{
      background:#fff;
      border-color:var(--line);
      color:var(--text);
      box-shadow:none;
    }
    button.alt:hover{background:#f4f0ea}
    button.red{
      background:linear-gradient(135deg,var(--red),#9d4d42);
      box-shadow:0 8px 18px rgba(150,90,83,.18);
    }
    button.green{
      background:linear-gradient(135deg,#6d8f6d,#4e6b52);
      box-shadow:0 8px 18px rgba(69,104,83,.18);
    }
    button.link{
      background:none;
      border:none;
      box-shadow:none;
      color:var(--green-2);
      text-decoration:underline;
      text-underline-offset:3px;
      padding-left:0;
      padding-right:0;
    }
    button.link:hover{background:none;transform:none}
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    input,select{
      width:100%;
      background:rgba(255,255,255,.8);
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px 12px;
      outline:none;
      transition:border-color .12s ease, box-shadow .12s ease;
    }
    input::placeholder{color:#8b9489}
    input:focus,select:focus{
      border-color:var(--green);
      box-shadow:0 0 0 4px rgba(93,125,97,.12);
    }
    input[type=radio], input[type=checkbox]{
      width:auto;
      accent-color:var(--green);
    }

    .hidden{display:none!important}
    .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .btns button.on,button.alt.on{background:var(--green-soft);border-color:var(--green);color:var(--green-2)}
    .sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
    .sw.on{box-shadow:0 0 0 3px var(--green)}
    .prev{width:160px;flex:none}
    .prev svg{width:100%;height:auto}
    .card.me{border-color:var(--green);background:var(--green-soft)}
    .sub{font-size:13px;color:var(--muted)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .two{display:flex;gap:14px;flex-wrap:wrap}
    .two > *{flex:1;min-width:260px}
    .pair{display:flex;gap:8px;align-items:flex-start}
    .pair input{flex:1}
    .tick{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text);margin-bottom:10px;white-space:nowrap}
    .opt.right input{border-color:#6fa06d;box-shadow:0 0 0 3px rgba(109,143,109,.12)}
    .opt.right .tick{color:var(--green-2);font-weight:700}
    .choice{
      display:block;width:100%;
      text-align:left;
      margin-bottom:8px;
      background:#fff;
      border-color:var(--line);
      color:var(--text);
      box-shadow:none;
    }
    .choice.green{background:#eaf4eb;border-color:rgba(93,125,97,.4)}
    .choice.red{background:#f6e4e1;border-color:rgba(182,96,75,.3)}
    .choice.alt{background:#fff}

    #auth{
      width:min(100% - 32px,420px);
      margin:10vh auto;
      padding:30px 24px 24px;
      background:rgba(255,255,255,.75);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .brand-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      width:100%;
      margin:0 auto 18px;
    }

    .brand-svg{
      width:min(100%, 760px);
      height:auto;
      display:block;
      filter:drop-shadow(0 14px 20px rgba(32,48,38,.06));
    }

    #auth h2{text-align:center}
    .err{
      min-height:18px;
      margin:8px 0 12px;
      color:var(--red);
      font-size:13px;
    }

    #shell{
      display:flex;
      min-height:100vh;
    }
    nav{
      width:240px;
      background:rgba(255,255,255,.66);
      border-right:1px solid var(--line);
      padding:18px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      backdrop-filter:blur(12px);
    }

    nav .brand-svg{
      width:100%;
      max-width:180px;
      margin:0 auto 12px;
    }

    nav button{
      background:none;
      box-shadow:none;
      color:var(--text);
      border-radius:10px;
      text-align:left;
      padding:10px 12px;
      font-weight:500;
      display:flex;
      align-items:center;
      gap:10px;
    }
    nav button:hover{background:#f3efe9}
    nav button.on{
      background:linear-gradient(135deg,var(--green),var(--green-2));
      color:#fff;
      box-shadow:0 8px 22px rgba(65,98,75,.16);
    }
    .badge{
      margin-left:auto;
      background:var(--red);
      color:#fff;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      padding:1px 7px;
      min-width:20px;
      text-align:center;
      line-height:1.8;
    }
    .chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:auto;
      padding-top:10px;
      border-top:1px solid var(--line);
    }
    .chip{
      background:#f3efe9;
      border:1px solid var(--line);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:600;
    }

    main{
      flex:1;
      min-width:0;
      max-width:1100px;
      padding:28px clamp(16px,4vw,42px);
    }

    .anim > *{animation:fade .24s ease both}
    @keyframes fade{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      margin-bottom:10px;
      box-shadow:0 2px 10px rgba(35,39,31,.02);
    }
    .card.row:hover{border-color:rgba(93,125,97,.36)}
    .stat{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px 14px;
      text-align:center;
    }
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:12px;
      margin:16px 0;
    }
    .stat b{
      display:block;
      font-size:28px;
      margin-bottom:3px;
      font-weight:700;
      letter-spacing:-.04em;
    }
    .stat span{
      font-size:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .pfp{
      width:72px;height:72px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:38px;background:rgba(93,125,97,.12);
      border:2px solid rgba(93,125,97,.8);
      flex:none;
    }
    .pfp.sm{
      width:42px;height:42px;
      font-size:22px;
      border-width:1px;
    }

    .big{
      min-height:220px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:28px;
      border-radius:18px;
      background:linear-gradient(145deg,#f6efe7,#f0f3ed);
      border:1px solid var(--line);
      gap:8px;
      cursor:pointer;
    }

    .empty{
      background:rgba(255,255,255,.46);
      border:1px dashed var(--line);
      border-radius:14px;
      text-align:center;
      padding:28px 18px;
      color:var(--muted);
    }

    .done .nm{text-decoration:line-through;opacity:.7}
    .overdue{color:var(--red)}

    .bar{
      width:100%;
      height:9px;
      border-radius:999px;
      background:#ece7df;
      overflow:hidden;
      margin:8px 0 6px;
    }
    .bar i{
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--green),#9dbf98);
      border-radius:999px;
    }

    .awards{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:12px;
    }
    .ach{
      background:rgba(255,255,255,.7);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      opacity:.72;
    }
    .ach.got{
      opacity:1;
      border-color:#d7c080;
      background:linear-gradient(180deg,#faf5eb,#f5efe6);
    }
    .ach .ic{font-size:30px;margin-bottom:8px}
    .ach.got .bar i{background:linear-gradient(90deg,#d9b25e,#b8892a)}

    .scene{
      position:relative;
      min-height:440px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid var(--line);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:18px;
      padding:120px 16px 16px;
      flex-wrap:wrap;
      background:#dfe6d8;
      margin-bottom:12px;
    }
    .deco{
      position:absolute;
      top:12px;
      font-size:44px;
      opacity:.55;
      pointer-events:none;
    }
    .who{
      position:relative;
      text-align:center;
      width:120px;
    }
    .who svg{
      width:110px;height:auto;display:block;margin:0 auto;
      filter:drop-shadow(0 12px 18px rgba(0,0,0,.08));
    }
    .who .wn{
      display:inline-block;
      margin-top:7px;
      padding:2px 9px;
      border-radius:999px;
      background:rgba(26,31,26,.55);
      color:#fff;
      font-size:12px;
      font-weight:700;
    }
    .who .st{
      margin-top:4px;
      font-size:12px;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    .who .wp{
      position:absolute;
      right:0;bottom:48px;
      font-size:26px;
    }
    .bub{
      position:absolute;
      bottom:100%;
      left:50%;
      transform:translateX(-50%);
      margin-bottom:6px;
      background:#fff;
      color:#243127;
      border-radius:12px;
      padding:6px 10px;
      font-size:12.5px;
      font-weight:600;
      max-width:170px;
      width:max-content;
      text-align:center;
      box-shadow:0 10px 24px rgba(0,0,0,.12);
    }

    #chatlog{
      height:200px;
      overflow-y:auto;
      background:rgba(0,0,0,.03);
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 12px;
    }
    .msg{
      margin:4px 0;
      font-size:14px;
      overflow-wrap:anywhere;
    }
    .msg b{color:var(--green-2)}
    .msg.me b{color:#5b8f5b}

    .chatrow{
      display:flex;
      gap:8px;
      margin-top:10px;
    }
    .chatrow input{margin:0}
    .chatrow button{
      white-space:nowrap;
      min-width:82px;
    }

    .lane{display:flex;align-items:center;gap:8px;margin:8px 0}
    .ln{
      width:120px;
      font-size:13px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .track{
      position:relative;
      flex:1;
      height:30px;
      background:rgba(122,147,122,.08);
      border:1px solid var(--line);
      border-radius:999px;
      overflow:hidden;
    }
    .track i{
      position:absolute;left:0;top:0;bottom:0;
      background:linear-gradient(90deg,rgba(93,125,97,.32),rgba(179,202,177,.48));
      transition:width .35s ease;
    }
    .rider{
      position:absolute;
      top:50%;
      transform:translate(-50%,-50%);
      font-size:20px;
      transition:left .35s ease;
    }
    .flag{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      font-size:15px;
    }
    .sc{
      width:52px;text-align:right;font-size:13px;font-weight:600;
    }
    .cd{
      font-weight:800;
      font-size:54px;
      text-align:center;
      padding:14px;
      letter-spacing:-.06em;
      color:var(--green-2);
    }

    .cal{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:8px;
      margin-top:16px;
    }
    .cal-w{
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      padding:5px 0 8px;
    }
    .cal-d{
      background:rgba(255,255,255,.72);
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px;
      min-height:125px;
      font-size:12px;
    }
    .cal-d.today{
      border-color:var(--green);
      background:rgba(234,241,233,.9);
    }
    .cal-h{
      display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin-bottom:6px;
    }
    .cal-h span{
      font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
    }
    .cal-h b{font-size:13px}
    .cal-s{
      background:rgba(93,125,97,.12);
      border-radius:7px;
      padding:6px 6px;
      margin-top:5px;
    }
    .cal-s.done{opacity:.6}
    .cal-s.done .nm{text-decoration:line-through}
    .cal-t{font-size:10.5px;color:var(--muted)}
    .cal-s button{
      margin-top:5px;
      width:100%;
      padding:5px 8px;
      font-size:11px;
      border-radius:7px;
    }
    .cal-x{
      background:rgba(197,154,82,.12);
      border:1px solid rgba(197,154,82,.65);
      border-radius:7px;
      padding:5px 6px;
      margin-top:4px;
      font-weight:600;
    }
    .cal-r{
      color:var(--muted);font-size:11px;margin-top:8px;
    }

    #music{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:50;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
    }
    #mbtn{
      width:52px;height:52px;
      border-radius:50%;
      padding:0;
      font-size:22px;
      box-shadow:var(--shadow);
    }
    #mbtn.playing{
      animation:pulse 2s infinite;
    }
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(93,125,97,.38)}
      50%{box-shadow:0 0 0 12px rgba(93,125,97,0)}
    }
    #mpanel{
      width:250px;
      background:rgba(255,255,255,.95);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow:var(--shadow);
    }
    #mpanel button{
      width:100%;
      text-align:left;
      margin-bottom:6px;
    }
    #mpanel input[type=range]{padding:0;margin:8px 0 0}

    #toast{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translate(-50%,20px);
      background:linear-gradient(135deg,#d6ad6f,#c89a4b);
      color:#fff;
      box-shadow:0 12px 26px rgba(40,35,27,.14);
      border-radius:12px;
      padding:12px 18px;
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease, transform .22s ease;
      z-index:60;
      font-weight:700;
      max-width:90vw;
      text-align:center;
    }
    #toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media (max-width:760px){
      #shell{flex-direction:column}
      nav{
        position:static;
        width:100%;
        height:auto;
        border-right:none;
        border-bottom:1px solid var(--line);
        padding:12px;
        flex-direction:row;
        flex-wrap:wrap;
        align-items:center;
      }
      nav .brand-svg{max-width:110px; margin:0 8px 0 0}
      nav button{padding:8px 10px;font-size:13px}
      .chips{margin:8px 0 0;width:100%;padding-top:0;border-top:none}
      .cal{grid-template-columns:1fr}
      .cal-w,.cal-e{display:none}
      .cal-d{min-height:0}
    }
  </style>
</head>
<body>
  <div id="auth" class="hidden">
    <div class="brand-wrap">
      <svg class="brand-svg" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" aria-label="DueDash logo">
        <defs>
          <linearGradient id="dgrad" x1="0" x2="1">
            <stop offset="0%" stop-color="#4e6a57"/>
            <stop offset="100%" stop-color="#2d4738"/>
          </linearGradient>
        </defs>
        <rect x="20" y="20" width="780" height="480" rx="90" fill="#eee7da" stroke="#2d4738" stroke-width="18"/>
        <g transform="translate(90 90)">
          <g fill="url(#dgrad)">
            <path d="M240 26C160 26 95 88 95 180V218C95 310 160 372 240 372H302C357 372 395 337 395 285C395 258 382 236 360 223L299 181L360 142C382 129 395 107 395 80C395 28 357 26 302 26H240Z" opacity="0.96"/>
          </g>
          <g fill="#dfe7db">
            <rect x="92" y="164" width="260" height="46" rx="18" transform="rotate(-20 92 164)" opacity="0.9"/>
            <rect x="110" y="210" width="280" height="46" rx="18" transform="rotate(-20 110 210)" opacity="0.8"/>
            <rect x="130" y="256" width="300" height="46" rx="18" transform="rotate(-20 130 256)" opacity="0.72"/>
            <rect x="150" y="302" width="320" height="46" rx="18" transform="rotate(-20 150 302)" opacity="0.68"/>
          </g>
          <g fill="#dfe7db" stroke="#dfe7db" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <path d="M350 110 L430 190 L510 110" opacity="0.9"/>
          </g>
          <g fill="none" stroke="#dfe7db" stroke-width="18" stroke-linecap="round">
            <path d="M360 100 L425 165"/>
            <path d="M425 165 L490 100"/>
          </g>
        </g>
        <text x="410" y="420" text-anchor="middle" font-size="146" font-weight="800" font-family="Segoe UI, Arial, sans-serif" fill="#2a4738" letter-spacing="-7">DueDash</text>
      </svg>
    </div>
    <h2 id="at">Log in</h2>
    <input id="em" type="email" placeholder="Email" autocomplete="email" />
    <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" />
    <div class="err" id="er"></div>
    <button id="ab" style="width:100%">Log in</button>
    <button id="sw" class="link" style="width:100%;margin-top:8px">New here? Create an account</button>
  </div>

  <div id="shell" class="hidden">
    <nav id="nav"></nav>
    <main id="main"></main>
    <div id="music">
      <div id="mpanel" class="hidden"></div>
      <button id="mbtn" data-act="mtoggle">🎵</button>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      addDoc,
      deleteDoc,
      collection,
      query,
      where,
      getDocs,
      limit,
      orderBy,
      onSnapshot,
      writeBatch

      g.connect(out);
      lfo.start();
      mus.stops.push(() => { n.stop(); lfo.stop(); });
    };

    const addBirdsong = (ctx, out) => {
      const playChirp = () => {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(1700 + Math.random() * 900, t);
        osc.frequency.exponentialRampToValueAtTime(1100 + Math.random() * 500, t + 0.16);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.035, t + 0.025);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

        osc.connect(g);
        g.connect(out);
        osc.start(t);
        osc.stop(t + 0.2);
      };

      playChirp();
      const id = setInterval(() => {
        if (Math.random() > 0.35) playChirp();
        if (Math.random() > 0.75) setTimeout(playChirp, 180);
      }, 850);

      mus.stops.push(() => clearInterval(id));
    };

    const addForest = (ctx, out) => {
      const n = noiseSrc(ctx, true);
      const hp = ctx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 400;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 1200;
      const g = ctx.createGain();
      g.gain.value = 0.11;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.18;
      const lg = ctx.createGain();
      lg.gain.value = 0.07;
      lfo.connect(lg);
      lg.connect(g.gain);

      n.connect(hp);
      hp.connect(lp);
      lp.connect(g);
      g.connect(out);

      lfo.start();
      mus.stops.push(() => { n.stop(); lfo.stop(); });
    };

    const addThunder = (ctx, out) => {
      const base = ctx.createOscillator();
      base.type = "sawtooth";
      base.frequency.value = 90;
      const g = ctx.createGain();
      g.gain.value = 0.015;
      base.connect(g);
      g.connect(out);
      base.start();

      const burst = () => {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(110, t);
        osc.frequency.exponentialRampToValueAtTime(32, t + 0.45);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.08, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);

        osc.connect(gain);
        gain.connect(out);
        osc.start(t);
        osc.stop(t + 0.45);
      };

      const id = setInterval(() => {
        if (Math.random() > 0.45) burst();
      }, 2400);

      mus.stops.push(() => { clearInterval(id); base.stop(); });
    };

    const addFan = (ctx, out) => {
      const n = noiseSrc(ctx, true);
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 650;
      const g = ctx.createGain();
      g.gain.value = 0.12;
      n.connect(lp);
      lp.connect(g);
      g.connect(out);
      mus.stops.push(() => n.stop());
    };

    const addCrickets = (ctx, out) => {
      const chirp = () => {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(4200, t);
        osc.frequency.exponentialRampToValueAtTime(3000, t + 0.09);

        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.025, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);

        osc.connect(g);
        g.connect(out);
        osc.start(t);
        osc.stop(t + 0.11);
      };

      chirp();
      const id = setInterval(() => {
        if (Math.random() > 0.35) chirp();
        if (Math.random() > 0.65) setTimeout(chirp, 120);
      }, 700);

      mus.stops.push(() => clearInterval(id));
    };

    const addCafe = (ctx, out) => {
      const n = noiseSrc(ctx, false);
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 500;
      const g = ctx.createGain();
      g.gain.value = 0.045;
      n.connect(lp);
      lp.connect(g);
      g.connect(out);

      const clink = () => {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const bell = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = 900 + Math.random() * 900;
        bell.gain.setValueAtTime(0.0001, t);
        bell.gain.exponentialRampToValueAtTime(0.012, t + 0.01);
        bell.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

        osc.connect(bell);
        bell.connect(out);
        osc.start(t);
        osc.stop(t + 0.2);
      };

      const id = setInterval(() => {
        if (Math.random() > 0.55) clink();
      }, 1200);

      mus.stops.push(() => {
        clearInterval(id);
        n.stop();

    };

      if (k === "pad") addPad(ctx, out, CH1, 6);

      if (!ex.length) return [];
      const last = ex.reduce((m, e) => e.date > m ? e.date : m, "");
      const out = [], used = {};
      ex.forEach(e => used[e.subject + e.date] = 0);

      for (let o = 0; o <= 120; o++) {
        const d = plus(o);
        if (d > last) break;
        const active = ex.filter(e => e.date > d);
        const slots = [];
        if (active.length) {
          for (let s = 0; s < (P.revPer || 2); s++) {
            let best = null, bs = -1;
            active.forEach(e => {
              const left = Math.max(1, Math.round((new Date(e.date + "T00:00:00") - new Date(d + "T00:00:00")) / 864e5));
              const sc = (1 / left) / (used[e.subject + e.date] + 1);
              if (sc > bs) { bs = sc; best = e; }
            });
            if (!best) break;
            used[best.subject + best.date]++;
            slots.push(best.subject);
          }
        }

        out.push({ d, slots, exams: ex.filter(e => e.date === d) });
      }

    const raceResults = () => {
      const t = rsq.trim().toLowerCase();
      const mine = quizzes.filter(d => playable(d).length >= 2 && String(d.title).toLowerCase().includes(t));
      const others = pubQ.filter(d => d.ownerId !== user.uid && playable(d).length >= 2 && String(d.title).toLowerCase().includes(t));
      const row = (d, by) => `
        <div class="card row">
          <div>
            <b>${esc(d.title)}</b>
            <div class="sub">${by ? "Public · by " + esc(d.ownerName || "someone") : "Your quiz"} · ${playable(d).length} questions</div>
          </div>
          <button data-act="rpost" data-id="${esc(d.id)}">🏁 Post race</button>
        </div>
      `;
      const all = [...mine.map(d => row(d, false)), ...others.map(d => row(d, true))];
      if (!all.length) return `<div class="empty">${t ? "No quizzes match your search." : "No public quizzes yet."}</div>`;
      return all.slice(0, 20).join("") + (all.length > 20 ? '<div class="sub">Showing the first 20. Type to narrow it down.</div>' : "");
    };

    const postForm = () => {
      const any = quizzes.some(d => playable(d).length >= 2) || pubQ.some(d => d.ownerId !== user.uid && playable(d).length >= 2);
      if (!any) return '<div class="sub">No quizzes are available yet. Make one in My Quizzes or share a public one in Explore. A race needs at least 2 multiple-choice or true/false questions.</div>';
      return `
        <div class="sub" style="margin:6px 0 10px">Search for one of your own quizzes or a public quiz. Questions are shuffled and only correct answers move you forward.</div>
        <input id="rsq" placeholder="🔍 Search quizzes by name..." value="${esc(rsq)}" autocomplete="off" />
        <div id="rres">${raceResults()}</div>
      `;
    };

    const lanes = () => {
      const total = race.questions.length;
      return [...racePlayers].sort((a, b) => (b.correct || 0) - (a.correct || 0) || (b.answered || 0) - (a.answered || 0)).map(p => {
        const pct = Math.round(((p.correct || 0) / total) * 100);
        const left = Math.min(94, Math.max(4, pct));
        return `
          <div class="lane">
            <div class="ln">${esc(p.emoji || "😀")} ${esc(p.username || "Student")}${p.id === user.uid ? " (you)" : ""}</div>
            <div class="track">
              <i style="width:${pct}%"></i>
              <span class="flag">🏁</span>
              <span class="rider" style="left:${left}%">${esc(p.emoji || "😀")}</span>
            </div>
            <div class="sc">${p.correct || 0} ✅</div>
          </div>
        `;
      }).join("");
    };

    const questionUI = (total) => {
      const x = race.questions[myRace.i];
      const rev = myRace.sel !== null;
      const items = x.type === "tf"
        ? [["True", 1], ["False", 0]]
        : x.opts.map((o, k) => [`ABCD`[k] + ". " + o, k]);
      const ci = x.type === "tf" ? (tfAnswer(x.ans) ? 1 : 0) : x.ans;

      return `
        <p class="sub">Question ${myRace.i + 1} of ${total} · score ${myRace.correct}</p>
        <div class="card"><b>${esc(x.q)}</b></div>
        ${items.map(([label, index]) => `
          <button class="choice ${rev ? (index === ci ? "green" : index === myRace.sel ? "red" : "alt") : "alt"}"
            data-act="rpick" data-i="${index}" ${rev ? "disabled" : ""}>
            ${esc(label)}
          </button>
        `).join("")}
      `;
    };

    const raceHTML = () => {
      if (!race) return postForm();

      const total = race.questions.length;
      const mine = racePlayers.find(p => p.id === user.uid);
      const host = race.hostId === user.uid;
      const hostP = racePlayers.find(p => p.id === race.hostId);
      const head = `
        <div class="row">
          <div><b>🏁 ${esc(race.title)}</b></div>
          <span class="sub">${total} questions${hostP ? " · posted by " + esc(hostP.username) : ""}</span>
        </div>
      `;

      if (raceOver()) {
        const st = standings();
        const w = st[0];
        const medal = i => ["🥇","🥈","🥉"][i] || "#" + (i + 1);

        return head + (w ? `<div class="card" style="margin:10px 0;text-align:center"><div style="font-size:34px">🏆</div><b>${esc(w.emoji || "")} ${esc(w.username)} wins with ${w.correct || 0} / ${total}!</b></div>` : "") +
          st.map((p, i) => `
            <div class="card row ${p.id === user.uid ? "me" : ""}">
              <b>${medal(i)} ${esc(p.emoji || "😀")} ${esc(p.username)}${p.id === user.uid ? " (you)" : ""}</b>
              <span>${p.correct || 0} / ${total} correct</span>
            </div>
          `).join("") +
          `<h3>Race again?</h3>${postForm()}`;
      }

      if (race.status === "open") {
        const chips = racePlayers.map(p => `<span class="chip">${esc(p.emoji || "😀")} ${esc(p.username)}</span>`).join(" ");
        return head + `
          <div class="sub" style="margin:8px 0">Waiting for players to join…</div>
          <div class="btns">${chips || '<span class="sub">No one yet</span>'}</div>
          <div class="btns" style="margin-top:10px">
            ${mine ? "<span class='sub'>✅ You're in!</span>" : `<button data-act="rjoinrace">Join race</button>`}
            ${host ? ` <button class="green" data-act="rstart">▶ Start race (${racePlayers.length} player${racePlayers.length === 1 ? "" : "s"})</button> <button class="alt" data-act="rend">Cancel</button>` : ""}
          </div>
        `;
      }

      const left = race.startAt - Date.now();
      let mid = "";
      if (left > 0) {
        mid = `<div class="cd">${Math.max(1, Math.ceil(left / 1000))}</div><div class="sub" style="text-align:center">Get ready…</div>`;
      } else if (mine && myRace && myRace.i < total) {
        mid = questionUI(total);
      } else if (mine) {
        mid = `<div class="card" style="text-align:center">🏁 You finished with <b>${myRace ? myRace.correct : (mine.correct || 0)} / ${total}</b>. Waiting for the others…</div>`;
      } else {
        mid = `<div class="sub">The race has started. You can watch from here.</div>`;
      }

      return head + mid + `<div style="margin-top:10px">${lanes()}</div>` + (host ? `<button class="alt" data-act="rend" style="margin-top:8px">End race now</button>` : "");
    };

    function watchPlayers() {
      if (psub) { try { psub(); } catch (e) {} psub = null; }
      if (!race || !room) return;
      psub = onSnapshot(collection(db, "rooms", room.code, "races", race.id, "players"), snap => {
        racePlayers = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        const mine = racePlayers.find(p => p.id === user.uid);
        if (mine && myRace && myRace.rid === race.id && myRace.sel === null && myRace.i < (mine.answered || 0)) {
          myRace.i = mine.answered;
          myRace.correct = mine.correct || 0;
        }
        paintRace();
        maybeWin();
      }, err => console.warn("race players", err));
    }

    function raceAnswer(i) {
      if (!race || !myRace || myRace.rid !== race.id || myRace.sel !== null) return;
      if (race.status !== "live" || Date.now() < race.startAt) return;
      const x = race.questions[myRace.i];
      if (!x) return;
      if (!racePlayers.some(p => p.id === user.uid)) return;

      const right = x.type === "tf"
        ? i === (tfAnswer(x.ans) ? 1 : 0)
        : i === x.ans;
      myRace.sel = i;
      if (right) myRace.correct++;
      pushProgress(myRace.i + 1, myRace.correct).catch(() => {});
      paintRace();

      const rid = race.id;
      setTimeout(() => {
        if (!race || race.id !== rid || !myRace) return;
        myRace.i++;
        myRace.sel = null;
        if (myRace.i >= race.questions.length) finishMyRace();
        paintRace();
      }, 700);
    }

    async function finishMyRace() {
      if (!myRace || myRace.paid || !race || P.lastRaceDone === race.id) return;
      myRace.paid = true;
      const total = race.questions.length;
      const c = myRace.correct;
      const pts = c * 2 + (c === total ? 10 : 0);
      try {
        await earn(pts, { racesPlayed:(P.racesPlayed || 0) + 1, lastRaceDone: race.id });
        toast("🏁 You finished! +" + pts + " points");
      } catch (e) {}
    }

    async function maybeWin() {
      if (winBusy || !raceOver()) return;
      const st = standings();
      if (st.length < 2 || st[0].id !== user.uid || !(st[0].correct > 0) || P.lastWonRace === race.id) return;
      winBusy = true;
      try {
        await earn(15, { racesWon:(P.racesWon || 0) + 1, lastWonRace: race.id });
        toast("🏆 You won the race! +15 points");
      } catch (e) {}
      winBusy = false;
    }

    const finishFocus = async () => {
      rs.status = "studying";
      rs.focusEnd = 0;
      heartbeat();
      try {
        await earn(5, { focusDone:(P.focusDone || 0) + 1 });
        toast("🎯 Focus session complete! +5 points");
      } catch (e) {}
      if (view === "room") render();
    };

    async function enterRoom(code, info) {
      await leaveRoom();
      room = { code, name: info.name };
      members = [];
      chat = [];
      chatSeen = {};
      chatFirst = true;
      race = null;
      racePlayers = [];
      myRace = null;
      firstRace = true;
      rs = { status:"studying", emote:"", emoteAt:0, focusEnd:0 };

      await heartbeat();

      unsub = onSnapshot(collection(db, "rooms", code, "members"), snap => {
        members = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        paintRoom();
      }, err => alert("Room error: " + (err.code || err.message)));

      const since = Date.now() - 30000;
      unsubC = onSnapshot(query(collection(db, "rooms", code, "messages"), where("at", ">=", since), orderBy("at", "desc"), limit(50)), snap => {
        const list = snap.docs.map(d => ({ id:d.id, ...d.data() })).reverse();
        const now = Date.now();
        let fresh = false;
        list.forEach(m => {
          if (!(m.id in chatSeen)) {
            chatSeen[m.id] = chatFirst ? 0 : now;
            if (!chatFirst) fresh = true;
          }
        });
        chatFirst = false;
        chat = list;
        paintRoom();
        paintChat();
        if (fresh) setTimeout(paintRoom, 8300);
      }, err => alert("Chat error: " + (err.code || err.message)));

      rsub = onSnapshot(query(collection(db, "rooms", code, "races"), orderBy("createdAt", "desc"), limit(1)), snap => {
        const d = snap.docs[0];
        let nr = d ? { id:d.id, ...d.data() } : null;
        if (nr && Date.now() - (nr.createdAt || 0) > 7200000) nr = null;
        const changed = (nr ? nr.id : null) !== (race ? race.id : null);
        const was = race ? race.status : "";
        race = nr;
        if (changed) {
          racePlayers = [];
          myRace = nr ? { rid:nr.id, i:0, correct:0, sel:null, paid:false } : null;
          watchPlayers();
          if (!firstRace && nr && nr.hostId !== user.uid && nr.status === "open") toast("🏁 A racing game was posted in your room!");
        } else if (nr && was === "open" && nr.status === "live" && !firstRace) {
          toast("🏁 The race is starting!");
        }
        firstRace = false;
        paintRace();
      }, err => console.warn("races", err));

      hb = setInterval(heartbeat, 30000);
      tickN = 0;
      rt = setInterval(() => {
        if (view !== "room") return;
        if (rs.status === "focus" && Date.now() >= rs.focusEnd) finishFocus();
        const el = $("ftimer");
        if (el && rs.status === "focus") el.textContent = mmss(rs.focusEnd - Date.now());
        if (race && race.status === "live" && Date.now() < race.startAt + 1100) paintRace();
        if (++tickN % 5 === 0) paintRoom();
      }, 1000);

      await save({ roomsJoined:(P.roomsJoined || 0) + 1 });
      try { await loadFriends(); } catch (e) {}
      try { quizzes = (await getDocs(query(collection(db, "quizzes"), where("ownerId", "==", user.uid)))).docs.map(d => ({ id:d.id, ...d.data() })); } catch (e) {}
      try { pubQ = (await getDocs(query(collection(db, "quizzes"), where("isPublic", "==", true), limit(100)))).docs.map(d => ({ id:d.id, ...d.data() })); } catch (e) {}
      view = "room";
      render();
    }

    async function leaveRoom() {
      if (!room) return;
      const code = room.code;
      try { if (unsub) unsub(); } catch (e) {}
      try { if (unsubC) unsubC(); } catch (e) {}
      try { if (rsub) rsub(); } catch (e) {}
      try { if (psub) psub(); } catch (e) {}
      unsub = null; unsubC = null; rsub = null; psub = null;
      clearInterval(hb); clearInterval(rt);
      room = null; members = []; chat = []; chatSeen = {}; race = null; racePlayers = []; myRace = null;
      try { await deleteDoc(doc(db, "rooms", code, "members", user.uid)); } catch (e) {}
    }

    async function go(v) {
      if (v === "room" && !room) v = "rooms";
      view = v;
      try {
        if (v === "planner" || v === "rev") checkReminders();
        if (v === "decks") decks = (await getDocs(query(collection(db, "decks"), where("ownerId", "==", user.uid)))).docs.map(d => ({ id:d.id, ...d.data() }));
        if (v === "quizzes") quizzes = (await getDocs(query(collection(db, "quizzes"), where("ownerId", "==", user.uid)))).docs.map(d => ({ id:d.id, ...d.data() }));
        if (v === "friends") { fsq = ""; fres = null; await loadFriends(); }
        if (v === "explore") {
          q = "";
          pub = (await getDocs(query(collection(db, "decks"), where("isPublic", "==", true), limit(100)))).docs.map(d => ({ id:d.id, ...d.data() }));
          pubQ = (await getDocs(query(collection(db, "quizzes"), where("isPublic", "==", true), limit(100)))).docs.map(d => ({ id:d.id, ...d.data() }));
        }
        if (v === "leaders") {
          board = (await getDocs(query(collection(db, "leaderboard"), orderBy("points", "desc"), limit(20)))).docs.map(d => ({ id:d.id, ...d.data() }));
          streaks = (await getDocs(query(collection(db, "leaderboard"), orderBy("streak", "desc"), limit(20)))).docs.map(d => ({ id:d.id, ...d.data() }));
        }
      } catch (e) { alert("Database error: " + (e.code || e.message)); }
      render();
    }

    const petEmoji = () => lvl(P) < 2 ? "🥚" : (P.pet && P.pet.species) || "🐱";
    const goalBar = () => {
      const gp = Math.min(GOAL, P.goalDay === day() ? (P.goalPts || 0) : 0);
      return `
        <div class="bar"><i style="width:${(gp / GOAL) * 100}%"></i></div>
        <div class="sub">${gp} / ${GOAL} points today${gp >= GOAL ? " ✅ goal done!" : " · hit the goal for +5 bonus"}</div>
      `;
    };

    const paintRoom = () => {
      const el = $("scene");
      if (el && view === "room") el.innerHTML = sceneHTML();
    };

    const sceneHTML = () => {
      const b = bd();
      const now = Date.now();
      const deco = b.d.map((e, k) => `<span class="deco" style="left:${8 + k * 38}%">${e}</span>`).join("");
      const act = members.filter(m => now - (m.lastSeen || 0) < 90000).sort((a, c) => String(a.username || "").localeCompare(String(c.username || "")));
      const lastMsg = uid => {
        for (let i = chat.length - 1; i >= 0; i--) {
          if (chat[i].uid === uid) return chat[i];
        }
        return null;
      };
      const bubble = m => {
        const cm = lastMsg(m.id);
        if (cm && chatSeen[cm.id] && now - chatSeen[cm.id] < 8000) return `<div class="bub">${esc(cm.text)}</div>`;
        if (m.emote && now - (m.emoteAt || 0) < 8000) return `<div class="bub">${esc(m.emote)}</div>`;
        return "";
      };
      return deco + (act.length
        ? act.map(m => `
            <div class="who">
              ${bubble(m)}
              ${avatar(m.avatar)}
              <span class="wp">${esc(m.pet || "")}</span>
              <div class="wn">${esc(m.emoji || "😀")} ${esc(m.username || "Student")}${m.id === user.uid ? " (you)" : ""}</div>
              <div class="st">${ST[m.status] || ST.studying}</div>
            </div>
          `).join("")
        : '<div class="sub" style="color:#fff">Waiting for people to join…</div>');
    };

    const vPlanner = () => {
      const rows = P.tasks.map((t, i) => {
        const od = t.due && !t.done && t.due < day();
        const dueTxt = t.due ? (od ? "⚠️ Overdue · " : "Due: ") + esc(t.due) : "";
        return `
          <div class="card row ${t.done ? "done" : ""}">
            <div>
              <div class="nm">${esc(t.name)}</div>
              <div class="sub ${od ? "overdue" : ""}">${dueTxt}</div>
            </div>
            <div>
              ${t.done ? "" : `<button data-act="done" data-i="${i}">Done +5</button> `}
              <button class="alt" data-act="deltask" data-i="${i}">Delete</button>
            </div>
          </div>
        `;
      }).join("");

      return `
        <h2>Hi, ${esc(P.emoji || "😀")} ${esc(P.username)} 👋</h2>
        <p class="sub">Here's what's on your plate.</p>
        <div class="stats">
          <div class="stat"><b>⭐ ${P.points}</b><span>points</span></div>
          <div class="stat"><b>🔥 ${liveStreak(P)}</b><span>day streak</span></div>
          <div class="stat"><b>✅ ${P.tasksDone}</b><span>tasks done</span></div>
        </div>

        <div class="card row">
          <div style="display:flex;gap:12px;align-items:center">
            <span style="font-size:40px">${petEmoji()}</span>
            <div>
              <b>${esc(P.pet.name)}</b>
              <div class="sub">Level ${lvl(P)}</div>
            </div>
          </div>
          <div style="flex:1;min-width:200px">
            <b>🎯 Daily goal</b>
            ${goalBar()}
          </div>
        </div>

        <div class="card">
          <input id="tk" placeholder="Task, like Math worksheet" maxlength="100" />
          <input id="td" type="date" />
          <button data-act="addtask">+ Add task</button>
          <div class="sub" style="margin-top:8px">🔔 Tasks due tomorrow send a reminder to your notifications.</div>
        </div>

        ${rows || '<div class="empty">No tasks yet. Add your first one above! ✨</div>'}
      `;
    };

    const fmtT = (m) => { let h = Math.floor(m / 60) % 24; const mm = m % 60; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + String(mm).padStart(2, "0") + " " + ap; };
    const slotTime = (k) => {
      const [h, m] = (P.revStart || "16:00").split(":").map(Number);
      const sm = P.studyMin || 45, bm = P.breakMin === undefined ? 15 : P.breakMin;
      const s = h * 60 + m + k * (sm + bm);
      return fmtT(s) + " – " + fmtT(s + sm);
    };
    const SM = [15,20,25,30,45,50,60,75,90,120];
    const BM = [0,5,10,15,20,30];
    const opts = (arr, cur, fmt) => arr.map(n => `<option value="${n}" ${cur === n ? "selected" : ""}>${fmt ? fmt(n) : n}</option>`).join("");

    const vRev = () => {
      const t0 = plus(0);
      const exs = (P.exams || []).map((e, i) => ({ ...e, i })).sort((a, b) => a.date < b.date ? -1 : 1);
      const plan = planDays().slice(0, 28);

      const dt = d => new Date(d + "T00:00:00");
      const cell = (x) => {
        const D = dt(x.d);
        const isToday = x.d === t0;
        const wd = D.toLocaleDateString(undefined, { weekday:"short" });
        const dm = D.toLocaleDateString(undefined, { day:"numeric", month:"short" });
        const ex = x.exams.map(e => `<div class="cal-x">📝 Exam: ${esc(e.subject)}</div>`).join("");
        const sl = x.slots.map((s, k) => {
          const key = x.d + "|" + k + "|" + s;
          const done = P.revDone && P.revDone[key];
          return `
            <div class="cal-s ${done ? "done" : ""}">
              <div class="cal-t">🕒 ${slotTime(k)}</div>
              <div class="nm">📖 ${esc(s)}</div>
              ${done ? "<div>✅ Done</div>" : isToday ? `<button data-act="rdone" data-k="${esc(key)}">Done +10</button>` : ""}
            </div>
          `;
        }).join("");
        const rest = (!x.slots.length && !x.exams.length) ? '<div class="cal-r">Rest day 🌿</div>' : "";
        return `
          <div class="cal-d ${isToday ? "today" : ""}">
            <div class="cal-h"><span>${wd}</span><b>${dm}</b></div>
            ${ex}${sl}${rest}
          </div>
        `;
      };

      let grid = "";
      if (plan.length) {
        const lead = (dt(plan[0].d).getDay() + 6) % 7;
        grid = `
          <h3>Your study calendar</h3>
          <div class="cal">
            ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(n => `<div class="cal-w">${n}</div>`).join("")}
            ${"<div class='cal-e'></div>".repeat(lead)}
            ${plan.map(cell).join("")}
          </div>
        `;
      }

      const sm = P.studyMin || 45, bm = P.breakMin === undefined ? 15 : P.breakMin;
      return `
        <h2>Revision Planner</h2>
        <p class="sub">Add your exams and DueDash builds your study calendar, with more sessions for the exams coming up soonest.</p>

        <div class="card">
          <h3 style="margin-top:0">Your exams</h3>
          ${exs.length ? exs.map(e => `
            <div class="row" style="margin-bottom:8px">
              <span>📝 <b>${esc(e.subject)}</b> · ${esc(e.date)}</span>
              <button class="alt" data-act="xdel" data-i="${e.i}">Remove</button>
            </div>
          `).join("") : '<p class="sub">No exams yet.</p>'}

          <input id="xs" placeholder="Subject, like Maths" maxlength="30" />
          <input id="xd" type="date" min="${t0}" />
          <button data-act="xadd">+ Add exam</button>

          <h3>⏱️ Your study schedule</h3>
          <div class="sub" style="margin-top:6px">Study sessions per day:
            <select id="rp">${opts([1,2,3,4,5,6], P.revPer || 2)}</select>
          </div>
          <div class="sub" style="margin-top:10px">Study length:
            <select id="rsm">${opts(SM, sm, n => n + " min")}</select>
            · Break length:
            <select id="rbm">${opts(BM, bm, n => n === 0 ? "No break" : n + " min")}</select>
          </div>
          <div class="sub" style="margin-top:10px">First session starts at:
            <input id="rstart" type="time" value="${esc(P.revStart || "16:00")}" style="width:auto;margin:0 0 0 6px;padding:7px 10px" />
          </div>
          <div class="sub" style="margin-top:8px">🔔 You get a reminder the day before each exam.</div>
        </div>

    const vProfile = () => {

    const NI = { friend:"👥", invite:"🏠", reminder:"⏰", info:"🔔" };

    const vQEdit = () => `

    const matchRows = (x) => x.pairs.map((p, k) => {

      return `

          <span>
            <select data-mi="${k}" ${qz.chk ? "disabled" : ""}>

    const vQTake = () => {
      const x = qz.questions[qz.i];
      if (!x) {
        const pts = qz.correct * 2 + (qz.correct === qz.questions.length ? 10 : 0);
        return `
          <h2>🎉 Quiz complete!</h2>
          <p>You got ${qz.correct} of ${qz.questions.length} right. +${pts} points!</p>
          <button data-go="${qz.from}">Back</button>
        `;
      }

      const t = x.type || "mc";
      const head = `
        <h2>${esc(qz.title)}</h2>
        <p class="sub">Question ${qz.i + 1} of ${qz.questions.length} · ${t === "tf" ? "True or false" : t === "match" ? "Match" : "Multiple choice"}</p>
        <div class="card"><b>${esc(x.q)}</b></div>
      `;
      let body = "", done = false, correct = false;

      if (t === "tf") {
        done = qz.sel !== null;
        correct = qz.sel === x.ans;
        body = [[true, "True"], [false, "False"]].map(([v, l]) =>
          `<button class="choice ${done ? (v === x.ans ? "green" : v === qz.sel ? "red" : "alt") : "alt"}" data-act="pickTF" data-i="${v ? 1 : 0}" ${done ? "disabled" : ""}>${l}</button>`
        ).join("");
      } else if (t === "match") {
        done = qz.chk;
        correct = done && x.pairs.every((p, k) => qz.m[k] === p.r);
        body = matchRows(x) + (done ? "" : `<button data-act="mcheck">Check answers</button>`);
      } else {
        done = qz.sel !== null;
        correct = qz.sel === x.ans;
        body = qz.order.map((oi, pos) =>
          `<button class="choice ${done ? (oi === x.ans ? "green" : oi === qz.sel ? "red" : "alt") : "alt"}" data-act="pick" data-i="${oi}" ${done ? "disabled" : ""}>${"ABCD"[pos]}. ${esc(x.opts[oi])}</button>`
        ).join("");
      }

      const msg = done ? `<p>${correct ? "✅ Correct!" : "❌ Not quite."}</p>` : "";
      const next = done ? `<button data-act="qnext">${qz.i + 1 >= qz.questions.length ? "Finish" : "Next"}</button>` : "";

      return head + body + msg + next;
    };

    const exploreList = () => {
      const s = q.trim().toLowerCase();
      const dl = pub.filter(d => d.title.toLowerCase().includes(s));
      const ql = pubQ.filter(d => d.title.toLowerCase().includes(s));

      return `
        <h3>📚 Flashcard decks</h3>

          <div class="card row">

              <b>${esc(d.title)}</b>
              <div class="sub">by ${esc(d.ownerName)} · ${d.cards.length} cards</div>

              <button data-act="study" data-id="${d.id}">Study</button>

        <h3>📝 Quizzes</h3>
        ${ql.length ? ql.map(d => `
          <div class="card row">

              <b>${esc(d.title)}</b>

              <button class="alt" data-act="qcopy" data-id="${d.id}">Save copy</button>
              <button class="alt" data-act="qreport" data-id="${d.id}">Report</button>
            </div>
          </div>
        `).join("") : `<div class="empty">${s ? "No quizzes match your search." : "No public quizzes yet. Be the first to share one!"}</div>`}

    const vExplore = () => `
      <h2>Explore</h2>
      <p class="sub">Decks and quizzes other people made public.</p>
      <br />
      <input id="sq" placeholder="🔍 Search by set name..." value="${esc(q)}" />
      <div id="results">${exploreList()}</div>
    `;

    const vLeaders = () => {
      const sl = streaks.filter(p => p.streak > 0);
      const medal = i => ["🥇","🥈","🥉"][i] || "#" + (i + 1);
      const rowHtml = (p, i, val) => `
        <div class="card row ${p.id === user.uid ? "me" : ""}">
          <div><b>${medal(i)} ${esc(p.username)}</b>${p.id === user.uid ? " (you)" : ""}</div>
          <div><b>${val}</b></div>
        </div>
      `;
      return `
        <h2>Leaderboards</h2>
        <p class="sub">Top 20 players.</p>
        <div class="two">
          <div>
            <h3>⭐ Points</h3>
            ${board.length ? board.map((p, i) => rowHtml(p, i, "⭐ " + p.points)).join("") : '<div class="empty">No one on the board yet.</div>'}
          </div>
          <div>
            <h3>🔥 Streaks</h3>
            ${sl.length ? sl.map((p, i) => rowHtml(p, i, "🔥 " + p.streak + " day" + (p.streak === 1 ? "" : "s"))).join("") : '<div class="empty">No streaks yet. Earn points to start yours!</div>'}
          </div>
        </div>
      `;
    };

    const vAccount = () => {
      const got = AWARDS.filter(a => a.val(P) >= a.goal).length;
      return `
        <h2>Account</h2>

        <div class="card">
          <div style="display:flex;gap:16px;align-items:center">
            <div class="pfp">${esc(P.emoji || "😀")}</div>
            <div>
              <b>Profile picture</b>
              <div class="sub">Pick an emoji. Friends and study rooms will see it.</div>
            </div>
          </div>
          <div class="btns" style="margin-top:12px">
            ${EMOJIS.map((e, i) => `<button class="alt ${((P.emoji || "😀") === e) ? "on" : ""}" style="font-size:22px" data-act="emoji" data-i="${i}">${e}</button>`).join("")}
          </div>
        </div>

        <div class="card">
          <div class="sub">Username. 3 to 20 letters, numbers or underscores. Only one person can have each username, so friends can find you. Don't use your real name.</div>
          <input id="un" maxlength="20" value="${esc(P.username)}" />
          <button data-act="name">Save username</button>
        </div>

        <div class="stats">
          <div class="stat"><b>⭐ ${P.points}</b><span>points</span></div>
          <div class="stat"><b>🔥 ${liveStreak(P)}</b><span>day streak</span></div>
          <div class="stat"><b>🏁 ${bestStreak(P)}</b><span>best streak</span></div>
          <div class="stat"><b>${petEmoji()} ${lvl(P)}</b><span>pet level</span></div>
          <div class="stat"><b>📚 ${P.cardsStudied}</b><span>cards studied</span></div>
          <div class="stat"><b>✅ ${P.tasksDone}</b><span>tasks done</span></div>
          <div class="stat"><b>📝 ${P.quizzesTaken}</b><span>quizzes finished</span></div>
        </div>

        <h3>🏆 Achievements · ${got} / ${AWARDS.length} unlocked</h3>
        <div class="awards">${achTiles(P)}</div>
      `;
    };

    const NAV = [
      ["planner","📅","Planner"],
      ["rev","🗓️","Revision"],
      ["decks","📚","My Decks"],
      ["quizzes","📝","My Quizzes"],
      ["explore","🔍","Explore"],
      ["rooms","🏠","Study Rooms"],
      ["friends","👥","Friends"],
      ["notifs","🔔","Notifications"],
      ["pet","🐾","My Pet"],
      ["leaders","🏆","Leaderboard"],
      ["account","👤","Account"]
    ];

    function renderNav() {
      if (!P) return;
      const f = (view === "study" && study) ? study.from : (view === "qtake" && qz) ? qz.from : "";
      const on = (k) => (
        view === k ||
        (k === "decks" && (view === "edit" || f === "decks")) ||
        (k === "quizzes" && (view === "qedit" || f === "quizzes")) ||
        (k === "explore" && f === "explore") ||
        (k === "rooms" && view === "room") ||
        (k === "friends" && view === "profile")
      ) ? "on" : "";
      $("nav").innerHTML = `

        <div class="brand-wrap" style="margin-bottom:8px; width:100%">
          <svg class="brand-svg" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" aria-label="DueDash logo">
            <defs>
              <linearGradient id="navdgrad" x1="0" x2="1">
                <stop offset="0%" stop-color="#4e6a57"/>
                <stop offset="100%" stop-color="#2d4738"/>
