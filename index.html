    const qBody = (x, qi) => {
      if (x.type === "tf") return `
        <label class="tick"><input type="radio" name="tf${qi}" data-qf="tf" data-qi="${qi}" data-v="1" ${x.ans ? "checked" : ""} /> True</label>
        <label class="tick"><input type="radio" name="tf${qi}" data-qf="tf" data-qi="${qi}" data-v="0" ${x.ans ? "" : "checked"} /> False</label>
        <div class="sub">Pick whether the statement above is true or false.</div>
      `;

      if (x.type === "match") return `
        ${x.pairs.map((p, pi) => `
          <div class="pair">
            <input data-qf="l" data-qi="${qi}" data-pi="${pi}" placeholder="Item ${pi + 1}" maxlength="80" value="${esc(p.l)}" />
            <input data-qf="r" data-qi="${qi}" data-pi="${pi}" placeholder="Its match" maxlength="80" value="${esc(p.r)}" />
          </div>
        `).join("")}
        <div class="sub">Fill in all 4 pairs. They get shuffled when someone takes the quiz.</div>
      `;

      return `
        ${x.opts.map((o, oi) => `
          <div class="opt ${x.ans === oi ? "right" : ""}">
            <label class="tick">
              <input type="radio" name="ans${qi}" data-qf="ans" data-qi="${qi}" data-oi="${oi}" ${x.ans === oi ? "checked" : ""} />
              ${x.ans === oi ? "✓ Correct" : "Mark correct"}
            </label>
            <input data-qf="opt" data-qi="${qi}" data-oi="${oi}" placeholder="Answer ${"ABCD"[oi]}" maxlength="120" value="${esc(o)}" />
          </div>
        `).join("")}
        <div class="sub">Click “Mark correct” next to the right answer. The answers get shuffled when someone takes the quiz.</div>
      `;
    };

    const vQEdit = () => `
      <h2>${qdraft.id ? "Edit" : "New"} quiz</h2>
      <input id="qt" placeholder="Quiz title" maxlength="60" value="${esc(qdraft.title)}" />
      ${qdraft.questions.map((x, qi) => `
        <div class="card">
          <div class="row" style="margin-bottom:10px">
            <b>Question ${qi + 1}</b>
            <select data-qf="type" data-qi="${qi}">
              <option value="mc" ${x.type === "mc" ? "selected" : ""}>Multiple choice</option>
              <option value="tf" ${x.type === "tf" ? "selected" : ""}>True / False</option>
              <option value="match" ${x.type === "match" ? "selected" : ""}>Match</option>
            </select>
          </div>
          <input data-qf="q" data-qi="${qi}" placeholder="${x.type === "match" ? "Instructions (like: Match each country to its capital)" : x.type === "tf" ? "Statement (like: The sun is a star)" : "Question"}" maxlength="200" value="${esc(x.q)}" />
          ${imgPick("q", qi, x.img)}
          ${qBody(x, qi)}
          ${qdraft.questions.length > 1 ? `<br /><button class="alt" data-act="qdelq" data-i="${qi}">Remove question</button>` : ""}
        </div>
      `).join("")}
      <button class="alt" data-act="qaddq">+ Add question</button>
      <br /><br />
      <label><input type="checkbox" id="qp" ${qdraft.isPublic ? "checked" : ""} /> Make public so other people can find it</label>
      <p class="sub">Only share kind, safe stuff. Never put personal info in a public quiz.</p>
      <button data-act="qsave">Save quiz</button>
      <button class="alt" data-go="quizzes">Cancel</button>
    `;

    const matchRows = (x) => x.pairs.map((p, k) => {
      const options = qz.order.map(j => x.pairs[j].r).map(r => `<option value="${esc(r)}" ${qz.m[k] === r ? "selected" : ""}>${esc(r)}</option>`).join("");
      const mark = qz.chk ? (qz.m[k] === p.r ? " ✅" : " ❌ " + esc(p.r)) : "";
      return `
        <div class="card row">
          <b>${esc(p.l)}</b>
          <span>
            <select data-mi="${k}" ${qz.chk ? "disabled" : ""}>
              <option value="">Choose...</option>
              ${options}
            </select>
            ${mark}
          </span>
        </div>
      `;
    }).join("");

    const vQTake = () => {
      const x = qz.questions[qz.i];
      if (!x) {
        const pts = qz.correct * 2 + (qz.correct === qz.questions.length ? 10 : 0);
        return `
          <h2>🎉 Quiz complete!</h2>
          <p>You got ${qz.correct} of ${qz.questions.length} right.</p><p><b>Speed score: ${qz.score || 0}</b> · +${pts} points!</p>
          <button data-go="${qz.from}">Back</button>
        `;
      }

      const t = x.type || "mc";
      const head = `
        <h2>${esc(qz.title)}</h2>
        <p class="sub">Question ${qz.i + 1} of ${qz.questions.length} · ${t === "tf" ? "True or false" : t === "match" ? "Match" : "Multiple choice"} · Score ${qz.score || 0}</p>
        <div class="card"><b>${esc(x.q)}</b>${imgTag(x.img)}</div>
      `;
      let body = "", done = false, correct = false;

      if (t === "tf") {
        done = qz.sel !== null;
        correct = qz.sel === x.ans;
        body = [[true, "True"], [false, "False"]].map(([v, l]) =>
          `<button class="choice ${done ? (v === x.ans ? "green" : v === qz.sel ? "red" : "alt") : "alt"}" data-act="pickTF" data-i="${v ? 1 : 0}" ${done ? "disabled" : ""}>${l}</button>`
        ).join("");
      } else if (t === "match") {
        done = qz.chk;
        correct = done && x.pairs.every((p, k) => qz.m[k] === p.r);
        body = matchRows(x) + (done ? "" : `<button data-act="mcheck">Check answers</button>`);
      } else {
        done = qz.sel !== null;
        correct = qz.sel === x.ans;
        body = qz.order.map((oi, pos) =>
          `<button class="choice ${done ? (oi === x.ans ? "green" : oi === qz.sel ? "red" : "alt") : "alt"}" data-act="pick" data-i="${oi}" ${done ? "disabled" : ""}>${"ABCD"[pos]}. ${esc(x.opts[oi])}</button>`
        ).join("");
      }

      const ok = correct && !qz.timedOut;
      const msg = done ? `<p>${ok ? "✅ Correct! +" + qz.last + " pts" : qz.timedOut ? "⏰ Time's up! 0 pts" : "❌ Not quite. 0 pts"}</p>` : "";
      const clock = done ? "" : `<div class="tbar"><i id="qbar" style="width:${Math.max(0, Math.round((QT - (Date.now() - qz.start)) / QT * 100))}%"></i></div><div class="sub" style="text-align:right"><b id="qleft">${Math.max(0, Math.ceil((QT - (Date.now() - qz.start)) / 1000))}s</b> left · answer fast for more points</div>`;
      const next = done ? `<button data-act="qnext">${qz.i + 1 >= qz.questions.length ? "Finish" : "Next"}</button>` : "";

      return head + clock + body + msg + next;
    };

    const exploreList = () => {
      const s = q.trim().toLowerCase();
      const dl = pub.filter(d => d.title.toLowerCase().includes(s));
      const ql = pubQ.filter(d => d.title.toLowerCase().includes(s));

      return `
        <h3>📚 Flashcard decks</h3>
        ${dl.length ? dl.map(d => `
          <div class="card row">
            <div>
              <b>${esc(d.title)}</b>
              <div class="sub">by ${esc(d.ownerName)} · ${d.cards.length} cards</div>
            </div>
            <div>
              <button data-act="study" data-id="${d.id}">Study</button>
              <button class="alt" data-act="copy" data-id="${d.id}">Save copy</button>
              <button class="alt" data-act="report" data-id="${d.id}">Report</button>
            </div>
          </div>
        `).join("") : `<div class="empty">${s ? "No decks match your search." : "No public decks yet. Be the first to share one!"}</div>`}

        <h3>📝 Quizzes</h3>
        ${ql.length ? ql.map(d => `
          <div class="card row">
            <div>
              <b>${esc(d.title)}</b>
              <div class="sub">by ${esc(d.ownerName)} · ${d.questions.length} questions</div>
            </div>
            <div>
              <button data-act="qtake" data-id="${d.id}">Take</button>
              <button class="alt" data-act="qcopy" data-id="${d.id}">Save copy</button>
              <button class="alt" data-act="qreport" data-id="${d.id}">Report</button>
            </div>
          </div>
        `).join("") : `<div class="empty">${s ? "No quizzes match your search." : "No public quizzes yet. Be the first to share one!"}</div>`}
      `;
    };

    const vExplore = () => `
      <h2>Explore</h2>
      <p class="sub">Decks and quizzes other people made public.</p>
      <br />
      <input id="sq" placeholder="🔍 Search by set name..." value="${esc(q)}" />
      <div id="results">${exploreList()}</div>
    `;

    const vLeaders = () => {
      const sl = streaks.filter(p => p.streak > 0);
      const medal = i => ["🥇","🥈","🥉"][i] || "#" + (i + 1);
      const rowHtml = (p, i, val) => `
        <div class="card row ${p.id === user.uid ? "me" : ""}">
          <div><b>${medal(i)} ${esc(p.username)}</b>${p.id === user.uid ? " (you)" : ""}</div>
          <div><b>${val}</b></div>
        </div>
      `;
      return `
        <h2>Leaderboards</h2>
        <p class="sub">Top 20 players.</p>
        <div class="two">
          <div>
            <h3>⭐ Points</h3>
            ${board.length ? board.map((p, i) => rowHtml(p, i, "⭐ " + p.points)).join("") : '<div class="empty">No one on the board yet.</div>'}
          </div>
          <div>
            <h3>🔥 Streaks</h3>
            ${sl.length ? sl.map((p, i) => rowHtml(p, i, "🔥 " + p.streak + " day" + (p.streak === 1 ? "" : "s"))).join("") : '<div class="empty">No streaks yet. Earn points to start yours!</div>'}
          </div>
        </div>
      `;
    };

    const vAccount = () => {
      const got = AWARDS.filter(a => a.val(P) >= a.goal).length;
      return `
        <h2>Account</h2>

        <div class="card">
          <div style="display:flex;gap:16px;align-items:center">
            <div class="pfp">${esc(P.emoji || "😀")}</div>
            <div>
              <b>Profile picture</b>
              <div class="sub">Pick an emoji. Friends and study rooms will see it.</div>
            </div>
          </div>
          <div class="btns" style="margin-top:12px">
            ${EMOJIS.map((e, i) => `<button class="alt ${((P.emoji || "😀") === e) ? "on" : ""}" style="font-size:22px" data-act="emoji" data-i="${i}">${e}</button>`).join("")}
          </div>
        </div>

        <div class="card">
          <div class="sub">Username. 3 to 20 letters, numbers or underscores. Only one person can have each username, so friends can find you. Don't use your real name.</div>
          <input id="un" maxlength="20" value="${esc(P.username)}" />
          <button data-act="name">Save username</button>
        </div>

        <div class="stats">
          <div class="stat"><b>⭐ ${P.points}</b><span>points</span></div>
          <div class="stat"><b>🔥 ${liveStreak(P)}</b><span>day streak</span></div>
          <div class="stat"><b>🏁 ${bestStreak(P)}</b><span>best streak</span></div>
          <div class="stat"><b>${petEmoji()} ${lvl(P)}</b><span>pet level</span></div>
          <div class="stat"><b>📚 ${P.cardsStudied}</b><span>cards studied</span></div>
          <div class="stat"><b>✅ ${P.tasksDone}</b><span>tasks done</span></div>
          <div class="stat"><b>📝 ${P.quizzesTaken}</b><span>quizzes finished</span></div>
        </div>

        <h3>🏆 Achievements · ${got} / ${AWARDS.length} unlocked</h3>
        <div class="awards">${achTiles(P)}</div>
      `;
    };

    const NAV = [
      ["planner","📅","Planner"],
      ["rev","🗓️","Revision"],
      ["decks","📚","My Decks"],
      ["quizzes","📝","My Quizzes"],
      ["explore","🔍","Explore"],
      ["rooms","🏠","Study Rooms"],
      ["friends","👥","Friends"],
      ["pet","🐾","My Pet"],
      ["leaders","🏆","Leaderboard"],
      ["account","👤","Account"],
      ["notifs","🔔","Notifications"]
    ];
    const NAV_SECTIONS = [
      ["Planning",           ["planner","rev"]],
      ["Study Library",      ["decks","quizzes","explore"]],
      ["Community",          ["rooms","friends","pet"]],
      ["Progress & Profile", ["leaders","account","notifs"]]
    ];

    function renderNav() {
      if (!P) return;
      const f = (view === "study" && study) ? study.from : (view === "qtake" && qz) ? qz.from : "";
      const on = (k) => (
        view === k ||
        (k === "decks" && (view === "edit" || f === "decks")) ||
        (k === "quizzes" && (view === "qedit" || f === "quizzes")) ||
        (k === "explore" && f === "explore") ||
        (k === "rooms" && view === "room") ||
        (k === "friends" && view === "profile")
      ) ? "on" : "";
      $("nav").innerHTML = `

        <div class="brand-wrap" style="margin-bottom:8px; width:100%">
          <img class="brand-svg" src="${window.DD_LOGO}" alt="DueDash logo" />
        </div>

        ${NAV_SECTIONS.map(([title, keys]) => `
          <div class="nav-label">${title}</div>
          ${keys.map((key) => {
            const [k, ic, label] = NAV.find((n) => n[0] === key);
            return `
          <button data-go="${k === "rooms" && room ? "room" : k}" class="${on(k)}">
            <span>${ic}</span>
            ${label}
            ${k === "notifs" && notifs.length ? `<span class="badge">${notifs.length}</span>` : ""}
          </button>`;
          }).join("")}
        `).join("")}
        <div class="chips">
          <span class="chip">${esc(P.emoji || "😀")}</span>
          <span class="chip">⭐ ${P.points}</span>
          <span class="chip">🔥 ${liveStreak(P)}</span>
          <span class="chip">${petEmoji()} Lv ${lvl(P)}</span>
        </div>
        <button class="alt" data-act="out">Log out</button>
      `;
    }

    function render() {
      renderNav();
      const m = $("main");
      m.classList.toggle("anim", view !== lastView);
      lastView = view;

      const list = {
        planner: vPlanner,
        rev: vRev,
        pet: vPet,
        rooms: vRooms,
        room: vRoom,
        decks: vDecks,
        edit: vEdit,
        study: vStudy,
        quizzes: vQuizzes,
        qedit: vQEdit,
        qtake: vQTake,
        explore: vExplore,
        account: vAccount,
        leaders: vLeaders,
        friends: vFriends,
        profile: vProfile,
        notifs: vNotifs
      };

      m.innerHTML = (list[view] || vPlanner)();
      if (view === "room") {
        const el = $("chatlog");
        if (el) el.scrollTop = el.scrollHeight;
      }
    }

    const syncDraft = () => {
      if (!draft) return;
      const t = $("dt"); if (t) draft.title = t.value;
      document.querySelectorAll("[data-f]").forEach(el => {
        const c = draft.cards[+el.dataset.i];
        if (c) c[el.dataset.f] = el.value;
      });
      const p = $("dp"); if (p) draft.isPublic = p.checked;
    };

    const syncQ = () => {
      if (!qdraft) return;
      const qt = $("qt"); if (qt) qdraft.title = qt.value;
      const qp = $("qp"); if (qp) qdraft.isPublic = qp.checked;
      document.querySelectorAll("[data-qf]").forEach(el => {
        const x = qdraft.questions[+el.dataset.qi];
        if (!x) return;
        const f = el.dataset.qf;
        if (f === "q") x.q = el.value;
        if (f === "opt" && x.opts) x.opts[+el.dataset.oi] = el.value;
        if ((f === "l" || f === "r") && x.pairs) x.pairs[+el.dataset.pi][f] = el.value;
      });
    };

    document.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-go],[data-act]");
      if (!b || !P) return;

      if (b.dataset.go) return go(b.dataset.go);

      const a = b.dataset.act;
      const i = +b.dataset.i;
      const id = b.dataset.id;

      try {
        if (a === "out") {
          await leaveRoom();
          musicStop();
          return signOut(auth);
        }

        if (a === "mtoggle") { $("mpanel").classList.toggle("hidden"); return; }
        if (a === "mplay") { await musicPlay(b.dataset.k); return; }
        if (a === "mstop") { musicStop(); renderMusic(); return; }

        if (a === "rmimg") {
          const kind = b.dataset.kind;
          if (kind === "q") { syncQ(); if (qdraft.questions[i]) delete qdraft.questions[i].img; }
          else { syncDraft(); if (draft.cards[i]) delete draft.cards[i][kind === "df" ? "fImg" : "bImg"]; }
          render();
          return;
        }


        if (a === "addtask") {
          const name = $("tk").value.trim();
          if (!name) return;
          await save({ tasks:[...P.tasks, { name, due:$("td").value, done:false }] });
          render();
          checkReminders();
        }

        if (a === "done") {
          await earn(5, { tasks:P.tasks.map((x, j) => j === i ? { ...x, done:true } : x), tasksDone:P.tasksDone + 1 });
          render();
        }

        if (a === "deltask") {
          await save({ tasks:P.tasks.filter((_, j) => j !== i) });
          render();
        }

        if (a === "xadd") {
          const s = $("xs").value.trim();
          const d = $("xd").value;
          if (!s || !d) { alert("Add a subject and an exam date."); return; }
          if (d < plus(0)) { alert("Pick a date that is today or later."); return; }
          if ((P.exams || []).length >= 10) { alert("10 exams is the maximum."); return; }
          await save({ exams:[...(P.exams || []), { subject:s, date:d }] });
          render();
          checkReminders();
        }

        if (a === "xdel") {
          await save({ exams:P.exams.filter((_, j) => j !== i) });
          render();
        }

        if (a === "rdone") {
          const k = b.dataset.k;
          if (P.revDone && P.revDone[k]) return;
          const keep = Object.fromEntries(Object.entries(P.revDone || {}).filter(([x]) => x.slice(0, 10) >= plus(0)));
          await earn(10, { revDone:{ ...keep, [k]: true }, revisionDone:(P.revisionDone || 0) + 1 });
          render();
        }

        if (a === "petsp") {
          await save({ pet:{ ...P.pet, species:PETS[i] } });
          render();

  if (t.id === "rp") {
    if (P) save({ revPer: +t.value });
  }
  if (t.id === "rsm") {
    if (P) save({ studyMin: +t.value });
  }
  if (t.id === "rbm") {
    if (P) save({ breakMin: +t.value });
  }
  if (t.id === "rstart") {
    if (P) save({ revStart: t.value });
  }
  if (t.id === "dp") {
    if (draft) draft.isPublic = t.checked;
  }
  if (t.id === "qp") {
    if (qdraft) qdraft.isPublic = t.checked;
  }
  if (t.id === "qt") {
    if (qdraft) qdraft.title = t.value;
  }
  if (t.id === "dt") {
    if (draft) draft.title = t.value;
  }
});
