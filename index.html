            <rect x="20" y="20" width="780" height="480" rx="90" fill="#eee7da" stroke="#2d4738" stroke-width="18"/>
            <g transform="translate(90 90)">
              <g fill="url(#navdgrad)">
                <path d="M240 26C160 26 95 88 95 180V218C95 310 160 372 240 372H302C357 372 395 337 395 285C395 258 382 236 360 223L299 181L360 142C382 129 395 107 395 80C395 28 357 26 302 26H240Z" opacity="0.96"/>
              </g>
              <g fill="#dfe7db">
                <rect x="92" y="164" width="260" height="46" rx="18" transform="rotate(-20 92 164)" opacity="0.9"/>
                <rect x="110" y="210" width="280" height="46" rx="18" transform="rotate(-20 110 210)" opacity="0.8"/>
                <rect x="130" y="256" width="300" height="46" rx="18" transform="rotate(-20 130 256)" opacity="0.72"/>
                <rect x="150" y="302" width="320" height="46" rx="18" transform="rotate(-20 150 302)" opacity="0.68"/>
              </g>
              <g fill="#dfe7db" stroke="#dfe7db" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
                <path d="M350 110 L430 190 L510 110" opacity="0.9"/>
              </g>
              <g fill="none" stroke="#dfe7db" stroke-width="18" stroke-linecap="round">
                <path d="M360 100 L425 165"/>
                <path d="M425 165 L490 100"/>
              </g>
            </g>
            <text x="410" y="420" text-anchor="middle" font-size="146" font-weight="800" font-family="Segoe UI, Arial, sans-serif" fill="#2a4738" letter-spacing="-7">DueDash</text>
          </svg>
        </div>

        ${NAV.map(([k, ic, label]) => `
          <button data-go="${k === "rooms" && room ? "room" : k}" class="${on(k)}">
            <span>${ic}</span>
            ${label}
            ${k === "notifs" && notifs.length ? `<span class="badge">${notifs.length}</span>` : ""}
          </button>
        `).join("")}
        <div class="chips">
          <span class="chip">${esc(P.emoji || "😀")}</span>
          <span class="chip">⭐ ${P.points}</span>
          <span class="chip">🔥 ${liveStreak(P)}</span>
          <span class="chip">${petEmoji()} Lv ${lvl(P)}</span>
        </div>
        <button class="alt" data-act="out">Log out</button>
      `;
    }

    function render() {
      renderNav();
      const m = $("main");
      m.classList.toggle("anim", view !== lastView);
      lastView = view;

      const list = {
        planner: vPlanner,
        rev: vRev,
        pet: vPet,
        rooms: vRooms,
        room: vRoom,
        decks: vDecks,
        edit: vEdit,
        study: vStudy,
        quizzes: vQuizzes,
        qedit: vQEdit,
        qtake: vQTake,
        explore: vExplore,
        account: vAccount,
        leaders: vLeaders,
        friends: vFriends,
        profile: vProfile,
        notifs: vNotifs
      };

      m.innerHTML = (list[view] || vPlanner)();
      if (view === "room") {
        const el = $("chatlog");
        if (el) el.scrollTop = el.scrollHeight;
      }
    }

    document.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-go],[data-act]");
      if (!b || !P) return;

      if (b.dataset.go) return go(b.dataset.go);

      const a = b.dataset.act;
      const i = +b.dataset.i;
      const id = b.dataset.id;

      try {
        if (a === "out") {
          await leaveRoom();
          musicStop();
          return signOut(auth);
        }

        if (a === "mtoggle") {
          $("mpanel").classList.toggle("hidden");
          return;
        }
        if (a === "mplay") {
          musicPlay(b.dataset.k);
          renderMusic();
          return;
        }
        if (a === "mstop") {
          musicStop();
          renderMusic();
          return;
        }

        if (a === "addtask") {
          const name = $("tk").value.trim();
          if (!name) return;
          await save({ tasks:[...P.tasks, { name, due:$("td").value, done:false }] });
          render();
          checkReminders();
        }

        if (a === "done") {
          await earn(5, { tasks:P.tasks.map((x, j) => j === i ? { ...x, done:true } : x), tasksDone:P.tasksDone + 1 });
          render();
        }

        if (a === "deltask") {
          await save({ tasks:P.tasks.filter((_, j) => j !== i) });
          render();
        }

        if (a === "xadd") {
          const s = $("xs").value.trim();
          const d = $("xd").value;
          if (!s || !d) { alert("Add a subject and an exam date."); return; }
          if (d < plus(0)) { alert("Pick a date that is today or later."); return; }
          if ((P.exams || []).length >= 10) { alert("10 exams is the maximum."); return; }
          await save({ exams:[...(P.exams || []), { subject:s, date:d }] });
          render();
          checkReminders();
        }

        if (a === "xdel") {
          await save({ exams:P.exams.filter((_, j) => j !== i) });
          render();
        }

        if (a === "rdone") {
          const k = b.dataset.k;
          if (P.revDone && P.revDone[k]) return;
          const keep = Object.fromEntries(Object.entries(P.revDone || {}).filter(([x]) => x.slice(0, 10) >= plus(0)));
          await earn(10, { revDone:{ ...keep, [k]: true }, revisionDone:(P.revisionDone || 0) + 1 });
          render();
        }

        if (a === "petsp") {
          await save({ pet:{ ...P.pet, species:PETS[i] } });
          render();
        }
        if (a === "petname") {
          const n = $("pn").value.trim().slice(0, 16);
          if (!n) return;
          await save({ pet:{ ...P.pet, name:n } });
          toast("🐾 Pet renamed!");
          render();
        }

        if (a === "av") {
          await save({ avatar:{ ...P.avatar, [b.dataset.k]: i } });
          render();
          heartbeat();
        }
        if (a === "bd") {
          await save({ backdrop:i });
          render();
        }

        if (a === "rcreate") {
          const name = $("rn").value.trim();
          if (!name) { alert("Give your room a name."); return; }
          const code = mkCode();
          await setDoc(doc(db, "rooms", code), { name, ownerId:user.uid, createdAt:Date.now() });
          await enterRoom(code, { name });
        }

        if (a === "rjoin") {
          const code = $("rc").value.trim().toUpperCase();
          if (!/^[A-Z0-9]{6}$/.test(code)) { alert("Room codes have 6 letters or numbers."); return; }
          const snap = await getDoc(doc(db, "rooms", code));
          if (!snap.exists()) { alert("Room not found. Check the code and try again."); return; }
          await enterRoom(code, { name:snap.data().name });
        }

        if (a === "leave") { await leaveRoom(); go("rooms"); }
        if (a === "copycode") {
          try {
            await navigator.clipboard.writeText(room.code);
            toast("📋 Code copied: " + room.code);
          } catch (err) {
            alert("Your room code is " + room.code);
          }
        }

        if (a === "rstatus") {
          rs.status = b.dataset.k;
          rs.focusEnd = 0;
          heartbeat();
          render();
        }

        if (a === "emote") {
          rs.emote = EMOTES[i];
          rs.emoteAt = Date.now();
          heartbeat();
        }
        if (a === "fstart") {
          rs.status = "focus";
          rs.focusEnd = Date.now() + 25 * 60000;
          heartbeat();
          render();
        }
        if (a === "fstop") {
          rs.status = "studying";
          rs.focusEnd = 0;
          heartbeat();
          render();
        }
        if (a === "chatsend") {
          await sendChat();
          const c = $("chatin");
          if (c) c.focus();
        }
        if (a === "invite") {
          const f = friends.find(x => x.uid === id);
          if (!f || !room) return;
          await addDoc(collection(db, "notifications"), {
            to:id,
            from:user.uid,
            fromName:P.username,
            type:"invite",
            text:(P.username + ' invited you to study in "' + room.name + '"').slice(0,200),
            roomCode:room.code,
            roomName:room.name,
            at:Date.now()
          });
          toast("📨 Invite sent to " + f.username);
        }

        if (a === "fsearch") await searchFriend();
        if (a === "freq") {
          if (friends.some(f => f.uid === id)) return;
          if (notifs.some(n => n.type === "friend" && n.from === id)) {
            alert("They already sent you a request! Accept it in 🔔 Notifications.");
            return;
          }
          try {
            await setDoc(doc(db, "notifications", "fr_" + user.uid + "_" + id), {
              to:id,
              from:user.uid,
              fromName:P.username,
              type:"friend",
              text:P.username + " sent you a friend request",
              at:Date.now()
            });
            fres = { msg:"✅ Friend request sent!" };
          } catch (err) {
            fres = { msg:"Couldn't send the request. You might have already sent one." };
          }
          render();
        }

        if (a === "nacc") {
          const n = notifs.find(x => x.id === id);
          if (!n) return;
          const users = [user.uid, n.from].sort();
          try {
            await setDoc(doc(db, "friendships", users.join("_")), { users, at:Date.now() });
          } catch (err) {
            await deleteDoc(doc(db, "notifications", id));
            alert("You may already be friends with this person.");
            return;
          }
          await deleteDoc(doc(db, "notifications", id));
          try { await addDoc(collection(db, "notifications"), { to:n.from, from:user.uid, fromName:P.username, type:"info", text:P.username + " accepted your friend request 🎉", at:Date.now() }); } catch (err) {}
          try { await loadFriends(); } catch (err) {}
          toast("🎉 You're now friends with " + (n.fromName || "them") + "!");
          render();
        }

        if (a === "ndec") await deleteDoc(doc(db, "notifications", id));

        if (a === "njoin") {
          const n = notifs.find(x => x.id === id);
          if (!n) return;
          const snap = await getDoc(doc(db, "rooms", n.roomCode));
          await deleteDoc(doc(db, "notifications", id));
          if (!snap.exists()) { alert("That room doesn't exist any more."); return; }
          await enterRoom(n.roomCode, { name:snap.data().name });
        }

        if (a === "fview") {
          try {
            const s = await getDoc(doc(db, "profiles", id));
            prof = s.exists() ? { uid:id, ...s.data() } : (friends.find(f => f.uid === id) || null);
          } catch (err) {
            prof = friends.find(f => f.uid === id) || null;
          }
          view = "profile";
          render();
        }

        if (a === "fremove" && confirm("Remove this friend?")) {
          await deleteDoc(doc(db, "friendships", pairId(user.uid, id)));
          await loadFriends();
          go("friends");
        }

        if (a === "rpost") {
          const d = getQuiz(id);
          if (!d || !room) return;
          const qs = shuffle(playable(d)).slice(0, 30).map(x => {
            if ((x.type || "mc") === "tf") return { type:"tf", q:x.q, ans:tfAnswer(x.ans) };
            const order = shuffle(x.opts.map((_, k) => k));
            return { type:"mc", q:x.q, opts:order.map(k => x.opts[k]), ans:order.indexOf(x.ans) };
          });

          if (qs.length < 2) { alert("Races need at least 2 multiple choice or true/false questions."); return; }
          const ref = await addDoc(collection(db, "rooms", room.code, "races"), {
            hostId:user.uid,
            title:d.title.slice(0, 60),
            quizId:d.id,
            questions:qs,
            status:"open",
            startAt:0,
            createdAt:Date.now()
          });
          await setDoc(doc(db, "rooms", room.code, "races", ref.id, "players", user.uid), { username:P.username, emoji:P.emoji || "😀", correct:0, answered:0, finished:false, finishedAt:0 });
          toast("🏁 Race posted! Wait for friends to join, then press Start.");
        }

        if (a === "rjoinrace") {
          if (!race || race.status !== "open") return;
          await pushProgress(0, 0);
          myRace = { rid:race.id, i:0, correct:0, sel:null, paid:false };
          paintRace();
        }

        if (a === "rstart") {
          if (race && race.hostId === user.uid) await updateDoc(raceRef(), { status:"live", startAt:Date.now() + 4000 });
        }

        if (a === "rend") {
          if (race && race.hostId === user.uid) await updateDoc(raceRef(), { status:"done" });
        }

        if (a === "rpick") raceAnswer(i);
        if (a === "preset") {
          await save({ avatar:{ ...PRESETS[i].v } });
          render();
          heartbeat();
        }

        if (a === "emoji") {
          await save({ emoji:EMOJIS[i] });
          render();
          heartbeat();
        }

        if (a === "new") {
          draft = { title:"", cards:[{ front:"", back:"" }], isPublic:false };
          view = "edit";
          render();
        }

        if (a === "edit") {
          const d = getDeck(id);
          draft = { id:d.id, title:d.title, cards:d.cards.map(c => ({ ...c })), isPublic:d.isPublic, wasPublic:d.isPublic };
          view = "edit";
          render();
        }

        if (a === "addcard") {
          if (draft.cards.length < 100) draft.cards.push({ front:"", back:"" });
          render();
        }

        if (a === "delcard") {
          draft.cards.splice(i, 1);
          render();
        }

        if (a === "savedeck") {
          const cards = draft.cards.filter(c => c.front.trim() && c.back.trim());
          if (!draft.title.trim() || !cards.length) { alert("Add a title and at least one full card."); return; }
          const data = { ownerId:user.uid, ownerName:P.username, title:draft.title.trim(), cards, isPublic:draft.isPublic, updated:Date.now() };
          if (draft.id) await updateDoc(doc(db, "decks", draft.id), data);
          else { await addDoc(collection(db, "decks"), data); await save({ decksMade:P.decksMade + 1 }); }
          if (data.isPublic && !draft.wasPublic) await save({ published:P.published + 1 });
          go("decks");
        }

        if (a === "deldeck" && confirm("Delete this deck?")) {
          await deleteDoc(doc(db, "decks", id));
          go("decks");
        }

        if (a === "study") {
          const d = getDeck(id);
          study = { title:d.title, cards:[...d.cards], i:0, flip:false, got:0, from:view };
          view = "study";
          render();
        }

        if (a === "flip") {
          study.flip = !study.flip;
          render();
        }
        if (a === "got" || a === "again") {
          const n = a === "got" ? 1 : 0;
          study.got += n;
          study.i++;
          study.flip = false;
          const fin = study.i >= study.cards.length;
          const perfect = fin && study.got === study.cards.length && study.cards.length >= 5;
          await earn(n + (fin ? 10 : 0), { cardsStudied:P.cardsStudied + 1, perfectDecks:P.perfectDecks + (perfect ? 1 : 0) });
          render();
        }

        if (a === "copy") {
          const d = getDeck(id);
          await addDoc(collection(db, "decks"), { ownerId:user.uid, ownerName:P.username, title:d.title + " (copy)", cards:d.cards, isPublic:false, updated:Date.now() });
          await save({ decksMade:P.decksMade + 1 });
          alert("Saved to My Decks!");
        }
        if (a === "report") {
          await addDoc(collection(db, "reports"), { deckId:id, reporterId:user.uid, createdAt:Date.now() });
          alert("Thanks, this deck was reported.");
        }

        if (a === "qnew") {
          qdraft = { title:"", questions:[newQ("mc")], isPublic:false };
          view = "qedit";
          render();
        }

        if (a === "qedit") {
          const d = getQuiz(id);
          qdraft = {
            id:d.id,
            title:d.title,
            questions:d.questions.map(x => JSON.parse(JSON.stringify({ type:"mc", ...x }))),
            isPublic:d.isPublic,
            wasPublic:d.isPublic
          };
          view = "qedit";
          render();
        }

        if (a === "qaddq") {
          if (qdraft.questions.length < 50) qdraft.questions.push(newQ("mc"));
          render();
        }

        if (a === "qdelq") {
          qdraft.questions.splice(i, 1);
          render();
        }

        if (a === "qsave") {
          const qs = qdraft.questions.map(cleanQ).filter(Boolean);
          if (!qdraft.title.trim() || !qs.length) {
            alert("Add a title and at least one complete question. Multiple choice needs all 4 answers, and match needs at least 2 complete pairs.");
            return;
          }
          const data = { ownerId:user.uid, ownerName:P.username, title:qdraft.title.trim(), questions:qs, isPublic:qdraft.isPublic, updated:Date.now() };
          if (qdraft.id) await updateDoc(doc(db, "quizzes", qdraft.id), data);
          else { await addDoc(collection(db, "quizzes"), data); await save({ quizzesMade:P.quizzesMade + 1 }); }
          if (data.isPublic && !qdraft.wasPublic) await save({ published:P.published + 1 });
          go("quizzes");
        }

        if (a === "qdel" && confirm("Delete this quiz?")) {
          await deleteDoc(doc(db, "quizzes", id));
          go("quizzes");
        }

        if (a === "qtake") {
          const d = getQuiz(id);
          qz = { title:d.title, questions:d.questions, i:0, correct:0, from:view };
          prep();
          view = "qtake";
          render();
        }

        if (a === "pick") {
          if (qz.sel === null) {
            qz.sel = i;
            if (i === qz.questions[qz.i].ans) qz.correct++;
            render();
          }
        }

        if (a === "pickTF") {
          if (qz.sel === null) {
            qz.sel = (i === 1);
            if (qz.sel === qz.questions[qz.i].ans) qz.correct++;
            render();
          }
        }

        if (a === "mcheck") {
          const x = qz.questions[qz.i];
          if (x.pairs.some((_, k) => !qz.m[k])) {
            alert("Choose a match for every item first.");
            return;
          }
          qz.chk = true;
          if (x.pairs.every((p, k) => qz.m[k] === p.r)) qz.correct++;
          render();
        }

        if (a === "qnext") {
          qz.i++;
          prep();
          if (qz.i >= qz.questions.length) {
            const len = qz.questions.length;
            const pts = qz.correct * 2 + (qz.correct === len ? 10 : 0);
            const perfect = qz.correct === len && len >= 3;
            await earn(pts, { quizzesTaken:P.quizzesTaken + 1, perfectQuizzes:P.perfectQuizzes + (perfect ? 1 : 0) });
          }
          render();
        }

        if (a === "qcopy") {
          const d = getQuiz(id);
          await addDoc(collection(db, "quizzes"), { ownerId:user.uid, ownerName:P.username, title:d.title + " (copy)", questions:d.questions, isPublic:false, updated:Date.now() });
          await save({ quizzesMade:P.quizzesMade + 1 });
          alert("Saved to My Quizzes!");
        }

        if (a === "qreport") {
          await addDoc(collection(db, "reports"), { quizId:id, reporterId:user.uid, createdAt:Date.now() });
          alert("Thanks, this quiz was reported.");
        }

        if (a === "name") {
          const n = $("un").value.trim();
          if (!NAME_RE.test(n)) { alert("Usernames need 3 to 20 letters, numbers or underscores, with no spaces."); return; }
          if (n === P.username) return;
          const oldL = P.username.toLowerCase(), newL = n.toLowerCase();
          const batch = writeBatch(db);
          batch.set(doc(db, "usernames", newL), { uid:user.uid, username:n });
          if (oldL !== newL) batch.delete(doc(db, "usernames", oldL));
          try {
            await batch.commit();
          } catch (err) {
            alert("That username is already taken (or not allowed). Try another one.");
            return;
          }
          await save({ username:n });
          toast("✅ Username saved!");
          render();
          heartbeat();
        }
      } catch (err) {
        alert("Something went wrong: " + (err.code || err.message));
      }
    });

    document.addEventListener("input", e => {
      const t = e.target;

      if (t.id === "vol") {
        mus.vol = +t.value;
        if (mus.master) mus.master.gain.value = mus.vol;
        return;
      }

      if (t.id === "sq") {
        q = t.value;
        const root = $("results");
        if (root) root.innerHTML = exploreList();
        return;
      }

      if (t.id === "rsq") {
        rsq = t.value;
        const root = $("rres");
        if (root) root.innerHTML = raceResults();
        return;
      }

      if (t.dataset.f && draft && draft.cards[+t.dataset.i]) {
        draft.cards[+t.dataset.i][t.dataset.f] = t.value;
        return;
      }
      if (t.id === "dt") { if (draft) draft.title = t.value; return; }
      if (t.id === "qt") { if (qdraft) qdraft.title = t.value; return; }
      if (t.matches("[data-qf='opt']")) {
        const qi = +t.dataset.qi;
        const oi = +t.dataset.oi;
        if (qdraft && qdraft.questions[qi]) {
          qdraft.questions[qi].opts[oi] = t.value;
        }
        return;
      }

      if (t.matches("[data-qf='q']")) {
        const qi = +t.dataset.qi;
        if (qdraft && qdraft.questions[qi]) qdraft.questions[qi].q = t.value;
        return;
      }

      if (t.matches("[data-qf='l']")) {
        const qi = +t.dataset.qi;
        const pi = +t.dataset.pi;
        if (qdraft && qdraft.questions[qi]) qdraft.questions[qi].pairs[pi].l = t.value;
        return;
      }

      if (t.matches("[data-qf='r']")) {
        const qi = +t.dataset.qi;
        const pi = +t.dataset.pi;
        if (qdraft && qdraft.questions[qi]) qdraft.questions[qi].pairs[pi].r = t.value;
        return;
      }

      if (t.matches("[data-qf='tf']")) {
        const qi = +t.dataset.qi;
        const v = t.dataset.v === "1";
        if (qdraft && qdraft.questions[qi]) qdraft.questions[qi].ans = v;
        return;
      }

      if (t.matches("[data-qf='ans']")) {
        const qi = +t.dataset.qi;
        const oi = +t.dataset.oi;
        if (qdraft && qdraft.questions[qi]) qdraft.questions[qi].ans = oi;
        return;
      }

      if (t.matches("[data-qf='type']")) {
        const qi = +t.dataset.qi;
        if (qdraft && qdraft.questions[qi]) {
          qdraft.questions[qi].type = t.value;
          if (t.value === "tf") qdraft.questions[qi] = { type:"tf", q:qdraft.questions[qi].q || "", ans: true };
          if (t.value === "match") qdraft.questions[qi] = { type:"match", q:qdraft.questions[qi].q || "Match each item with its partner.", pairs:[{l:"",r:""},{l:"",r:""}] };
          if (t.value === "mc") qdraft.questions[qi] = { type:"mc", q:qdraft.questions[qi].q || "", opts:["","","",""], ans:0 };
        }
        return;
      }

      if (t.matches("[data-mi]")) {
        const k = +t.dataset.mi;
        if (qz && qz.m) qz.m[k] = t.value;
        return;
      }
    });

    document.addEventListener("change", e => {
  const t = e.target;

  if (t.matches("[data-qf='type']")) {
    const qi = +t.dataset.qi;
    const current = qdraft?.questions[qi];
    if (!current) return;

    const text = current.q || "";

    if (t.value === "tf") {
      qdraft.questions[qi] = { type:"tf", q:text, ans:true };
    } else if (t.value === "match") {
      qdraft.questions[qi] = {
        type:"match",
        q:text || "Match each item with its partner.",
        pairs:[{ l:"", r:"" }, { l:"", r:"" }]
      };
    } else {
      qdraft.questions[qi] = {
        type:"mc",
        q:text,
        opts:["","","",""],
        ans:0
      };
    }

    render();
    return;
  }

  if (t.id === "rp") {
    if (P) save({ revPer: +t.value });
  }
  if (t.id === "rsm") {
    if (P) save({ studyMin: +t.value });
  }
  if (t.id === "rbm") {
    if (P) save({ breakMin: +t.value });
  }
  if (t.id === "rstart") {
    if (P) save({ revStart: t.value });
  }
  if (t.id === "dp") {
    if (draft) draft.isPublic = t.checked;
  }
  if (t.id === "qp") {
    if (qdraft) qdraft.isPublic = t.checked;
  }
  if (t.id === "qt") {
    if (qdraft) qdraft.title = t.value;
  }
  if (t.id === "dt") {
    if (draft) draft.title = t.value;
  }
});
  </script>
</body>
</html>
