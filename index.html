<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DueDash</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#0b1020;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--text:#e8ecf8;--mute:#9aa4c4;--p1:#8b5cf6;--p2:#6366f1}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 15% -10%,#2a2170 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#1b2a6b 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
h2{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}
h3{margin:20px 0 10px;font-size:17px}
.hidden{display:none!important}
button{font-family:inherit;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:14.5px;font-weight:600;padding:10px 15px;border:0;border-radius:10px;cursor:pointer;transition:transform .12s,filter .12s;box-shadow:0 4px 14px rgba(99,102,241,.25)}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button.alt{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}
button.alt:hover{background:rgba(255,255,255,.15)}
button.red{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(220,38,38,.25)}
button.green{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 14px rgba(22,163,74,.25)}
button:disabled{cursor:default;transform:none;filter:none}
.link{background:none;box-shadow:none;color:#a5b4fc;text-decoration:underline;font-weight:500}
.link:hover{transform:none;filter:none}
input,select{font-family:inherit;color:var(--text);background:rgba(8,12,30,.7);border:1px solid #2b3358;border-radius:10px;outline:none;transition:border-color .12s,box-shadow .12s}
input{width:100%;font-size:16px;padding:11px 12px;margin-bottom:10px}
input::placeholder{color:#6f7aa3}
input:focus,select:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--p1)}
input[type=radio]{margin:0 0 10px}
select{font-size:15px;padding:9px 10px;max-width:100%}
.opt{display:flex;gap:8px;align-items:center}
.opt.right input:not([type=radio]){border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.tick{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--mute);cursor:pointer;white-space:nowrap;margin-bottom:10px}
.tick input[type=radio]{margin:0;accent-color:#22c55e}
.opt.right .tick{color:#4ade80;font-weight:700}
.tf{display:flex;gap:8px;align-items:center;margin-bottom:8px;cursor:pointer}
.tf input[type=radio]{margin:0}
.pair{display:flex;gap:8px}

#auth{width:calc(100% - 32px);max-width:400px;margin:7vh auto;padding:28px;background:rgba(10,14,35,.72);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#auth img{display:block;width:100%;max-width:200px;margin:0 auto 14px;border-radius:16px}
#auth h2{text-align:center;margin-bottom:14px}

#shell{display:flex;min-height:100vh}
nav{width:230px;background:rgba(10,14,35,.72);backdrop-filter:blur(12px);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
nav img{display:block;width:100%;max-width:150px;margin:0 auto 12px;border-radius:14px}
nav button{background:none;box-shadow:none;text-align:left;color:var(--text);padding:10px 13px;font-weight:500;display:flex;gap:10px;align-items:center}
nav button:hover{background:rgba(255,255,255,.07);transform:none;filter:none}
nav button.on{background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 6px 18px rgba(99,102,241,.35);font-weight:600}
nav button.alt{justify-content:center;background:rgba(255,255,255,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:auto 0 8px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,40px);max-width:980px}

@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim>*{animation:fade .3s ease both}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}
.card.row:hover{border-color:rgba(139,92,246,.45)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.two{display:flex;gap:16px;flex-wrap:wrap}
.two>div{flex:1;min-width:260px}
.sub{font-size:13px;color:var(--mute)}
.overdue{color:#fca5a5}
.done .nm{text-decoration:line-through;opacity:.5}
.err{color:#fca5a5;min-height:20px;margin-bottom:8px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mute)}
.me{border-color:var(--p1)!important;background:rgba(139,92,246,.14)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px}
.stat span{font-size:12.5px;color:var(--mute)}

.big{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;text-align:center;cursor:pointer;border-radius:18px;background:linear-gradient(145deg,rgba(139,92,246,.2),rgba(99,102,241,.08));border:1px solid rgba(139,92,246,.4);gap:8px}
.choice{display:block;width:100%;text-align:left;margin-bottom:8px;padding:13px 15px;font-size:16px}

.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;opacity:.65}
.ach.got{opacity:1;border-color:#fbbf24;background:linear-gradient(145deg,rgba(251,191,36,.16),rgba(251,191,36,.04))}
.ach .ic{font-size:30px;margin-bottom:4px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:9px 0 5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),#22d3ee);border-radius:99px}
.ach.got .bar i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}

.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.25);box-shadow:none}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:#fff;transform:scale(1.15)}
button.pk{padding:7px 11px;font-size:13px}
button.pk.on{background:linear-gradient(135deg,var(--p1),var(--p2));border-color:transparent}
.prev{display:flex;justify-content:center;align-items:center}
.prev svg{width:150px;height:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}

.scene{position:relative;min-height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:56px 12px 14px;flex-wrap:wrap;margin-bottom:12px}
.deco{position:absolute;top:10px;font-size:44px;opacity:.55;pointer-events:none}
.who{position:relative;text-align:center;width:120px}
.who svg{width:110px;height:auto;display:block;margin:0 auto}
.who .wn{font-weight:700;font-size:13px;background:rgba(0,0,0,.5);border-radius:999px;padding:2px 9px;display:inline-block;margin-top:4px;color:#fff}
.who .st{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.who .wp{position:absolute;right:0;bottom:44px;font-size:26px}
.bub{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;color:#222;border-radius:12px;padding:4px 9px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.3)}

/* study calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.cal-w{text-align:center;font-size:12px;font-weight:600;color:var(--mute);padding:4px 0}
.cal-d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:120px;font-size:12px}
.cal-d.today{border-color:var(--p1);background:rgba(139,92,246,.14)}
.cal-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px;margin-bottom:4px}
.cal-h span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.cal-h b{font-size:13px}
.cal-s{background:rgba(99,102,241,.22);border-radius:7px;padding:5px 6px;margin-top:4px}
.cal-s.done{opacity:.55}
.cal-s.done .nm{text-decoration:line-through}
.cal-t{font-size:10.5px;color:var(--mute)}
.cal-s button{padding:3px 7px;font-size:11px;margin-top:4px;border-radius:7px}
.cal-x{background:rgba(245,158,11,.25);border:1px solid #f59e0b;border-radius:7px;padding:5px 6px;margin-top:4px;font-weight:600}
.cal-r{color:var(--mute);font-size:11px;margin-top:6px}

#music{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#mbtn{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px}
#mbtn.playing{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.55)}50%{box-shadow:0 0 0 12px rgba(139,92,246,0)}}
#mpanel{width:240px;background:rgba(10,14,35,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#mpanel button{width:100%;margin-bottom:6px;text-align:left}
#mpanel input[type=range]{padding:0;margin:8px 0 0}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1b1305;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
 #shell{flex-direction:column}
 nav{position:static;height:auto;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:12px}
 nav img{max-width:56px;margin:0 8px 0 0}
 nav button{padding:8px 10px;font-size:13px}
 .chips{margin:6px 0 0;width:100%}
 .cal{grid-template-columns:1fr}
 .cal-w,.cal-e{display:none}
 .cal-d{min-height:0}
}
</style>
</head>
<body>
<div id="auth" class="hidden">
  <img src="logo.png" alt="DueDash">
  <h2 id="at">Log in</h2>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="err" id="er"></div>
  <button id="ab" style="width:100%">Log in</button>
  <button id="sw" class="link" style="width:100%;margin-top:8px">New here? Create an account</button>
</div>
<div id="shell" class="hidden">
  <nav id="nav"></nav>
  <main id="main"></main>
  <div id="music"><div id="mpanel" class="hidden"></div><button id="mbtn" data-act="mtoggle">🎵</button></div>
</div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAnalytics} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,collection,query,where,getDocs,limit,orderBy,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyAOBeCaNPNp_hr_0o0r5p6faW9XfkG1W3k",
  authDomain:"duedash-9e120.firebaseapp.com",
  projectId:"duedash-9e120",
  storageBucket:"duedash-9e120.firebasestorage.app",
  messagingSenderId:"893428485494",
  appId:"1:893428485494:web:fd1ecccf31c8c9763cfe57",
  measurementId:"G-MWPNS59FFT"
};
const app=initializeApp(firebaseConfig);
try{getAnalytics(app)}catch(e){}
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day=(o=0)=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const ix=(arr,i)=>arr[Math.abs(Math.trunc(+i||0))%arr.length];
let user,P,view="planner",lastView="",decks=[],pub=[],quizzes=[],pubQ=[],board=[],streaks=[],draft=null,qdraft=null,study=null,qz=null,q="";
let room=null,members=[],unsub=null,hb=0,rt=0,tickN=0,rs={status:"studying",emote:"",emoteAt:0,focusEnd:0};

/* ---------- pet, goal, achievements ---------- */
const GOAL=20;
const PETS=["🐱","🐶","🦊","🐰","🐼","🐲"];
const lvl=p=>1+Math.floor(Math.sqrt((p.points||0)/10));
const bestStreak=p=>Math.max(p.bestStreak||0,p.streak||0);
const A=(icon,name,desc,goal,val)=>({icon,name,desc,goal,val});
const AWARDS=[
 A("🌱","First Steps","Earn 10 points",10,p=>p.points||0),
 A("⭐","Point Collector","Earn 100 points",100,p=>p.points||0),
 A("💎","Point Hoarder","Earn 500 points",500,p=>p.points||0),
 A("👑","Point Legend","Earn 2,000 points",2000,p=>p.points||0),
 A("🏗️","Deck Builder","Make your first deck",1,p=>p.decksMade||0),
 A("🏛️","Library Builder","Make 10 decks",10,p=>p.decksMade||0),
 A("🌍","Sharing Is Caring","Publish a deck or quiz",1,p=>p.published||0),
 A("📣","Community Star","Publish 5 decks or quizzes",5,p=>p.published||0),
 A("🧠","Quick Learner","Study 25 cards",25,p=>p.cardsStudied||0),
 A("🎓","Scholar","Study 250 cards",250,p=>p.cardsStudied||0),
 A("✅","Task Crusher","Finish 5 tasks",5,p=>p.tasksDone||0),
 A("🛠️","Task Master","Finish 50 tasks",50,p=>p.tasksDone||0),
 A("🔥","On Fire","Reach a 3 day streak",3,bestStreak),
 A("⚡","Week Warrior","Reach a 7 day streak",7,bestStreak),
 A("🚀","Unstoppable","Reach a 30 day streak",30,bestStreak),
 A("📝","Quiz Maker","Make your first quiz",1,p=>p.quizzesMade||0),
 A("🎯","Quiz Whiz","Finish 3 quizzes",3,p=>p.quizzesTaken||0),
 A("🏅","Perfectionist","Get 5 perfect quiz scores (3+ questions)",5,p=>p.perfectQuizzes||0),
 A("💯","Flawless Memory","Finish 3 decks (5+ cards) without pressing Again",3,p=>p.perfectDecks||0),
 A("🗓️","Revision Rookie","Complete 5 revision sessions",5,p=>p.revisionDone||0),
 A("⏱️","Focus Fan","Finish 5 focus sessions",5,p=>p.focusDone||0),
 A("🐾","Pet Parent","Raise your pet to level 5",5,lvl),
 A("🧑‍🤝‍🧑","Study Buddy","Join a study room",1,p=>p.roomsJoined||0)
];
const unlocked=p=>AWARDS.filter(a=>a.val(p)>=a.goal).map(a=>a.name);
let toastT;
const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),4500)};

/* ---------- anime characters ---------- */
const SK=["#ffe3d1","#f6cba8","#e3a97c","#bd8460","#8b5a3c"];
const HR=["#2b2b3a","#6b3f2a","#d9a441","#e6e0d2","#ff7eb6","#6c8cff","#8e5bd9","#e8503a"];
const EY=["#4aa3ff","#37c96a","#a06bff","#ff8f4a","#e8506a","#3fd0c9"];
const FT=["#6366f1","#ef4444","#22c55e","#f59e0b","#ec4899","#0ea5e9"];
const HS=["Spiky","Long","Twin tails","Bun"];
const AC=["None","Glasses","Headphones","Cat ears","Bow"];
const avatar=(a)=>{
 a=a||{};
 const sk=ix(SK,a.skin),hr=ix(HR,a.hair),ey=ix(EY,a.eye),ft=ix(FT,a.fit);
 const hs=Math.abs(Math.trunc(+a.hs||0))%4,ac=Math.abs(Math.trunc(+a.acc||0))%5;
 const back=hs===1?`<path d="M20 58 Q16 128 38 132 L82 132 Q104 128 100 58 Z" fill="${hr}"/>`
  :hs===2?`<ellipse cx="12" cy="86" rx="11" ry="30" fill="${hr}"/><ellipse cx="108" cy="86" rx="11" ry="30" fill="${hr}"/>`
  :hs===3?`<circle cx="60" cy="10" r="15" fill="${hr}"/>`:"";
 const fringe=hs===0
  ?`<path d="M23 62 Q16 22 38 14 L45 30 L56 8 L64 30 L77 10 L81 30 Q104 22 97 62 Q91 42 79 38 Q68 52 58 40 Q44 50 38 38 Q28 46 23 62 Z" fill="${hr}"/>`
  :`<path d="M22 62 Q18 14 60 12 Q102 14 98 62 Q92 40 80 34 Q70 50 58 36 Q44 48 38 34 Q27 42 22 62 Z" fill="${hr}"/>`;
 const ties=hs===2?`<circle cx="15" cy="60" r="5" fill="#ff7eb6"/><circle cx="105" cy="60" r="5" fill="#ff7eb6"/>`:"";
 const eye=(cx)=>`<ellipse cx="${cx}" cy="64" rx="9" ry="11.5" fill="#1a1a2e"/><ellipse cx="${cx}" cy="65" rx="7.4" ry="10" fill="${ey}"/><ellipse cx="${cx}" cy="67" rx="3.8" ry="5.2" fill="#1a1a2e" opacity=".55"/><circle cx="${cx-3}" cy="59.5" r="3.2" fill="#fff"/><circle cx="${cx+4}" cy="70" r="1.7" fill="#fff"/><path d="M${cx-10} 57 Q${cx} 49 ${cx+10} 57" stroke="#1a1a2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
 const acc=ac===1?`<circle cx="44" cy="64" r="14" fill="none" stroke="#2b2b3a" stroke-width="2.6"/><circle cx="76" cy="64" r="14" fill="none" stroke="#2b2b3a" stroke-width="2.6"/><path d="M58 64 L62 64" stroke="#2b2b3a" stroke-width="2.6"/>`
  :ac===2?`<path d="M20 60 Q18 8 60 8 Q102 8 100 60" fill="none" stroke="#2b2b3a" stroke-width="5"/><rect x="11" y="52" width="13" height="26" rx="6" fill="#ff5c8a"/><rect x="96" y="52" width="13" height="26" rx="6" fill="#ff5c8a"/>`
  :ac===3?`<path d="M24 34 L28 4 L50 22 Z" fill="${hr}"/><path d="M96 34 L92 4 L70 22 Z" fill="${hr}"/><path d="M30 28 L32 12 L43 22 Z" fill="#ffb3c7"/><path d="M90 28 L88 12 L77 22 Z" fill="#ffb3c7"/>`
  :ac===4?`<path d="M84 20 L106 10 L106 34 Z" fill="#ff5c8a"/><path d="M84 20 L62 10 L62 34 Z" fill="#ff5c8a"/><circle cx="84" cy="21" r="5" fill="#ff3d73"/>`:"";
 return`<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">${back}
<path d="M22 140 Q24 106 60 102 Q96 106 98 140 Z" fill="${ft}"/>
<rect x="52" y="88" width="16" height="18" rx="7" fill="${sk}"/>
<path d="M48 103 L60 119 L72 103 Z" fill="#fff"/>
<ellipse cx="60" cy="58" rx="37" ry="39" fill="${sk}"/>
<ellipse cx="35" cy="78" rx="7" ry="4" fill="#ff8aa0" opacity=".45"/><ellipse cx="85" cy="78" rx="7" ry="4" fill="#ff8aa0" opacity=".45"/>
${eye(44)}${eye(76)}
<path d="M34 49 Q43 44 52 47" stroke="${hr}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M68 47 Q77 44 86 49" stroke="${hr}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<path d="M54 84 Q60 89 66 84" stroke="#b5485d" stroke-width="2.2" fill="none" stroke-linecap="round"/>
${fringe}${ties}${acc}</svg>`;
};
const BACKDROPS=[
 {n:"Cozy room",bg:"linear-gradient(#3b2a50,#7a4b6b 60%,#b9805a)",d:["🪟","🛋️","🕯️"]},
 {n:"Starry night",bg:"radial-gradient(circle at 20% 20%,#2d2a7a,transparent 40%),linear-gradient(#050816,#1b1a55)",d:["🌙","✨","⭐"]},
 {n:"Library",bg:"linear-gradient(#2a1a10,#6b4428)",d:["📚","🕰️","📖"]},
 {n:"Sakura",bg:"linear-gradient(#ffd6e8,#ff9fc4)",d:["🌸","🌸","🌸"]},
 {n:"Rainy café",bg:"linear-gradient(#1d2433,#3b4a66)",d:["🌧️","☕","🌃"]},

const mus={ctx:null,master:null,stops:[],cur:null,vol:.4};
const musicStop=()=>{mus.stops.forEach(f=>{try{f()}catch(e){}});mus.stops=[];if(mus.master){try{mus.master.disconnect()}catch(e){}mus.master=null}mus.cur=null};
const noiseSrc=(ctx,brown)=>{
 const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);let last=0;
 for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w*.5}
 const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;
};
const addRain=(ctx,out,amt)=>{
 const n=noiseSrc(ctx,false),hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=900;
 const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=7000;
 const g=ctx.createGain();g.gain.value=amt;n.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);
 mus.stops.push(()=>n.stop());
};
const addOcean=(ctx,out)=>{
 const n=noiseSrc(ctx,true),lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=500;
 const g=ctx.createGain();g.gain.value=.5;
 const lfo=ctx.createOscillator();lfo.frequency.value=.09;const lg=ctx.createGain();lg.gain.value=.35;
 lfo.connect(lg);lg.connect(g.gain);n.connect(lp);lp.connect(g);g.connect(out);lfo.start();
 mus.stops.push(()=>{n.stop();lfo.stop()});
};
const addPad=(ctx,out,chords,gap)=>{
 const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1100;
 const dl=ctx.createDelay();dl.delayTime.value=.45;const fb=ctx.createGain();fb.gain.value=.35;dl.connect(fb);fb.connect(dl);
 const bus=ctx.createGain();bus.gain.value=.5;
 bus.connect(lp);lp.connect(out);lp.connect(dl);dl.connect(out);
 let k=0;
 const play=()=>{
  const t=ctx.currentTime,notes=chords[k++%chords.length];
  notes.forEach(f=>{
   const o=ctx.createOscillator();o.type="triangle";o.frequency.value=f;
   const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+gap*.35);g.gain.linearRampToValueAtTime(0,t+gap*1.25);
   o.connect(g);g.connect(bus);o.start(t);o.stop(t+gap*1.3);
  });
 };
 play();const id=setInterval(play,gap*1000);
 mus.stops.push(()=>clearInterval(id));
};
const CH1=[[220,261.63,329.63,392],[174.61,220,261.63,329.63],[261.63,329.63,392,493.88],[196,246.94,293.66,329.63]];
const CH2=[[146.83,174.61,220,261.63],[196,246.94,293.66,329.63],[130.81,164.81,196,246.94,293.66],[220,261.63,329.63,392]];
const musicPlay=k=>{
 musicStop();
 const ctx=mus.ctx||(mus.ctx=new (window.AudioContext||window.webkitAudioContext)());
 ctx.resume();
 const out=ctx.createGain();out.gain.value=mus.vol;out.connect(ctx.destination);mus.master=out;
 if(k==="pad")addPad(ctx,out,CH1,6);
 if(k==="lofi"){addPad(ctx,out,CH2,4);addRain(ctx,out,.1)}
 if(k==="rain")addRain(ctx,out,.5);
 if(k==="ocean")addOcean(ctx,out);
 mus.cur=k;
};

/* revision timetable */
const planDays=()=>{
 const t0=plus(0);
 const ex=(P.exams||[]).filter(e=>e.date>=t0);
 if(!ex.length)return[];
 const last=ex.reduce((m,e)=>e.date>m?e.date:m,"");
 const out=[],used={};
 ex.forEach(e=>used[e.subject+e.date]=0);
 for(let o=0;o<=120;o++){
  const d=plus(o);
  if(d>last)break;
  const active=ex.filter(e=>e.date>d);
  const slots=[];
  if(active.length){
   for(let s=0;s<(P.revPer||2);s++){
    let best=null,bs=-1;
    active.forEach(e=>{
     const left=Math.max(1,Math.round((new Date(e.date+"T00:00:00")-new Date(d+"T00:00:00"))/864e5));
     const sc=(1/left)/(used[e.subject+e.date]+1);
     if(sc>bs){bs=sc;best=e}
    });
    used[best.subject+best.date]++;
    slots.push(best.subject);
   }
  }
  out.push({d,slots,exams:ex.filter(e=>e.date===d)});
 }
 return out;
};

const qBody=(x,qi)=>{
 if(x.type==="tf")return`<label class="tf"><input type="radio" name="tf${qi}" data-qf="tf" data-qi="${qi}" data-v="1" ${x.ans?"checked":""}> True</label>
<label class="tf"><input type="radio" name="tf${qi}" data-qf="tf" data-qi="${qi}" data-v="0" ${x.ans?"":"checked"}> False</label>

 if(x.type==="match")return x.pairs.map((p,pi)=>`<div class="pair"><input data-qf="l" data-qi="${qi}" data-pi="${pi}" placeholder="Item ${pi+1}" maxlength="80" value="${esc(p.l)}"><input data-qf="r" data-qi="${qi}" data-pi="${pi}" placeholder="Its match" maxlength="80" value="${esc(p.r)}"></div>`).join("")+
`<div class="sub">Fill in at least 2 pairs. They get shuffled when someone takes the quiz.</div>`;
 return x.opts.map((o,oi)=>`<div class="opt ${x.ans===oi?"right":""}"><label class="tick"><input type="radio" name="ans${qi}" data-qf="ans" data-qi="${qi}" data-oi="${oi}" ${x.ans===oi?"checked":""}> ${x.ans===oi?"✓ Correct":"Mark correct"}</label><input data-qf="opt" data-qi="${qi}" data-oi="${oi}" placeholder="Answer ${"ABCD"[oi]}" maxlength="120" value="${esc(o)}"></div>`).join("")+
`<div class="sub">Click "Mark correct" next to the right answer. The answers get shuffled when someone takes the quiz.</div>`;
};

const matchRows=x=>x.pairs.map((p,k)=>{
 const opts=qz.order.map(j=>x.pairs[j].r).map(r=>`<option value="${esc(r)}" ${qz.m[k]===r?"selected":""}>${esc(r)}</option>`).join("");
 const mark=qz.chk?(qz.m[k]===p.r?" ✅":" ❌ "+esc(p.r)):"";
 return`<div class="card row"><b>${esc(p.l)}</b><span><select data-mi="${k}" ${qz.chk?"disabled":""}><option value="">Choose...</option>${opts}</select>${mark}</span></div>`;

const vQTake=()=>{
 const x=qz.questions[qz.i];
 if(!x){
  const pts=qz.correct*2+(qz.correct===qz.questions.length?10:0);
  return`<h2>🎉 Quiz complete!</h2><p>You got ${qz.correct} of ${qz.questions.length} right. +${pts} points!</p><button data-go="${qz.from}">Back</button>`;
 }
 const t=x.type||"mc";
 const head=`<h2>${esc(qz.title)}</h2><p class="sub">Question ${qz.i+1} of ${qz.questions.length} · ${t==="tf"?"True or false":t==="match"?"Match":"Multiple choice"}</p><div class="card"><b>${esc(x.q)}</b></div>`;
 const btn=(cls,label,act,val,dis)=>`<button class="choice ${cls}" data-act="${act}" data-i="${val}" ${dis?"disabled":""}>${label}</button>`;
 let body="",done=false,right=false;
 if(t==="tf"){
  done=qz.sel!==null;right=qz.sel===x.ans;
  body=[[true,"True"],[false,"False"]].map(([v,l])=>btn(done?(v===x.ans?"green":v===qz.sel?"red":"alt"):"alt",l,"pickTF",v?1:0,done)).join("");
 }else if(t==="match"){
  done=qz.chk;right=done&&x.pairs.every((p,k)=>qz.m[k]===p.r);
  body=matchRows(x)+(done?"":`<button data-act="mcheck">Check answers</button>`);
 }else{
  done=qz.sel!==null;right=qz.sel===x.ans;
  body=qz.order.map((oi,pos)=>btn(done?(oi===x.ans?"green":oi===qz.sel?"red":"alt"):"alt","ABCD"[pos]+". "+esc(x.opts[oi]),"pick",oi,done)).join("");
 }
 const msg=done?`<p>${right?"✅ Correct!":"❌ Not quite."}</p>`:"";
 const next=done?`<button data-act="qnext">${qz.i+1>=qz.questions.length?"Finish":"Next"}</button>`:"";
 return head+body+msg+next;
};

/* ---------- clicks ---------- */
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-go],[data-act]");
 if(!b||!P)return;
 if(b.dataset.go)return go(b.dataset.go);
 const a=b.dataset.act,i=+b.dataset.i,id=b.dataset.id;
 try{
  if(a==="out"){await leaveRoom();musicStop();return signOut(auth)}

  /* music */
  if(a==="mtoggle"){$("mpanel").classList.toggle("hidden");return}
  if(a==="mplay"){musicPlay(b.dataset.k);renderMusic();return}
  if(a==="mstop"){musicStop();renderMusic();return}

  /* planner */
  if(a==="addtask"){
   const name=$("tk").value.trim();if(!name)return;
   await save({tasks:[...P.tasks,{name,due:$("td").value,done:false}]});render();
  }
  if(a==="done"){await earn(5,{tasks:P.tasks.map((x,j)=>j===i?{...x,done:true}:x),tasksDone:P.tasksDone+1});render()}
  if(a==="deltask"){await save({tasks:P.tasks.filter((_,j)=>j!==i)});render()}

  /* revision planner */
  if(a==="xadd"){
   const s=$("xs").value.trim(),d=$("xd").value;
   if(!s||!d){alert("Add a subject and an exam date.");return}
   if(d<plus(0)){alert("Pick a date that is today or later.");return}
   if((P.exams||[]).length>=10){alert("10 exams is the maximum.");return}
   await save({exams:[...(P.exams||[]),{subject:s,date:d}]});render();
  }
  if(a==="xdel"){await save({exams:P.exams.filter((_,j)=>j!==i)});render()}
  if(a==="rdone"){
   const k=b.dataset.k;
   if(P.revDone&&P.revDone[k])return;
   const keep=Object.fromEntries(Object.entries(P.revDone||{}).filter(([x])=>x.slice(0,10)>=plus(0)));
   await earn(10,{revDone:{...keep,[k]:true},revisionDone:(P.revisionDone||0)+1});render();
  }

  /* pet */
  if(a==="petsp"){await save({pet:{...P.pet,species:PETS[i]}});render()}
  if(a==="petname"){const n=$("pn").value.trim().slice(0,16);if(!n)return;await save({pet:{...P.pet,name:n}});toast("🐾 Pet renamed!");render()}

  /* characters, backdrops, rooms */
  if(a==="av"){await save({avatar:{...P.avatar,[b.dataset.k]:i}});render();heartbeat()}
  if(a==="bd"){await save({backdrop:i});render()}
  if(a==="rcreate"){
   const name=$("rn").value.trim();
   if(!name){alert("Give your room a name.");return}
   const code=mkCode();
   await setDoc(doc(db,"rooms",code),{name,ownerId:user.uid,createdAt:Date.now()});
   await enterRoom(code,{name});
  }
  if(a==="rjoin"){
   const code=$("rc").value.trim().toUpperCase();
   if(!/^[A-Z0-9]{6}$/.test(code)){alert("Room codes have 6 letters or numbers.");return}
   const snap=await getDoc(doc(db,"rooms",code));
   if(!snap.exists()){alert("Room not found. Check the code and try again.");return}
   await enterRoom(code,{name:snap.data().name});
  }
  if(a==="leave"){await leaveRoom();go("rooms")}
  if(a==="copycode"){try{await navigator.clipboard.writeText(room.code);toast("📋 Code copied: "+room.code)}catch(err){alert("Your room code is "+room.code)}}
  if(a==="rstatus"){rs.status=b.dataset.k;rs.focusEnd=0;heartbeat();render()}
  if(a==="emote"){rs.emote=EMOTES[i];rs.emoteAt=Date.now();heartbeat()}
  if(a==="fstart"){rs.status="focus";rs.focusEnd=Date.now()+25*60000;heartbeat();render()}
  if(a==="fstop"){rs.status="studying";rs.focusEnd=0;heartbeat();render()}

  /* flashcard decks */
  if(a==="new"){draft={title:"",cards:[{front:"",back:""}],isPublic:false};view="edit";render()}
  if(a==="edit"){const d=getDeck(id);draft={id:d.id,title:d.title,cards:d.cards.map(c=>({...c})),isPublic:d.isPublic,wasPublic:d.isPublic};view="edit";render()}
  if(a==="addcard"){if(draft.cards.length<100)draft.cards.push({front:"",back:""});render()}
  if(a==="delcard"){draft.cards.splice(i,1);render()}
  if(a==="savedeck"){
   const cards=draft.cards.filter(c=>c.front.trim()&&c.back.trim());
   if(!draft.title.trim()||!cards.length){alert("Add a title and at least one full card.");return}
   const data={ownerId:user.uid,ownerName:P.username,title:draft.title.trim(),cards,isPublic:draft.isPublic,updated:Date.now()};
   if(draft.id)await updateDoc(doc(db,"decks",draft.id),data);
   else{await addDoc(collection(db,"decks"),data);await save({decksMade:P.decksMade+1})}
   if(data.isPublic&&!draft.wasPublic)await save({published:P.published+1});
   go("decks");
  }
  if(a==="deldeck"&&confirm("Delete this deck?")){await deleteDoc(doc(db,"decks",id));go("decks")}
  if(a==="study"){const d=getDeck(id);study={title:d.title,cards:[...d.cards],i:0,flip:false,got:0,from:view};view="study";render()}
  if(a==="flip"){study.flip=!study.flip;render()}
  if(a==="got"||a==="again"){
   const n=a==="got"?1:0;study.got+=n;study.i++;study.flip=false;
   const fin=study.i>=study.cards.length;
   const perfect=fin&&study.got===study.cards.length&&study.cards.length>=5;
   await earn(n+(fin?10:0),{cardsStudied:P.cardsStudied+1,perfectDecks:P.perfectDecks+(perfect?1:0)});render();
  }
  if(a==="copy"){
   const d=getDeck(id);
   await addDoc(collection(db,"decks"),{ownerId:user.uid,ownerName:P.username,title:d.title+" (copy)",cards:d.cards,isPublic:false,updated:Date.now()});
   await save({decksMade:P.decksMade+1});alert("Saved to My Decks!");
  }
  if(a==="report"){await addDoc(collection(db,"reports"),{deckId:id,reporterId:user.uid,createdAt:Date.now()});alert("Thanks, this deck was reported.")}

  /* quizzes */
  if(a==="qnew"){qdraft={title:"",questions:[newQ("mc")],isPublic:false};view="qedit";render()}
  if(a==="qedit"){
   const d=getQuiz(id);
   qdraft={id:d.id,title:d.title,questions:d.questions.map(x=>JSON.parse(JSON.stringify({type:"mc",...x}))),isPublic:d.isPublic,wasPublic:d.isPublic};
   view="qedit";render();
  }
  if(a==="qaddq"){if(qdraft.questions.length<50)qdraft.questions.push(newQ("mc"));render()}
  if(a==="qdelq"){qdraft.questions.splice(i,1);render()}
  if(a==="qsave"){
   const qs=qdraft.questions.map(cleanQ).filter(Boolean);
   if(!qdraft.title.trim()||!qs.length){alert("Add a title and at least one complete question. Multiple choice needs all 4 answers, and match needs at least 2 complete pairs.");return}
   const data={ownerId:user.uid,ownerName:P.username,title:qdraft.title.trim(),questions:qs,isPublic:qdraft.isPublic,updated:Date.now()};
   if(qdraft.id)await updateDoc(doc(db,"quizzes",qdraft.id),data);
   else{await addDoc(collection(db,"quizzes"),data);await save({quizzesMade:P.quizzesMade+1})}
   if(data.isPublic&&!qdraft.wasPublic)await save({published:P.published+1});
   go("quizzes");
  }
  if(a==="qdel"&&confirm("Delete this quiz?")){await deleteDoc(doc(db,"quizzes",id));go("quizzes")}
  if(a==="qtake"){const d=getQuiz(id);qz={title:d.title,questions:d.questions,i:0,correct:0,from:view};prep();view="qtake";render()}
  if(a==="pick"){
   if(qz.sel===null){qz.sel=i;if(i===qz.questions[qz.i].ans)qz.correct++;render()}
  }
  if(a==="pickTF"){
   if(qz.sel===null){qz.sel=(i===1);if(qz.sel===qz.questions[qz.i].ans)qz.correct++;render()}
  }
  if(a==="mcheck"){
   const x=qz.questions[qz.i];
   if(x.pairs.some((_,k)=>!qz.m[k])){alert("Choose a match for every item first.");return}
   qz.chk=true;
   if(x.pairs.every((p,k)=>qz.m[k]===p.r))qz.correct++;
   render();
  }
  if(a==="qnext"){
   qz.i++;prep();
   if(qz.i>=qz.questions.length){
    const len=qz.questions.length;
    const pts=qz.correct*2+(qz.correct===len?10:0);
    const perfect=qz.correct===len&&len>=3;
    await earn(pts,{quizzesTaken:P.quizzesTaken+1,perfectQuizzes:P.perfectQuizzes+(perfect?1:0)});
   }
   render();
  }
  if(a==="qcopy"){
   const d=getQuiz(id);
   await addDoc(collection(db,"quizzes"),{ownerId:user.uid,ownerName:P.username,title:d.title+" (copy)",questions:d.questions,isPublic:false,updated:Date.now()});
   await save({quizzesMade:P.quizzesMade+1});alert("Saved to My Quizzes!");
  }
  if(a==="qreport"){await addDoc(collection(db,"reports"),{quizId:id,reporterId:user.uid,createdAt:Date.now()});alert("Thanks, this quiz was reported.")}

  if(a==="name"){const n=$("un").value.trim();if(!n)return;await save({username:n});alert("Username saved!");render();heartbeat()}
 }catch(err){alert("Something went wrong: "+(err.code||err.message))}
});

document.addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="vol"){mus.vol=+t.value;if(mus.master)mus.master.gain.value=mus.vol;return}
 if(t.id==="rp"){save({revPer:+t.value}).then(render);return}
 if(t.id==="sq"){q=t.value;$("results").innerHTML=exploreList();return}
 if(qz&&view==="qtake"&&t.dataset.mi!==undefined){qz.m[+t.dataset.mi]=t.value;return}
 if(qdraft&&view==="qedit"){
  const x=qdraft.questions[+t.dataset.qi];
  const f=t.dataset.qf;
  if(f==="type"){
   const nq=newQ(t.value);
   if(x.q.trim())nq.q=x.q;
   qdraft.questions[+t.dataset.qi]=nq;
   render();return;
  }
  if(f==="ans"){x.ans=+t.dataset.oi;render();return}
  if(f==="q")x.q=t.value;
  else if(f==="opt")x.opts[+t.dataset.oi]=t.value;
  else if(f==="tf")x.ans=t.dataset.v==="1";
  else if(f==="l")x.pairs[+t.dataset.pi].l=t.value;
  else if(f==="r")x.pairs[+t.dataset.pi].r=t.value;
  else if(t.id==="qt")qdraft.title=t.value;
  else if(t.id==="qp")qdraft.isPublic=t.checked;
  return;
 }
 if(!draft||view!=="edit")return;
 if(t.dataset.f)draft.cards[+t.dataset.i][t.dataset.f]=t.value;
 else if(t.id==="dt")draft.title=t.value;
 else if(t.id==="dp")draft.isPublic=t.checked;
});

/* start time box: saves when the person finishes picking, not on every keystroke */
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="rstart"&&t.value&&P){save({revStart:t.value}).then(render)}
});
</script>
